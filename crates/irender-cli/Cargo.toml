[package]
name = "irender-cli"
description = "Validate and render iRender documents from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "irender"
path = "src/main.rs"

[dependencies]
irender-core = { workspace = true, default-features = true }
irender-html = { workspace = true, default-features = true, features = ["parallel"] }
irender-ui-kit.workspace = true
irender-chart-kit.workspace = true
irender-flow-kit.workspace = true
irender-markdown-kit.workspace = true
irender-map-kit.workspace = true
irender-twin-kit.workspace = true
irender-icon-kit.workspace = true
clap.workspace = true
schemars.workspace = true
serde_json.workspace = true
