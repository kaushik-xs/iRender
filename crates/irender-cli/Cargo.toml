[package]
name = "irender-cli"
description = "Validate and render iRender documents from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "irender"
path = "src/main.rs"

[dependencies]
irender-core.workspace = true
irender-html = { workspace = true, features = ["parallel"] }
irender-ui-kit.workspace = true
clap.workspace = true
schemars.workspace = true
serde_json.workspace = true
