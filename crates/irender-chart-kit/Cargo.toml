[package]
name = "irender-chart-kit"
description = "Charts for iRender documents, drawn by Apache ECharts: every series type, themed from the document's tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Without the CSS validator and YAML, so the browser renderer (irender-wasm) stays small;
# the CLI and hosts turn them on.
irender-core = { workspace = true, default-features = false }
irender-html = { workspace = true, default-features = false }
serde_json.workspace = true

[dev-dependencies]
irender-html.workspace = true
irender-ui-kit.workspace = true
