[package]
name = "irender-ui-kit"
description = "A ready-made component kit for iRender: buttons, cards, alerts, form controls, tables and more"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Without the CSS validator and YAML, so the browser renderer (irender-wasm) stays small;
# the CLI and hosts turn them on.
irender-core = { workspace = true, default-features = false }
irender-html = { workspace = true, default-features = false }
indexmap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The tests check CSS as the CLI does.
irender-html = { workspace = true, default-features = true }
