root:
  type: stack
  props: { gap: 20 }
  style: { max-width: 1180px, margin: 0 auto, padding: 32px 24px, font-family: $font.body, color: $color.text, background: $color.surface }
  children:
    - type: stack
      props: { gap: 4 }
      children:
        - { type: ui-heading, props: { level: 2, text: دفتر المبيعات } }
        - { type: ui-text, props: { variant: muted, text: "الطلبات من يوليو إلى أكتوبر، حسب المنطقة." } }
    - type: ui-data-table
      props:
        rows: "{{ orders }}"
        title: دفتر المبيعات
        search: true
        bindGroupBy: groupBy
        resizable: true
        reorderable: true
        bindColumns: layout
        export: daftar-al-mabiat
        pageSize: 10
        sort: -date
      children:
        - { type: ui-data-table-column, props: { field: id, label: الطلب, width: 96, pin: left } }
        - { type: ui-data-table-column, props: { field: customer, label: العميل, groupable: true } }
        - { type: ui-data-table-column, props: { field: region, label: المنطقة, groupable: true, filter: select } }
        - { type: ui-data-table-column, props: { field: rep, label: المندوب, groupable: true } }
        - { type: ui-data-table-column, props: { field: date, label: التاريخ, format: date } }
        - { type: ui-data-table-column, props: { field: status, label: الحالة, cell: badge, groupable: true, filter: select, tones: { Paid: success, Pending: warning, Overdue: destructive } } }
        - { type: ui-data-table-column, props: { field: net, label: الصافي, group: المبالغ, format: currency, currency: INR, decimals: 0, summary: sum } }
        - { type: ui-data-table-column, props: { field: tax, label: الضريبة, group: المبالغ, format: currency, currency: INR, decimals: 0, summary: sum } }
        - { type: ui-data-table-column, props: { field: total, label: الإجمالي, group: المبالغ, format: currency, currency: INR, decimals: 0, summary: sum } }
