# Block: the sales ledger in Arabic, right to left. `lang: ar` gives the page
# dir="rtl": the table, its toolbar and its menus mirror, and the arrow keys and drags
# follow; the interface text comes from `labels`. Amounts and dates follow `lang` too.
#
#   cargo run -p irender-cli -- render examples/blocks/i18n-02.yaml --ui-kit --icon-kit -o i18n-02.html
version: 1
lang: ar
labels:
  "Search…": "بحث…"
  "Reset": "إعادة تعيين"
  "Export": "تصدير"
  "Download the rows that pass the filters as CSV": "تنزيل الصفوف المطابقة بصيغة CSV"
  "View": "عرض"
  "Columns": "الأعمدة"
  "Group by": "تجميع حسب"
  "None": "بلا"
  "Filter by {name}": "تصفية حسب {name}"
  "Clear filter": "مسح التصفية"
  "No values": "لا توجد قيم"
  "No results.": "لا توجد نتائج."
  "(none)": "(بلا قيمة)"
  "Rows per page": "صفوف في الصفحة"
  "Page {page} of {pages}": "الصفحة {page} من {pages}"
  "Go to first page": "الصفحة الأولى"
  "Go to previous page": "الصفحة السابقة"
  "Go to next page": "الصفحة التالية"
  "Go to last page": "الصفحة الأخيرة"
  "{total} row(s)": "{total} صف"
  "(of {all})": "(من {all})"
  "{n} results": { zero: "لا نتائج", one: "نتيجة واحدة", two: "نتيجتان", few: "{n} نتائج", many: "{n} نتيجة", other: "{n} نتيجة" }
  "Resize {name}": "تغيير عرض {name}"
