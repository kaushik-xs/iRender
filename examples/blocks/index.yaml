# The blocks: whole pages built from the UI kit, chart kit and icon kit, in the style of
# shadcn/ui's blocks. Each is previewed live; examples/build.sh renders them next to this
# page.
#
#   examples/build.sh && python3 examples/serve.py   # then open /blocks/
version: 1
state:
  filter: all
root:
  type: stack
  props: { gap: 32 }
  style:
    max-width: 1200px
    margin: 0 auto
    padding: 40px 24px 80px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 12 }
      children:
        # The Theme button in the bar at the top picks every theme option and the mode;
        # the previews below follow live.
        - { type: ui-heading, props: { level: 1, text: Blocks } }
        - type: ui-text
          props: { variant: lead, text: "Whole pages to start from: a dashboard, a report builder, an incident room, a sales pipeline, data tables, a tree, a kanban board, a calendar, an AI chat, a docs page, sidebars, login and sign-up, settings, pricing, a Markdown editor, a theme customizer, forms and imports, a pivot table, a scheduler, a floor plan, and error pages and empty states. Each is one document using the UI kit, chart kit, Markdown kit and icon kit; open it, or read its source." }
        - type: ui-toggle-group
          props:
            bind: filter
            variant: outline
            size: sm
            options: [{ value: all, label: All }, { value: dashboard, label: Dashboard }, { value: table, label: Data table }, { value: map, label: Map }, { value: sidebar, label: Sidebar }, { value: login, label: Login }, { value: signup, label: Sign up }, { value: forms, label: Forms }, { value: settings, label: Settings }, { value: errors, label: Errors and empty states }, { value: app, label: Apps }, { value: pricing, label: Pricing }, { value: chat, label: Chat }, { value: editor, label: Editor }, { value: docs, label: Docs }, { value: theme, label: Theme }]

    - type: list
      props:
        as: block
        items:
          - { id: report-01, category: dashboard, title: "A report builder: chart type, grouping, measure, aggregate, split, sort and top N are all controls on one chart; saved reports set them in one click, a clicked bar filters the rows, and the Config tab shows the chart as YAML", kits: [ui-kit, chart-kit, icon-kit], height: 1180 }
          - { id: incident-01, category: dashboard, title: "An incident in progress: a service map coloured from each service's data, the clicked service's latency and errors, a runbook whose progress is worked out from its checkboxes, updates and a status page preview", kits: [ui-kit, chart-kit, flow-kit, icon-kit], height: 1460 }
          - { id: field-01, page: field-01/, category: app, title: "A field inspection app to install: jobs, a checklist, photos stamped and marked up, a signature, and reports kept without a connection and sent later", kits: [ui-kit, icon-kit], height: 860 }
          - { id: crm-01, category: table, title: "A sales pipeline from one list of deals: a board with swimlanes and card detail picked in its settings, a table grouped by stage, and forecast charts, all following each move", kits: [ui-kit, chart-kit, icon-kit], height: 1000 }
          - { id: dashboard-01, category: dashboard, title: "A dashboard with sidebar, charts, data table and a ⌘K palette", kits: [ui-kit, chart-kit, icon-kit], height: 860 }
          - { id: dashboard-02, category: dashboard, title: "An operations dashboard to arrange: drag tiles by their header, resize them from the corner or use the arrow keys, with the layout in state and a locked alerts strip", kits: [ui-kit, chart-kit, icon-kit], height: 1080 }
          - { id: data-table-01, category: table, title: "Tasks: search, faceted filters, sorting, paging, a View menu and bulk actions on selected rows", kits: [ui-kit, icon-kit], height: 860 }
          - { id: data-table-02, category: table, title: "Orders wired to charts both ways: the charts draw the filtered rows, a bar click filters the table, sparklines in cells and a chart in each row's details", kits: [ui-kit, chart-kit, icon-kit], height: 1180 }
          - { id: data-table-03, category: table, title: "Inventory from plain column objects: rows from state, a filter from a toggle, a sticky header and a clicked row's chart", kits: [ui-kit, chart-kit, icon-kit], height: 760 }
          - { id: data-table-04, category: table, title: "5,000 rows from an API, one tab per paging option: infinite scroll with a virtual table, Load more, and server pages", kits: [ui-kit, icon-kit], height: 820 }
          - { id: data-table-06, category: table, title: "Tickets filtered from a side panel: lists with counts, numbers, dates and text, each with its operators, as chips; one filter object drives the table and a chart", kits: [ui-kit, chart-kit, icon-kit], height: 900 }
          - { id: data-table-07, category: table, title: "A sales ledger grouped by region with subtotals, an Amounts band over the money columns, columns to resize and move (kept in state), and CSV export", kits: [ui-kit, icon-kit], height: 820 }
          - { id: i18n-01, category: table, title: "The sales ledger in Spanish: the document's lang and labels give the table's interface text, counts with their plural forms", kits: [ui-kit, icon-kit], height: 820 }
          - { id: i18n-02, category: table, title: "The sales ledger in Arabic, right to left: the table, its toolbar and menus mirror, with the interface text from labels", kits: [ui-kit, icon-kit], height: 820 }
          - { id: data-table-05, category: table, title: "Rows inside rows: a budget tree whose projects load when opened, with pinned columns, and an org chart from flat rows", kits: [ui-kit, icon-kit], height: 1180 }
          - { id: tree-01, category: table, title: "Company locations as a tree: search, counts, checkboxes with bulk delete, add by name, drag or Alt+arrows to reorganise, and the selected location's details", kits: [ui-kit, icon-kit], height: 820 }
          - { id: calendar-01, category: table, title: "A plant's calendar: maintenance, audits, shifts and meetings in month, week and list views, coloured by category, with the event clicked beside it", kits: [ui-kit, icon-kit], height: 920 }
          - { id: gantt-01, category: table, title: "A project plan as a Gantt chart: phases that fold, progress on each task, arrows to the tasks waiting on it, the beta freeze and launch, zoom, and the task clicked beside it", kits: [ui-kit, chart-kit, icon-kit], height: 760 }
          - { id: kanban-01, category: table, title: "A sprint board: drag cards between columns (or Alt and the arrows), a column limit, add a card, and the open card's details beside it", kits: [ui-kit, icon-kit], height: 900 }
          - { id: kanban-02, category: table, title: "A hiring pipeline: each candidate's card built from the kit's own avatar, stars and badges, still dragged between stages, with a Shortlist button of its own", kits: [ui-kit, icon-kit], height: 860 }
          - { id: ticket-01, category: table, title: "A support ticket: its status in colour, the SLA as a ring, the activity timeline with field changes and comments, and the customer's star rating", kits: [ui-kit, icon-kit], height: 1000 }
          - { id: expense-01, category: table, title: "An expense claim with its receipts: drop files to upload them, preview images, PDFs and spreadsheets, and download them all as a zip", kits: [ui-kit, icon-kit], height: 1000 }
          - { id: map-01, category: map, title: "Sites on a map: the list shows what's in view, a status filter narrows both, and the site picked in either opens with its details. On OpenStreetMap, or Google Maps with a key", kits: [ui-kit, map-kit, icon-kit], height: 760 }
          - { id: mail-01, category: sidebar, title: "A mail client in three resizable panels: folders that fold away, the folder's messages, and the message picked", kits: [ui-kit, icon-kit], height: 640 }
          - { id: workspace-01, category: sidebar, title: "A team workspace in a rail layout: icons open the inbox, a project tree and the week beside the page, with the sprint board as the main content", kits: [ui-kit, icon-kit], height: 760 }
          - { id: docs-01, category: docs, title: "A documentation page: pages on the left, the article, and an On this page list that follows the section you're reading", kits: [ui-kit, icon-kit], height: 860 }
          - { id: otp-verify, category: login, title: "Two-step sign-in: a six-digit code checked as it completes, with a resend link", kits: [ui-kit, icon-kit], height: 720 }
          - { id: empty-states, category: errors, title: "Empty states: no data, no results, out of stock, an empty cart and inbox, and more, each with its own illustration in the theme's colours", kits: [ui-kit, chart-kit], height: 1100 }
          - { id: error-404, category: errors, title: "404: page not found, with a search box", kits: [ui-kit], height: 720 }
          - { id: error-500, category: errors, title: "500: server error, with a reference for support", kits: [ui-kit], height: 720 }
          - { id: error-403, category: errors, title: "403: no access, with a request for it", kits: [ui-kit], height: 720 }
          - { id: error-503, category: errors, title: "503: down for maintenance, with progress", kits: [ui-kit], height: 720 }
          - { id: error-offline, category: errors, title: "Offline, with changes waiting to sync", kits: [ui-kit], height: 720 }
          - { id: error-session, category: errors, title: "Session expired: sign in again", kits: [ui-kit], height: 720 }
          - { id: chat, category: chat, title: "A full-screen AI chat: conversations in a sidebar, threaded replies, answers streamed in as Markdown, and replies with UI: charts, a carousel, links, video", kits: [ui-kit, chart-kit, icon-kit, markdown-kit], height: 760 }
          - { id: data-table-08, category: table, title: "A price list edited like a spreadsheet: cells checked as they're typed, ranges copied and pasted, undo, rows added and deleted, unsaved changes in a bar, and an Excel export", kits: [ui-kit, icon-kit], height: 760 }
          - { id: import-01, category: forms, title: "Enrolling students from a spreadsheet: columns matched by name, rows put right in a table, and the good ones added", kits: [ui-kit, icon-kit], height: 820 }
          - { id: invoice-01, category: forms, title: "An invoice being written: lines that add up, checks on the client and dates, a signature, and codes to pay with", kits: [ui-kit, icon-kit], height: 1240 }
          - { id: intake-01, category: forms, title: "A clinic's new-patient form in steps: phone, insurance number, visit times, a questionnaire and consent", kits: [ui-kit, icon-kit], height: 720 }
          - { id: profile-01, category: forms, title: "A member's profile: a cropped picture, checked fields, contact cards, unsaved changes, and a session that asks before it ends", kits: [ui-kit, icon-kit], height: 1180 }
          - { id: record-01, category: dashboard, title: "A wind turbine's record: figures with trends, facts edited in place, pictures, what changed, and comments", kits: [ui-kit, icon-kit], height: 1240 }
          - { id: pivot-01, category: table, title: "A hospital's admissions in a pivot table: drag fields, fold groups, sort, tint, export, and see the rows behind a cell", kits: [ui-kit, icon-kit], height: 900 }
          - { id: schedule-01, category: dashboard, title: "A salon's bookings by person and room: drag to move, stretch or make one, clashes marked, and a tour of the page", kits: [ui-kit, icon-kit], height: 760 }
          - { id: plan-01, category: dashboard, title: "A restaurant's tables on its floor plan: zoom, pick, move, find, and fade those too small for the party", kits: [ui-kit, icon-kit], height: 800 }
          - { id: seats-flight-01, category: table, title: "Seats on an aircraft with two decks: cabins from a few words, taken seats, exits and wings, up to two picked, and their total", kits: [ui-kit, icon-kit], height: 760 }
          - { id: seats-cinema-01, category: table, title: "Cinema, theatre and auditorium seats: curved rows, aisles, sections with prices, wheelchair spaces and seats for two, and an order that adds up", kits: [ui-kit, icon-kit], height: 800 }
          - { id: seats-hall-01, category: table, title: "A hall set out as a banquet, cabaret, classroom, theatre, U, boardroom, hollow square or exhibition, with the guests at their places", kits: [ui-kit, icon-kit], height: 820 }
          - { id: floors-01, category: table, title: "A building on five floors: car park, lobby, conference, offices and roof, with lifts and stairs between them and one search for all", kits: [ui-kit, icon-kit], height: 760 }
          - { id: keep-01, page: keep-01/, category: app, title: "A place to keep things, to install: what other apps share with it, sharing on, inviting contacts, notifications by topic, a badge on its icon, and a lock with a passkey or PIN", kits: [ui-kit, icon-kit], height: 820 }
          - { id: devices-01, category: app, title: "A bench of devices: a scale on a serial port, a Bluetooth sensor, a USB label printer, NFC tags, and a file opened and saved", kits: [ui-kit, icon-kit], height: 1000 }
          - { id: capture-01, category: app, title: "A notebook that takes anything: speech as text, voice notes, papers scanned to a PDF, video and a screen, with rows to swipe and to have read out", kits: [ui-kit, icon-kit], height: 1000 }
          - { id: visit-01, category: app, title: "Site visits: places on a map, checking in and out with a photo, the route recorded, and a compass to the next one", kits: [ui-kit, icon-kit], height: 980 }
          - { id: rules-01, category: settings, title: "A payment alert's rule: nested conditions tried on recent payments, branches, who's told, and the message's template", kits: [ui-kit, icon-kit], height: 1280 }
          - { id: review-01, category: docs, title: "A contract read and signed: a PDF with notes and a signature on it, the clause that changed, and questions about it", kits: [ui-kit, icon-kit], height: 1040 }
          - { id: scan-01, category: table, title: "Counting a library's stock: a camera or handheld scanner, counts put right in the table, and labels", kits: [ui-kit, icon-kit], height: 840 }
          - { id: ops-01, category: dashboard, title: "A nightly data job's run: figures, a log that follows, its steps against time, and its settings with what saving changes", kits: [ui-kit, icon-kit], height: 1320 }
          - { id: agent-01, category: chat, title: "A travel assistant at work: files, sources behind an answer, something to approve, questions to settle, and the run's steps", kits: [ui-kit, icon-kit], height: 1320 }
          - { id: sidebar-07, category: sidebar, title: A sidebar that collapses to icons, kits: [ui-kit, icon-kit], height: 640 }
          - { id: sidebar-03, category: sidebar, title: A sidebar with submenus, kits: [ui-kit, icon-kit], height: 640 }
          - { id: login-03, category: login, title: A login page with a muted background color, kits: [ui-kit, icon-kit], height: 720 }
          - { id: login-04, category: login, title: A login page with form and image, kits: [ui-kit], height: 720 }
          - { id: signup, category: signup, title: "A sign-up form that checks itself as you type, with a password checklist and strength bar", kits: [ui-kit, icon-kit], height: 860 }
          - { id: settings, category: settings, title: "Account settings: a section menu, a form per section and a danger zone", kits: [ui-kit, icon-kit], height: 900 }
          - { id: markdown, category: editor, title: "Writing a post: edited as readers see it, saved as Markdown, with a File / Edit / View menubar and a split Publish button", kits: [ui-kit, markdown-kit], height: 900 }
          - { id: theme, category: theme, title: "A theme customizer: palette, chart colours, radius, density, text size, font", kits: [ui-kit, chart-kit, icon-kit], height: 1300 }
          - { id: pricing, category: pricing, title: "Pricing: a site header with a navigation menu, a monthly / yearly switch, plans, a comparison table and questions", kits: [ui-kit, icon-kit], height: 1000 }
      style: { display: flex, flex-direction: column, gap: 48 }
      children:
        - type: if
          props: { when: "{{ filter == null || filter == 'all' || filter == block.category }}" }
          children:
            - type: element
              props: { tag: section }
              attrs: { id: "{{ block.id }}", aria-labelledby: "{{ block.id }}-title" }
              style: { display: flex, flex-direction: column, gap: 12 }
              children:
                - type: element
                  style: { display: flex, flex-wrap: wrap, align-items: center, gap: 8 }
                  children:
                    - type: element
                      props: { tag: h2 }
                      attrs: { id: "{{ block.id }}-title" }
                      style: { margin: 0, font-size: 15, font-weight: 500 }
                      children:
                        - { type: text, props: { value: "{{ block.title }}" } }
                    - { type: ui-badge, props: { text: "{{ block.id }}", variant: secondary } }
                    - type: list
                      props: { items: "{{ block.kits }}", as: kit }
                      style: { display: contents }
                      children:
                        - { type: ui-badge, props: { text: "{{ kit }}", variant: outline } }
                    - type: element
                      style: { display: flex, gap: 8, margin-left: auto }
                      children:
                        - type: ui-button
                          props: { label: Source, variant: ghost, size: sm, href: "https://github.com/kaushik-xs/iRender/blob/main/examples/blocks/{{ block.id }}.yaml" }
                        - { type: ui-button, props: { label: Open, size: sm, href: "{{ block.page || block.id + '.html' }}" } }
                - type: element
                  props: { tag: iframe }
                  attrs: { src: "{{ block.page || block.id + '.html' }}", title: "{{ block.title }}", loading: lazy }
                  style:
                    display: block
                    width: 100%
                    height: "{{ block.height }}"
                    border: 1px solid $color.border
                    border-radius: 12
                    background: $color.surface
