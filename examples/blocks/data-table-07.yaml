root:
  type: stack
  props: { gap: 20 }
  style: { max-width: 1180px, margin: 0 auto, padding: 32px 24px, font-family: $font.body, color: $color.text, background: $color.surface }
  children:
    - type: stack
      props: { gap: 4 }
      children:
        - { type: ui-heading, props: { level: 2, text: Sales ledger } }
        - { type: ui-text, props: { variant: muted, text: "Orders for July to October, by region. Group, resize, move and export from the table's own controls." } }
    - type: ui-data-table
      props:
        rows: "{{ orders }}"
        title: Sales ledger
        search: Search orders…
        bindGroupBy: groupBy
        resizable: true
        reorderable: true
        bindColumns: layout
        export: sales-ledger
        pageSize: 0
        sort: -date
        height: 620
      children:
        - { type: ui-data-table-column, props: { field: id, label: Order, width: 96 } }
        - { type: ui-data-table-column, props: { field: customer, label: Customer, groupable: true } }
        - { type: ui-data-table-column, props: { field: region, label: Region, groupable: true, filter: select } }
        - { type: ui-data-table-column, props: { field: rep, label: Rep, groupable: true } }
        - { type: ui-data-table-column, props: { field: date, label: Date, format: date } }
        - { type: ui-data-table-column, props: { field: status, label: Status, cell: badge, groupable: true, filter: select, tones: { Paid: success, Pending: warning, Overdue: destructive } } }
        - { type: ui-data-table-column, props: { field: net, label: Net, group: Amounts, format: currency, currency: INR, decimals: 0, summary: sum } }
        - { type: ui-data-table-column, props: { field: tax, label: GST, group: Amounts, format: currency, currency: INR, decimals: 0, summary: sum } }
        - { type: ui-data-table-column, props: { field: total, label: Total, group: Amounts, format: currency, currency: INR, decimals: 0, summary: sum } }
    - type: ui-text
      props: { variant: muted, text: "{{ layout ? 'Column layout in state: ' + layout.order.length + ' columns, ' + layout.hidden.length + ' hidden' : 'Move or resize a column, and its layout is kept in state.' }}" }
