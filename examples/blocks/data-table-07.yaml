# Block: a sales ledger in a `ui-data-table` with its newer layout tools. The rows are
# grouped by region (pick another grouping, or none, from View), each group under a header
# row with its count and subtotals; the money columns sit under an "Amounts" band. Drag a
# header's edge to resize the column, or the header itself to move it (Alt and the arrow
# keys on it do the same): the layout is state (`bindColumns`), so a page could keep it.
# Export downloads the rows that pass the filters as CSV.
#
#   cargo run -p irender-cli -- render examples/blocks/data-table-07.yaml --ui-kit --icon-kit -o data-table-07.html
version: 1
state:
  groupBy: region
  layout: null
  orders:
    - { id: "SO-1002", customer: "Kashmir Crafts", region: "North", rep: "Ravi Kumar", date: "2026-07-03", net: 78500, tax: 14130, total: 92630, status: "Paid" }
