# Block: a project plan as a Gantt chart. Phases fold open and closed (click their
# name or their bar), tasks show how far along they are, arrows join each task to the
# ones waiting on it, and dashed lines mark the beta freeze and the launch. Zoom with
# the buttons or ⌘/Ctrl and the wheel, and drag to pan. Click a task to see it beside
# the chart; the bars are coloured by team, and the legend hides a team's tasks. Drag
# a bar to move its task, or an end to stretch it (on a phone, hold it first); on a
# focused row, Alt with Left or Right moves the task a day, and with Shift its end. A
# task that starts before the one it waits for ends gets a red arrow.
#
#   cargo run -p irender-cli -- render examples/blocks/gantt-01.yaml --ui-kit --chart-kit --icon-kit -o gantt-01.html
version: 1
state:
  task: null
  tasks:
    - { id: plan, name: Planning, owner: Asha Rao }
    - { id: brief, group: plan, name: Product brief, team: Product, owner: Asha Rao, start: "2026-11-02", end: "2026-11-06", progress: 100 }
    - { id: research, group: plan, name: Customer interviews, team: Design, owner: Meera Iyer, start: "2026-11-04", end: "2026-11-13", progress: 100 }
    - { id: scope, group: plan, name: Scope signed off, start: "2026-11-16", milestone: true, after: [brief, research] }
    - { id: build, name: Build, owner: Ravi Kumar }
    - { id: design, group: build, name: Screens and prototype, team: Design, owner: Meera Iyer, start: "2026-11-16", end: "2026-11-27", progress: 70, after: scope }
    - { id: api, group: build, name: Orders API, team: Engineering, owner: Ravi Kumar, start: "2026-11-16", end: "2026-12-04", progress: 45, after: scope }
    - { id: web, group: build, name: Web app, team: Engineering, owner: Kaushik Sundar, start: "2026-11-30", end: "2026-12-18", progress: 10, after: [design, api] }
    - { id: mobile, group: build, name: Mobile app, team: Engineering, owner: Kaushik Sundar, start: "2026-12-07", end: "2026-12-24", progress: 0, after: api }
    - { id: launch, name: Launch, owner: Asha Rao }
    - { id: beta, group: launch, name: Private beta, team: Product, owner: Asha Rao, start: "2027-01-04", end: "2027-01-15", after: [web, mobile] }
    - { id: docs, group: launch, name: Help centre articles, team: Product, owner: Meera Iyer, start: "2027-01-04", end: "2027-01-12" }
    - { id: ship, group: launch, name: General availability, start: "2027-01-20", milestone: true, after: beta }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 28px 16px 64px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 32px 24px 80px }
  children:
    - type: stack
      style: { max-width: 1400px, margin: 0 auto, gap: 20px }
      children:
        - type: stack
          style: { gap: 6px }
          children:
            - { type: ui-breadcrumb, props: { items: [ { label: iRender, href: "#" }, { label: Projects, href: "#" }, { label: Orders portal } ] } }
            - { type: ui-heading, props: { level: 2, text: "Orders portal: plan to launch" } }
            - { type: ui-text, props: { variant: muted, text: "2 Nov – 20 Jan · 3 phases · 10 tasks" } }
        - type: element
          style: { display: grid, gap: 20px, grid-template-columns: "minmax(0, 1fr)", "@xl": { grid-template-columns: "minmax(0, 1fr) 300px" }, align-items: start }
          children:
            - type: ui-card
              style: { padding: 8px 4px }
              children:
                - type: ui-chart
                  props:
                    type: gantt
                    title: Orders portal plan
                    data: "{{ tasks }}"
                    series: team
                    columns: [ name, { field: owner, name: Owner, width: 120 } ]
                    markers:
                      - { at: "2026-12-21", name: Beta freeze }
                      - { at: "2027-01-20", name: Launch, color: "#16a34a" }
                    zoom: true
                    bindRow: task
                    bindData: tasks
            - type: ui-card
              props: { title: "{{ task ? task.name : 'No task picked' }}", description: "{{ task ? (task.team ? task.team : 'Milestone') : 'Click a bar to see the task here.' }}" }
              children:
                - type: if
                  props: { when: "{{ task }}" }
                  children:
                    - type: element
                      props: { tag: dl }
                      style: { display: grid, grid-template-columns: "max-content 1fr", gap: "10px 16px", margin: 0, font-size: 14px, align-items: center }
                      children:
                        - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: Owner } } ] }
                        - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ task.owner ? task.owner : '—' }}" } } ] }
                        - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: Starts } } ] }
                        - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ task.start }}" } } ] }
                        - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: Ends } } ] }
                        - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ task.end ? task.end : task.start }}" } } ] }
                    - type: if
                      props: { when: "{{ task.team }}" }
                      children:
                        - { type: ui-separator }
                        - type: stack
                          style: { gap: 8px, font-size: 14px }
                          children:
                            - { type: text, props: { value: "{{ (task.progress ? task.progress : 0) + '% done' }}" } }
                            - { type: ui-progress, props: { value: "{{ task.progress ? task.progress : 0 }}" } }
