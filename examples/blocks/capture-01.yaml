# Block: a notebook that takes anything: voice notes, speech as text, papers scanned to a PDF,
# short videos and pictures of a screen, in a list whose rows are swiped, and read out.
#
#   cargo run -p irender-cli -- render examples/blocks/capture-01.yaml --ui-kit --icon-kit -o capture-01.html
version: 1
state:
  tab: notes
  note: ""
  voices: []
  pages: []
  pdf: null
  clip: null
  screen: null
  awake: false
  starred: []
  hidden: []
  entries:
    - { id: a, title: Site visit, text: "The east wall needs repointing. Ask for two quotes before the end of the month." }
    - { id: b, title: Reading list, text: "Three papers on soil drainage. The second one has the diagrams." }
    - { id: c, title: Call with Grace, text: "She can join on Thursdays. Send the notes the day before." }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 32px 16px 80px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 40px 24px 96px }
  children:
    - type: stack
      style: { max-width: 1040px, margin: 0 auto, gap: 24px }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 4px }
              children:
                - { type: ui-heading, props: { level: 2, text: Notebook } }
                - { type: ui-text, props: { variant: muted, text: "Speak, scan, record or type" } }
            - { type: ui-wake-lock, props: { bind: awake } }
        - type: element
          style: { display: grid, gap: 20px, align-items: start, grid-template-columns: "minmax(0, 1fr)", "@md": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" } }
          children:
            - type: stack
              style: { gap: 20px }
              children:
                - type: ui-card
                  props: { title: Write or speak }
                  children:
                    - type: stack
                      style: { gap: 12px }
                      children:
                        - { type: ui-textarea, props: { bind: note, rows: 4, placeholder: What happened? }, attrs: { aria-label: Note } }
                        - { type: ui-voice-input, props: { bind: note, continuous: true } }
                - { type: ui-card, props: { title: Voice notes }, children: [ { type: ui-audio-recorder, props: { bind: voices, multiple: true, max: 120 } } ] }
                - { type: ui-card, props: { title: Papers, description: "Straightened, cleaned up and made a PDF" }, children: [ { type: ui-document-scanner, props: { bind: pages, bindPdf: pdf, paper: a4, filter: colour } } ] }
            - type: stack
              style: { gap: 20px }
              children:
                - type: ui-card
                  props: { title: Entries, description: "Swipe a row, or use the button at its end" }
                  children:
                    - type: element
                      attrs: { id: entries }
                      style: { border: 1px solid $color.border, border-radius: 12px, overflow: hidden }
                      children:
                        - type: list
                          props: { items: "{{ entries }}", as: e, key: "{{ e.id }}" }
                          style: { display: flex, flex-direction: column }
                          children:
                            - type: if
                              props: { when: "{{ !includes(hidden, e.id) }}" }
                              children:
                                - type: ui-swipe-actions
                                  props: { label: "{{ e.title }}", start: [ { value: star, label: Star, tone: warning, icon: "★" } ], end: [ { value: delete, label: Delete, tone: danger } ] }
                                  on: { star: { action: set_state, key: starred, value: "{{ toggle(starred, e.id) }}" }, delete: { action: set_state, key: hidden, value: "{{ toggle(hidden, e.id) }}" } }
                                  children: [ { type: ui-item, props: { title: "{{ includes(starred, e.id) ? '★ ' + e.title : e.title }}", description: "{{ e.text }}" } } ]
                    - { type: ui-read-aloud, props: { target: "#entries", controls: true, label: Read them out }, style: { margin-top: 12px } }
                - { type: ui-card, props: { title: Video }, children: [ { type: ui-video-recorder, props: { bind: clip, max: 20, facing: back } } ] }
                - { type: ui-card, props: { title: "A screen, for reporting a problem" }, children: [ { type: ui-screen-capture, props: { bind: screen } } ] }
