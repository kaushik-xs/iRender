# Block: a data job's run, for whoever looks after it. The log follows as lines arrive (Later
# lines adds some), filters by level and finds text; the trace lays the steps out against
# time, a step opening to what went in and out; the config's change is a diff beside the
# editor that makes it.
#
#   cargo run -p irender-cli -- render examples/blocks/ops-01.yaml --ui-kit --icon-kit -o ops-01.html
version: 1
state:
  line: null
  span: null
  saved: "schedule: daily\nretries: 2\nsource:\n  table: meter_readings\n  since: yesterday\n"
  config: "schedule: daily\nretries: 3\nsource:\n  table: meter_readings\n  since: yesterday\nnotify: ops@utility.example\n"
  log:
    - { time: "2026-11-22T02:00:00Z", level: info, source: scheduler, text: "Run 8842 started" }
    - { time: "2026-11-22T02:00:01Z", level: debug, source: source, text: "Reading meter_readings since 2026-11-21" }
    - { time: "2026-11-22T02:00:07Z", level: info, source: source, text: "Read \u001b[32m184,220\u001b[0m rows" }
    - { time: "2026-11-22T02:00:09Z", level: warn, source: clean, text: "312 readings below zero were set aside" }
    - { time: "2026-11-22T02:00:21Z", level: error, source: load, text: "Deadlock on billing.daily, trying again (1 of 3)" }
    - { time: "2026-11-22T02:00:33Z", level: success, source: load, text: "Loaded 183,908 rows" }
  more:
    - { time: "2026-11-22T02:00:00Z", level: info, source: scheduler, text: "Run 8842 started" }
    - { time: "2026-11-22T02:00:01Z", level: debug, source: source, text: "Reading meter_readings since 2026-11-21" }
    - { time: "2026-11-22T02:00:07Z", level: info, source: source, text: "Read \u001b[32m184,220\u001b[0m rows" }
    - { time: "2026-11-22T02:00:09Z", level: warn, source: clean, text: "312 readings below zero were set aside" }
    - { time: "2026-11-22T02:00:21Z", level: error, source: load, text: "Deadlock on billing.daily, trying again (1 of 3)" }
    - { time: "2026-11-22T02:00:33Z", level: success, source: load, text: "Loaded 183,908 rows" }
    - { time: "2026-11-22T02:00:34Z", level: info, source: scheduler, text: "Run 8842 done in 34 s" }
    - { time: "2026-11-22T02:00:35Z", level: info, source: notify, text: "Told ops@utility.example" }
    - { time: "2026-11-22T02:05:00Z", level: debug, source: scheduler, text: "Next run in 24 h" }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 32px 16px 80px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 40px 24px 96px }
  children:
    - type: stack
      style: { max-width: 1180px, margin: 0 auto, gap: 24px }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 4px }
              children:
                - { type: ui-heading, props: { level: 2, text: "Run 8842" } }
                - { type: ui-text, props: { variant: muted, text: "Nightly meter readings · done in 34 s" } }
            - type: ui-button
              props: { label: Later lines, variant: outline }
              on: { click: { action: set_state, key: log, value: "{{ more }}" } }

        - type: element
          style: { display: grid, gap: 16px, grid-template-columns: "repeat(auto-fit, minmax(200px, 1fr))" }
          children:
            - { type: ui-stat, props: { label: Rows loaded, value: 183908, previous: 181200, changeLabel: vs last night } }
            - { type: ui-stat, props: { label: Time, value: 34, unit: s, previous: 29, goodWhen: down, trend: [28, 30, 27, 29, 31, 29, 34] } }
            - { type: ui-stat, props: { label: Set aside, value: 312, previous: 340, goodWhen: down } }
        - { type: ui-log, props: { lines: "{{ log }}", title: Log, height: 220, bindLine: line, download: run-8842.log } }
        - type: ui-trace
          props:
            title: Steps
            bindSpan: span
            kinds: { source: "#0891b2", transform: "#7c3aed", load: "#d97706" }
            spans:
              - { id: run, name: Run 8842, start: 0, duration: 34000 }
              - { id: read, parent: run, name: Read readings, kind: source, start: 800, duration: 6400, output: { rows: 184220 } }
              - { id: clean, parent: run, name: Clean, kind: transform, start: 7300, duration: 5200 }
              - { id: zero, parent: clean, name: Set aside negatives, kind: transform, start: 7400, duration: 1900, output: { rows: 312 } }
              - { id: unit, parent: clean, name: Convert units, kind: transform, start: 9400, duration: 3000 }
              - { id: load1, parent: run, name: Load, kind: load, start: 12600, duration: 8300, status: error, error: "Deadlock on billing.daily" }
              - { id: load2, parent: run, name: Load again, kind: load, start: 21000, duration: 12100, output: { rows: 183908 } }
        - type: element
          style: { display: grid, gap: 20px, align-items: start, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "repeat(2, minmax(0, 1fr))" } }
          children:
            - type: stack
              style: { gap: 8px }
              children:
                - { type: ui-heading, props: { level: 4, text: Settings } }
                - { type: ui-code-editor, props: { bind: config, language: yaml, rows: 9, label: Settings, completions: [schedule, retries, source, table, since, notify] } }
            - type: stack
              style: { gap: 8px }
              children:
                - { type: ui-heading, props: { level: 4, text: What saving changes } }
                - { type: ui-diff, props: { before: "{{ saved }}", after: "{{ config }}", view: unified, language: yaml } }
