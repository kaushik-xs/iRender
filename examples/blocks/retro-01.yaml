# Block: a sprint retrospective on a whiteboard (`ui-whiteboard`). Three columns, sticky notes
# in them, arrows and a drawing; add notes (N, or the note tool), drag them between the
# columns, write in them (double-click), draw with the pen, zoom and pan, undo; the
# board's items are state, ready to save. Who's in the meeting (`ui-presence`) and the time
# left (`ui-countdown`, from when the page opens) sit above it.
#
#   cargo run -p irender-cli -- render examples/blocks/retro-01.yaml --ui-kit --icon-kit -o retro-01.html
version: 1
state:
  here:
    - { id: ks, name: Kaushik Sundar, status: active, where: Writing a note }
    - { id: mi, name: Meera Iyer, status: active }
    - { id: rk, name: Ravi Kumar, status: idle }
    - { id: ar, name: Asha Rao, status: active, where: Drawing }
  board:
    - { id: c1, type: rect, x: 0, y: 0, w: 300, h: 520, color: "#16a34a" }
    - { id: c2, type: rect, x: 330, y: 0, w: 300, h: 520, color: "#ea580c" }
    - { id: c3, type: rect, x: 660, y: 0, w: 300, h: 520, color: "#2563eb" }
    - { id: h1, type: text, x: 20, y: 16, w: 260, h: 32, text: Went well, color: "#16a34a" }
    - { id: h2, type: text, x: 350, y: 16, w: 260, h: 32, text: To improve, color: "#ea580c" }
    - { id: h3, type: text, x: 680, y: 16, w: 260, h: 32, text: Actions, color: "#2563eb" }
    - { id: n1, type: note, x: 20, y: 70, w: 170, h: 110, text: "Shipped the rail layout a day early", color: "#bbf7d0" }
    - { id: n2, type: note, x: 110, y: 200, w: 170, h: 110, text: "Pairing on the flaky tests helped", color: "#bbf7d0" }
    - { id: n3, type: note, x: 350, y: 70, w: 170, h: 110, text: "Too many meetings on Wednesday", color: "#fed7aa" }
    - { id: n4, type: note, x: 440, y: 210, w: 170, h: 110, text: "Reviews waited a day or more", color: "#fed7aa" }
    - { id: n5, type: note, x: 680, y: 70, w: 170, h: 110, text: "No-meeting Wednesday afternoons (Meera)", color: "#bfdbfe" }
    - { id: n6, type: note, x: 760, y: 210, w: 170, h: 110, text: "Reviewer of the day, on a rota (Ravi)", color: "#bfdbfe" }
    - { id: a1, type: arrow, x: 525, y: 125, points: [[0, 0], [150, 0]], color: "#1f2937" }
    - { id: a2, type: arrow, x: 615, y: 265, points: [[0, 0], [140, 0]], color: "#1f2937" }
    - { id: p1, type: pen, x: 60, y: 380, points: [[0, 30], [25, 0], [50, 30], [75, 0], [100, 30], [125, 0], [150, 30]], color: "#16a34a" }
root:
  type: stack
  props: { gap: 16 }
  style:
    max-width: 1240px
    margin: 0 auto
    padding: 32px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { direction: row, align: end, gap: 16 }
      style: { flex-wrap: wrap }
      children:
        - type: stack
          props: { gap: 4 }
          style: { flex: 1, min-width: 260 }
          children:
            - { type: ui-heading, props: { level: 2, text: Sprint 24 retro } }
            - { type: ui-text, props: { variant: muted, text: "Add a note with N, drag notes between columns, double-click to write. ⌘Z undoes; ⌘ and the wheel zoom." } }
        - { type: ui-presence, props: { people: "{{ here }}", me: ks, max: 4, label: In the retro } }
        - { type: ui-countdown, props: { to: +25m, warn: 5m, danger: 1m, format: clock, label: Time left in the retro } }
    - { type: ui-whiteboard, props: { bind: board, height: 600, label: Sprint 24 retro board } }
