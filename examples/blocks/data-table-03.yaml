# Block: an inventory list configured with `columns` alone: plain column objects, no
# cell templates. Shows what the table does with rows from state:
# - `rows` reads state, so the table follows it: "Receive delivery" swaps the stock
#   list and the table keeps its sort, filters and selection over the new rows.
# - `filter` takes conditions from any control: the warehouse toggle filters the rows.
# - `bindRow` writes the clicked row (or the one Enter opens) to state, and the panel
#   beside the table draws its stock levels with the chart kit.
# - No paging (`pageSize: 0`): a fixed `height` scrolls the rows under a header that
#   stays in view, and `striped` shades every other row.
#
#   cargo run -p irender-cli -- render examples/blocks/data-table-03.yaml --ui-kit --chart-kit --icon-kit -o data-table-03.html
