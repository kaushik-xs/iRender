root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1240px
    margin: 0 auto
    padding: 32px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { direction: row, align: end, gap: 12 }
      style: { flex-wrap: wrap }
      children:
        - type: stack
          props: { gap: 4 }
          children:
            - { type: ui-heading, props: { level: 2, text: Inventory } }
            - { type: ui-text, props: { variant: muted, text: Click a row to see its stock over the last weeks. } }
        - type: ui-toggle-group
          props:
            bind: warehouse
            variant: outline
            size: sm
            options: [{ value: all, label: All }, { value: North, label: North }, { value: South, label: South }, { value: East, label: East }]
          style: { margin-left: auto }

    - type: element
      style: { display: grid, grid-template-columns: "minmax(0, 1fr)", gap: 20, align-items: start, "@lg": { grid-template-columns: "minmax(0, 1fr) 300px" } }
      children:
        - type: ui-data-table
          props:
            rows: "{{ stock }}"
            rowKey: sku
            title: Inventory
            search: Search items…
            filter: { warehouse: "{{ warehouse == 'all' ? null : warehouse }}" }
            sort: onHand
            bindRow: current
            pageSize: 0
            height: 420
            striped: true
            columns:
              - { field: sku, label: SKU, hideable: false }
              - { field: name, label: Item }
              - { field: category, label: Category, filter: select }
              - { field: warehouse, label: Warehouse, hidden: true }
              - { field: status, label: Stock, filter: select, cell: badge, tones: { OK: success, Low: warning, Out: destructive } }
              - { field: onHand, label: On hand, format: number, filter: range, summary: sum }
              - { field: reorder, label: Reorder at, format: number }
              - { field: cost, label: Unit cost, format: currency, currency: EUR, decimals: 2, summary: avg }
              - { field: fill, label: Bin fill, cell: progress }
              - { field: levels, label: Trend, cell: sparkline, sortable: false }
          children:
            - type: ui-data-table-toolbar
              children:
                - type: if
                  props: { when: "{{ !received }}" }
                  children:
                    - type: ui-button
                      props: { label: Receive delivery, size: sm }
                      on:
                        click:
                          - { action: set_state, key: stock, value: "{{ delivered }}" }
                          - { action: set_state, key: received, value: true }

        - type: ui-card
          props: { title: "{{ current ? current.name : 'No item selected' }}", description: "{{ current ? current.sku + ' · ' + current.warehouse + ' warehouse' : 'Click a row in the table' }}" }
          children:
            - type: if
              props: { when: "{{ current }}" }
              children:
                - type: stack
                  props: { gap: 12 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 24 }
                      children:
                        - type: stack
                          props: { gap: 2 }
                          children:
                            - { type: ui-text, props: { variant: muted, text: On hand } }
                            - { type: ui-heading, props: { level: 3, text: "{{ current.onHand }}" } }
                        - type: stack
                          props: { gap: 2 }
                          children:
                            - { type: ui-text, props: { variant: muted, text: Reorder at } }
                            - { type: ui-heading, props: { level: 3, text: "{{ current.reorder }}" } }
                    - type: ui-chart
                      props: { type: bar, data: "{{ current.levels }}", height: 180, title: Stock over the last seven weeks, option: { xAxis: { data: [W1, W2, W3, W4, W5, W6, Now] } } }
