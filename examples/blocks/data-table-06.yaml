root:
  type: stack
  style:
    max-width: 1180px
    margin: 0 auto
    padding: 16px
    gap: 20px
    font-family: $font.body
    color: $color.text
    background: $color.surface
    "@md": { padding: 24px }
  children:
    - type: element
      style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12 }
      children:
        - type: stack
          style: { gap: 4 }
          children:
            - { type: ui-heading, props: { level: 2, text: Tickets } }
            - { type: ui-text, props: { variant: muted, text: "Everything the support and product teams are working on." } }
        - type: element
          style: { display: flex, gap: 8 }
          children:
            - type: ui-button
              props: { label: Unassigned, variant: outline, size: sm, icon: user }
              on: { click: { action: set_state, key: filters, value: { assignee: { empty: true } } } }
            - type: ui-button
              props: { label: Urgent and open, variant: outline, size: sm, icon: warning }
              on: { click: { action: set_state, key: filters, value: { priority: [Urgent], status: { not: [Done] } } } }
    - type: ui-filters
      props: { bind: filters, rows: "{{ tickets }}", title: Filter tickets }
      children:
        - { type: ui-filter, props: { field: status, label: Status, section: Ticket } }
        - { type: ui-filter, props: { field: priority, label: Priority, section: Ticket, options: [Urgent, High, Medium, Low] } }
        - { type: ui-filter, props: { field: title, label: Title, type: text, section: Ticket } }
        - { type: ui-filter, props: { field: assignee, label: Assignee, section: People } }
        - { type: ui-filter, props: { field: team, label: Team, section: People } }
        - { type: ui-filter, props: { field: estimate, label: Estimate, type: number, unit: pts, section: Planning } }
        - { type: ui-filter, props: { field: created, label: Created, type: date, section: Planning } }
    - type: element
      style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 2fr) minmax(0, 1fr)" }, align-items: start }
      children:
        - type: ui-data-table
          props: { rows: "{{ tickets }}", filter: "{{ filters }}", rowKey: id, sort: -created, pageSize: 10, pageSizes: [], search: Search titles…, searchFields: [title], emptyText: No tickets match these filters., locale: en-IN }
          children:
            - { type: ui-data-table-column, props: { field: id, label: Ticket } }
            - { type: ui-data-table-column, props: { field: title, label: Title } }
            - { type: ui-data-table-column, props: { field: status, label: Status, cell: badge, tones: { Done: default, Blocked: destructive } } }
            - { type: ui-data-table-column, props: { field: priority, label: Priority } }
            - { type: ui-data-table-column, props: { field: assignee, label: Assignee } }
            - { type: ui-data-table-column, props: { field: created, label: Created, format: date } }
        - type: ui-card
          props: { title: By status, description: The tickets that pass the filters. }
          children:
            - type: ui-chart
              props: { type: donut, data: "{{ tickets }}", filter: "{{ filters }}", x: status, aggregate: count, height: 260 }
