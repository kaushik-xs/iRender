    - {"id": "TCK-125", "title": "Slow dashboard on large teams", "status": "In progress", "priority": "Urgent", "assignee": "Divya", "team": "Web", "estimate": 3, "created": "2026-10-04"}
    - {"id": "TCK-126", "title": "Webhook retries twice", "status": "In progress", "priority": "Urgent", "assignee": "Divya", "team": "Mobile", "estimate": 8, "created": "2026-10-27"}
    - {"id": "TCK-127", "title": "Avatar upload fails on Safari", "status": "Open", "priority": "High", "assignee": "Meera", "team": "Web", "estimate": 8, "created": "2026-10-12"}
    - {"id": "TCK-128", "title": "Reset password email delayed", "status": "Blocked", "priority": "Urgent", "assignee": "Divya", "team": "Web", "estimate": 5, "created": "2026-10-05"}
    - {"id": "TCK-129", "title": "Filter chips overflow on mobile", "status": "Done", "priority": "Medium", "assignee": "Ravi", "team": "Platform", "estimate": 5, "created": "2026-11-04"}
    - {"id": "TCK-130", "title": "Add Hindi translations", "status": "In review", "priority": "High", "assignee": "Kaushik", "team": "Platform", "estimate": null, "created": "2026-10-24"}
    - {"id": "TCK-131", "title": "Timezone wrong in reports", "status": "Open", "priority": "Medium", "assignee": "Divya", "team": "Mobile", "estimate": 3, "created": "2026-10-16"}
    - {"id": "TCK-132", "title": "Duplicate rows after import", "status": "In review", "priority": "Urgent", "assignee": "Asha", "team": "Platform", "estimate": 5, "created": "2026-10-29"}
    - {"id": "TCK-133", "title": "API rate limit too strict", "status": "In review", "priority": "High", "assignee": "Ravi", "team": "Mobile", "estimate": 1, "created": "2026-10-11"}
    - {"id": "TCK-134", "title": "Billing page shows old plan", "status": "Blocked", "priority": "Medium", "assignee": "Meera", "team": "Platform", "estimate": 3, "created": "2026-10-05"}
