# Block: a ticket list filtered from a side panel. `ui-filters` writes
# `{ field: condition }` to `filters`, and the table and the chart both take it as their
# `filter`:
# - Status, Priority, Assignee and Team are lists of the values in the rows, each with
#   how many tickets have it.
# - Estimate is a number (equals, more than, less than, between, is empty), Created a
#   date (between, on, before, after) and Title text (contains, is).
# - Chips beside the button show what's applied: click one to change it, ✕ to remove it.
#   "Unassigned" sets `assignee: { empty: true }` from a button, and the chips follow.
#
#   cargo run -p irender-cli -- render examples/blocks/data-table-06.yaml --ui-kit --chart-kit --icon-kit -o data-table-06.html
version: 1
state:
  filters: { status: [Open, In progress, Blocked] }
  tickets:
    - {"id": "TCK-120", "title": "Login page times out", "status": "In progress", "priority": "Low", "assignee": null, "team": "Web", "estimate": 1, "created": "2026-10-21"}
    - {"id": "TCK-121", "title": "Export to CSV drops dates", "status": "Open", "priority": "Medium", "assignee": "Divya", "team": "Web", "estimate": 8, "created": "2026-11-04"}
    - {"id": "TCK-122", "title": "Dark mode contrast on badges", "status": "Open", "priority": "Urgent", "assignee": "Ravi", "team": "Mobile", "estimate": 1, "created": "2026-10-14"}
    - {"id": "TCK-123", "title": "Invoice PDF misses GST number", "status": "Open", "priority": "Low", "assignee": "Asha", "team": "Platform", "estimate": 1, "created": "2026-10-16"}
