# Block: a report builder. One list of sales, in state, and one ui-chart whose every
# prop is a control's state key: chart type, dimension, measure, how it's aggregated,
# what it's split by, the sort, the top N, stacking, labels and orientation. The filter
# panel feeds the same chart. Saved reports are plain lists of set_state actions, so a
# click reconfigures the whole page.
#
# - Clicking a bar (or slice) picks it: the rows table below shows the sales behind it,
#   by turning the picked value into a filter on whichever field is the dimension.
# - The rows table can be grouped by the chart's dimension, with subtotals.
# - The Config tab shows the chart's props as YAML, and the filter as JSON, both live:
#   what the controls build is a document, the same as this page.
#
#   cargo run -p irender-cli -- render examples/blocks/report-01.yaml --ui-kit --chart-kit --icon-kit -o report-01.html
version: 1
state:
  kind: bar
  dim: region
  measure: revenue
  agg: sum
  split: channel
  order: desc
  top: 10
  stack: true
  labels: false
  horizontal: false
  picked: null
  filters: {}
  views:
    - { name: Online only, filters: { channel: [Online] } }
    - { name: Big-ticket, filters: { category: [Laptops, Phones] } }
  tab: rows
  groupRows: false
  report: region
