fragments:
  # A saved report's button. Its actions set every key the chart reads.
  report:
    type: ui-button
    props: { label: "{{ label }}", icon: "{{ icon }}", variant: outline, size: sm }
    attrs: { aria-pressed: "{{ report == id }}" }
    style: { "&[aria-pressed=true]": { background: $color.accent, border-color: $color.primary } }
    on:
      click:
        - { action: set_state, key: report, value: "{{ id }}" }
        - { action: set_state, key: kind, value: "{{ kind }}" }
        - { action: set_state, key: dim, value: "{{ dim }}" }
        - { action: set_state, key: measure, value: "{{ measure }}" }
        - { action: set_state, key: agg, value: "{{ agg }}" }
        - { action: set_state, key: split, value: "{{ split }}" }
        - { action: set_state, key: order, value: "{{ order }}" }
        - { action: set_state, key: stack, value: "{{ stack }}" }
        - { action: set_state, key: horizontal, value: "{{ horizontal }}" }
        - { action: set_state, key: labels, value: "{{ labels }}" }
        - { action: set_state, key: picked, value: null }
root:
  type: stack
  style:
    max-width: 1320px
    margin: 0 auto
    padding: 16px
    gap: 20px
    font-family: $font.body
    color: $color.text
    background: $color.surface
    "@md": { padding: 24px }
  children:
    - type: element
      style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12 }
      children:
        - type: stack
          style: { gap: 4 }
          children:
            - { type: ui-breadcrumb, props: { items: [ { label: Analytics, href: "#" }, { label: Reports, href: "#" }, { label: Sales explorer } ] } }
            - { type: ui-heading, props: { level: 2, text: Sales explorer } }
            - { type: ui-text, props: { variant: muted, text: "240 sales, January to October 2026. Every control below is a prop of one chart." } }
        - type: ui-filters
          props: { bind: filters, bindViews: views, rows: "{{ sales }}", title: Filter sales, currency: USD }
          children:
            - { type: ui-filter, props: { field: region, label: Region, section: Where } }
            - { type: ui-filter, props: { field: channel, label: Channel, section: Where } }
            - { type: ui-filter, props: { field: category, label: Category, section: What } }
            - { type: ui-filter, props: { field: month, label: Month, section: What } }
            - { type: ui-filter, props: { field: revenue, label: Revenue, type: currency, section: Amounts } }
            - { type: ui-filter, props: { field: units, label: Units, type: number, section: Amounts } }

    - type: element
      attrs: { role: group, aria-label: Saved reports }
      style: { display: flex, flex-wrap: wrap, align-items: center, gap: 8 }
      children:
        - { type: text, props: { value: "Saved reports" }, style: { font-size: 13px, color: $color.muted, margin-right: 4 } }
        - { type: include, props: { name: report, with: { id: region, label: Revenue by region, icon: stock-chart, kind: bar, dim: region, measure: revenue, agg: sum, split: channel, order: desc, stack: true, horizontal: false, labels: false } } }
        - { type: include, props: { name: report, with: { id: trend, label: Monthly trend, icon: trend-up, kind: area, dim: month, measure: revenue, agg: sum, split: category, order: label, stack: true, horizontal: false, labels: false } } }
        - { type: include, props: { name: report, with: { id: mix, label: Units by category, icon: tag, kind: donut, dim: category, measure: units, agg: sum, split: none, order: desc, stack: false, horizontal: false, labels: true } } }
        - { type: include, props: { name: report, with: { id: margin, label: Average profit, icon: coins, kind: bar, dim: category, measure: profit, agg: avg, split: none, order: desc, stack: false, horizontal: true, labels: false } } }
        - { type: include, props: { name: report, with: { id: funnel, label: Channel funnel, icon: funnel, kind: funnel, dim: channel, measure: revenue, agg: sum, split: none, order: desc, stack: false, horizontal: false, labels: true } } }

    - type: element
      style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "280px minmax(0, 1fr)" }, align-items: start }
      children:
        - type: ui-card
          props: { title: Build, description: Change anything; the chart follows. }
          children:
            - type: stack
              style: { gap: 14 }
              children:
                - type: ui-field
                  props: { label: Chart }
                  children:
                    - type: ui-select
                      props: { bind: kind, options: [ { value: bar, label: Bars }, { value: line, label: Line }, { value: area, label: Area }, { value: pie, label: Pie }, { value: donut, label: Donut }, { value: funnel, label: Funnel } ] }
                      on: { change: { action: set_state, key: report, value: null } }
                - type: ui-field
                  props: { label: Group by }
                  children:
                    - type: ui-select
                      props: { bind: dim, options: [ { value: region, label: Region }, { value: channel, label: Channel }, { value: category, label: Category }, { value: month, label: Month } ] }
                      on:
                        change:
                          - { action: set_state, key: picked, value: null }
                          - { action: set_state, key: report, value: null }
                - type: element
                  style: { display: grid, grid-template-columns: 1fr 1fr, gap: 10 }
                  children:
                    - type: ui-field
                      props: { label: Measure }
                      children:
                        - type: ui-select
                          props: { bind: measure, disabled: "{{ agg == 'count' }}", options: [ { value: revenue, label: Revenue }, { value: profit, label: Profit }, { value: units, label: Units } ] }
                          on: { change: { action: set_state, key: report, value: null } }
                    - type: ui-field
                      props: { label: As }
                      children:
                        - type: ui-select
                          props: { bind: agg, options: [ { value: sum, label: Total }, { value: avg, label: Average }, { value: max, label: Largest }, { value: min, label: Smallest }, { value: count, label: Count } ] }
                          on: { change: { action: set_state, key: report, value: null } }
                - type: ui-field
                  props: { label: Split by, description: "{{ kind == 'pie' || kind == 'donut' || kind == 'funnel' ? 'Not for a ' + kind + ' chart.' : 'A series per value, in its own colour.' }}" }
                  children:
                    - type: ui-select
                      props:
                        bind: split
                        disabled: "{{ kind == 'pie' || kind == 'donut' || kind == 'funnel' }}"
                        options: [ { value: none, label: Nothing }, { value: channel, label: Channel }, { value: category, label: Category }, { value: region, label: Region } ]
                      on: { change: { action: set_state, key: report, value: null } }
                - type: ui-field
                  props: { label: Order }
                  children:
                    - type: ui-radio-group
                      props: { bind: order, orientation: horizontal, options: [ { value: desc, label: Most }, { value: asc, label: Least }, { value: label, label: "A–Z" } ] }
                - type: ui-field
                  props: { label: "Show the top {{ top }}", description: "{{ dim == 'month' ? 'Every month is shown.' : (split != 'none' && kind != 'pie' && kind != 'donut' && kind != 'funnel' ? 'Split charts show every group.' : '') }}" }
                  children:
                    - { type: ui-slider, props: { bind: top, min: 2, max: 10, disabled: "{{ dim == 'month' || (split != 'none' && kind != 'pie' && kind != 'donut' && kind != 'funnel') }}" } }
                - { type: ui-separator }
                - { type: ui-switch, props: { bind: stack, label: Stack the series, disabled: "{{ split == 'none' || kind == 'pie' || kind == 'donut' || kind == 'funnel' }}" } }
                - { type: ui-switch, props: { bind: horizontal, label: Horizontal bars, disabled: "{{ kind != 'bar' }}" } }
                - { type: ui-switch, props: { bind: labels, label: Values on the marks } }

        - type: stack
          style: { gap: 20, min-width: 0 }
          children:
            - type: ui-card
              props:
                title: "{{ agg == 'count' ? 'Number of sales' : (agg == 'sum' ? 'Total' : (agg == 'avg' ? 'Average' : (agg == 'max' ? 'Largest' : 'Smallest'))) + ' ' + measure }} by {{ dim }}"
                description: "{{ split != 'none' && kind != 'pie' && kind != 'donut' && kind != 'funnel' ? 'Split by ' + split + '. ' : '' }}Click a mark to see its sales below."
              children:
                - type: ui-chart
                  props:
                    title: Sales chart
                    type: "{{ kind }}"
                    data: "{{ sales }}"
                    filter: "{{ filters }}"
                    x: "{{ dim }}"
                    y: "{{ agg == 'count' ? 'count' : measure }}"
                    aggregate: "{{ agg }}"
                    series: "{{ split == 'none' || kind == 'pie' || kind == 'donut' || kind == 'funnel' ? null : split }}"
                    sort: "{{ order == 'label' ? dim : (order == 'desc' ? '-' : '') + (agg == 'count' ? 'count' : measure) }}"
                    limit: "{{ dim == 'month' || (split != 'none' && kind != 'pie' && kind != 'donut' && kind != 'funnel') ? null : top }}"
                    stack: "{{ stack }}"
                    horizontal: "{{ horizontal }}"
                    labels: "{{ labels }}"
                    height: 380
                    bind: picked
                - type: if
                  props: { when: "{{ picked != null }}" }
                  children:
                    - type: element
                      style: { display: flex, align-items: center, gap: 8, margin-top: 8, font-size: 14px }
                      children:
                        - { type: ui-badge, props: { text: "{{ picked }}", icon: funnel, variant: secondary } }
                        - { type: text, props: { value: "The rows below are its sales." }, style: { color: $color.muted } }
                        - type: ui-button
                          props: { label: Clear, variant: ghost, size: sm, icon: x }
                          style: { margin-left: auto }
                          on: { click: { action: set_state, key: picked, value: null } }

            - type: ui-tabs
              props: { bind: tab }
              children:
                - type: ui-tab-panel
                  props: { value: rows, label: Rows }
                  children:
                    - type: ui-data-table
                      props:
                        rows: "{{ sales }}"
                        title: Sales
                        rowKey: id
                        sort: -revenue
                        pageSize: 8
                        pageSizes: [8, 20, 50]
                        search: Search sales…
                        export: sales.csv
                        groupBy: "{{ groupRows ? dim : null }}"
                        locale: en-US
                        filter:
                          region: "{{ dim == 'region' && picked != null ? picked : filters.region }}"
                          channel: "{{ dim == 'channel' && picked != null ? picked : filters.channel }}"
                          category: "{{ dim == 'category' && picked != null ? picked : filters.category }}"
                          month: "{{ dim == 'month' && picked != null ? picked : filters.month }}"
                          revenue: "{{ filters.revenue }}"
                          units: "{{ filters.units }}"
                      children:
                        - type: ui-data-table-toolbar
                          children:
                            - { type: ui-switch, props: { bind: groupRows, label: "Group by {{ dim }}" } }
                        - { type: ui-data-table-column, props: { field: id, label: Sale } }
                        - { type: ui-data-table-column, props: { field: month, label: Month } }
                        - { type: ui-data-table-column, props: { field: region, label: Region } }
                        - { type: ui-data-table-column, props: { field: channel, label: Channel, cell: badge, tones: { Online: info, Retail: default, Partner: secondary } } }
                        - { type: ui-data-table-column, props: { field: category, label: Category } }
                        - { type: ui-data-table-column, props: { field: units, label: Units, format: number, summary: sum } }
                        - { type: ui-data-table-column, props: { field: revenue, label: Revenue, format: currency, decimals: 0, summary: sum } }
                        - { type: ui-data-table-column, props: { field: profit, label: Profit, format: currency, decimals: 0, summary: sum } }
                - type: ui-tab-panel
                  props: { value: config, label: Config }
                  children:
                    - type: element
                      style: { display: grid, gap: 16, grid-template-columns: "minmax(0, 1fr)", "@md": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" } }
                      children:
                        - type: ui-code-block
                          props:
                            title: The chart, as the controls built it
                            language: yaml
                            lineNumbers: true
                            code: |-
                              type: ui-chart
                              props:
                                type: {{ kind }}
                                data: $sales
                                filter: $filters
                                x: {{ dim }}
                                y: {{ agg == 'count' ? 'count' : measure }}
                                aggregate: {{ agg }}
                                series: {{ split == 'none' || kind == 'pie' || kind == 'donut' || kind == 'funnel' ? 'null' : split }}
                                sort: {{ order == 'label' ? dim : (order == 'desc' ? '-' : '') + (agg == 'count' ? 'count' : measure) }}
                                limit: {{ dim == 'month' || (split != 'none' && kind != 'pie' && kind != 'donut' && kind != 'funnel') ? 'null' : top }}
                                stack: {{ stack }}
                                horizontal: {{ horizontal }}
                                labels: {{ labels }}
                                bind: picked
                        - type: ui-code-block
                          props: { title: "$filters, from the filter panel", language: json, lineNumbers: true, code: "{{ filters }}" }
