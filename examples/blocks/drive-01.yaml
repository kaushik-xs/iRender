# Block: a team's shared files. `ui-file-browser` shows one folder at a time, as a grid
# or a list, with a breadcrumb back up: search, sort, select several (click with ⌘ or
# Shift, or the keys), rename (F2), add folders, delete (with undo), and move, by
# dragging onto a folder or the breadcrumb (by touch, hold first) or from Move to. The
# file opened (a double click, or Enter) shows beside it; the files are state, ready to
# save.
#
#   cargo run -p irender-cli -- render examples/blocks/drive-01.yaml --ui-kit --icon-kit -o drive-01.html
version: 1
state:
  folder: null
  picked: []
  opened: null
  files:
    - { id: projects, name: Projects, folder: true, modified: "2026-11-21T16:00" }
    - { id: contracts, name: Contracts, folder: true, modified: "2026-11-02T10:00" }
    - { id: photos, name: Site photos, folder: true, modified: "2026-11-20T09:30" }
    - { id: finance, name: Finance, folder: true, modified: "2026-11-22T11:05" }
    - { id: hillview, name: Hillview Court, folder: true, parent: projects, modified: "2026-11-21T16:00" }
    - { id: riverside, name: Riverside offices, folder: true, parent: projects, modified: "2026-11-14T12:00" }
    - { id: h1, name: Damp survey.pdf, parent: hillview, size: 2340000, modified: "2026-11-12T14:20" }
    - { id: h2, name: Quote - wall repair.pdf, parent: hillview, size: 184000, modified: "2026-11-13T10:00" }
    - { id: h3, name: Wall before.svg, parent: hillview, size: 1293, modified: "2026-11-12T08:00", thumb: media/wall-before.svg }
    - { id: h4, name: Wall after.svg, parent: hillview, size: 1184, modified: "2026-11-21T08:00", thumb: media/wall-after.svg }
    - { id: r1, name: Floor plans.zip, parent: riverside, size: 18400000, modified: "2026-10-30T12:00" }
    - { id: c1, name: Supplier agreement.pdf, parent: contracts, size: 410000, modified: "2026-11-01T09:00" }
    - { id: c2, name: NDA - Alder & Co.docx, parent: contracts, size: 52000, modified: "2026-10-12T15:30" }
    - { id: p1, name: Alfama.svg, parent: photos, size: 4100, modified: "2026-11-20T09:30", thumb: media/alfama.svg }
    - { id: p2, name: Tram 28.svg, parent: photos, size: 3900, modified: "2026-11-20T09:31", thumb: media/tram.svg }
    - { id: p3, name: Walkthrough.mp4, parent: photos, size: 245000000, modified: "2026-11-19T15:10" }
    - { id: f1, name: Budget 2027.xlsx, parent: finance, size: 84210, modified: "2026-11-22T11:05" }
    - { id: f2, name: Invoices Q3.csv, parent: finance, size: 22100, modified: "2026-10-05T10:15" }
    - { id: t1, name: Kick-off notes.docx, size: 31200, modified: "2026-11-03T17:45" }
    - { id: t2, name: Team handbook.pdf, size: 1260000, modified: "2026-09-18T09:00" }
root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1240px
    margin: 0 auto
    padding: 32px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 4 }
      children:
        - { type: ui-heading, props: { level: 2, text: Shared files } }
        - { type: ui-text, props: { variant: muted, text: "Double-click a file (or press Enter) to see it here; drag files onto a folder to move them." } }
    - type: element
      style: { display: grid, grid-template-columns: "minmax(0, 1fr)", gap: 20, "@md": { grid-template-columns: "minmax(0, 1fr) 280px" }, align-items: start }
      children:
        - { type: ui-file-browser, props: { bind: files, bindFolder: folder, bindSelection: picked, bindOpen: opened, rootLabel: Shared files, height: 460, label: Shared files } }
        - type: ui-card
          props: { title: "{{ opened ? opened.name : 'No file open' }}", description: "{{ opened ? 'Opened just now' : 'Double-click a file to open it.' }}" }
          children:
            - type: if
              props: { when: "{{ opened && opened.thumb }}" }
              children:
                - { type: element, props: { tag: img }, attrs: { src: "{{ opened.thumb }}", alt: "" }, style: { width: 100%, border-radius: 8px, margin-bottom: 12px } }
            - type: if
              props: { when: "{{ opened }}" }
              children:
                - type: ui-description-list
                  children:
                    - { type: ui-description-item, props: { label: Size, value: "{{ opened.size }}", format: number } }
                    - { type: ui-description-item, props: { label: Modified, value: "{{ opened.modified }}", format: datetime } }
            - { type: ui-text, props: { variant: muted, text: "{{ picked.length }} selected" }, style: { margin-top: 12px } }
