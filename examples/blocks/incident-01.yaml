# Block: an incident in progress. Everything on the page is state the controls write and
# the components read:
# - The service map is a ui-flow laid out by itself. Each node's look (border, badge,
#   numbers) comes from its `data`, through one node template per kind. Click a service
#   (or use the search, or "Only what's affected") and its latency and error charts below
#   switch to it; the map dims what it isn't connected to.
# - Severity, status and the incident commander are controls; the header's badges, the
#   status page preview and the update's prefix all read them.
# - The runbook's progress ring is worked out from its checkboxes, in an expression.
# - Posting an update adds the draft to the list of updates (`toggle` adds it).
#
#   cargo run -p irender-cli -- render examples/blocks/incident-01.yaml --ui-kit --chart-kit --flow-kit --icon-kit -o incident-01.html
version: 1
state:
  service: payments
  picked: null
  query: ""
  matches: []
  onlyAffected: false
  affected: [edge, gateway, orders, payments, psp]
  severity: SEV2
  status: identified
  commander: Meera Iyer
  check1: true
  check2: true
  check3: false
  check4: false
  check5: false
  draft: ""
  updates:
    - "10:16 · Investigating: checkout is slow and some payments fail."
    - "10:22 · Identified: card payments time out at the payment provider. Orders that need a card retry for up to 2 minutes."
  customer: "Some card payments are failing or slow. We've found the cause and are working on a fix. Orders already placed are safe."
  nodes:
    - { id: edge, type: external, data: { label: CDN, detail: edge cache, status: degraded, p99: 210, errors: 1.9, team: Platform } }
    - { id: gateway, type: service, data: { label: API gateway, detail: envoy, status: degraded, p99: 205, errors: 2.1, team: Platform } }
    - { id: auth, type: service, data: { label: Auth, detail: sessions and tokens, status: ok, p99: 58, errors: 0.1, team: Identity } }
    - { id: search, type: service, data: { label: Search, detail: catalogue, status: ok, p99: 71, errors: 0.1, team: Discovery } }
    - { id: orders, type: service, data: { label: Orders, detail: checkout, status: degraded, p99: 520, errors: 4.2, team: Commerce } }
    - { id: inventory, type: service, data: { label: Inventory, detail: stock and holds, status: ok, p99: 88, errors: 0.1, team: Commerce } }
    - { id: payments, type: service, data: { label: Payments, detail: card and wallet, status: down, p99: 1730, errors: 11.4, team: Payments } }
    - { id: psp, type: external, data: { label: Payment provider, detail: third party, status: down, p99: 1690, errors: 12.0, team: Vendor } }
    - { id: postgres, type: store, data: { label: Postgres, detail: primary + 2 replicas, status: ok, p99: 12, errors: 0, team: Data } }
    - { id: queue, type: store, data: { label: Event queue, detail: order events, status: ok, p99: 9, errors: 0, team: Data } }
  edges:
    - { id: e1, source: edge, target: gateway, type: hot }
    - { id: e2, source: gateway, target: auth }
    - { id: e3, source: gateway, target: search }
    - { id: e4, source: gateway, target: orders, type: hot }
    - { id: e5, source: orders, target: inventory }
    - { id: e6, source: orders, target: payments, type: hot }
    - { id: e7, source: payments, target: psp, type: hot, label: timeouts }
    - { id: e8, source: orders, target: postgres }
    - { id: e9, source: orders, target: queue }
    - { id: e10, source: inventory, target: postgres }
    - { id: e11, source: payments, target: queue }
