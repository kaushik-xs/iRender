fragments:
  # The inside of every node: its name, what it is, its status and two numbers. The
  # border follows `data-status`, set from the node's data.
  node-body:
    type: element
    style: { display: grid, gap: 6, min-width: 170, text-align: left }
    children:
      - type: element
        style: { display: flex, align-items: center, justify-content: space-between, gap: 8 }
        children:
          - { type: text, props: { value: "{{ node.data.label }}" }, style: { font-weight: 600 } }
          - { type: ui-status-badge, props: { status: "{{ node.data.status }}", labels: { ok: OK, degraded: Degraded, down: Down }, tones: { ok: success, degraded: warning, down: danger } } }
      - { type: text, props: { tag: div, value: "{{ node.data.detail }} · {{ node.data.team }}" }, style: { color: $color.muted, font-size: 11 } }
      - { type: text, props: { tag: div, value: "p99 {{ node.data.p99 }} ms · {{ node.data.errors }}% errors" }, style: { font-size: 11, font-variant-numeric: tabular-nums } }
  # One step of the runbook.
  step:
    type: ui-checkbox
    props: { bind: "{{ key }}", label: "{{ label }}" }
root:
  type: stack
  style:
    max-width: 1400px
    margin: 0 auto
    padding: 16px
    gap: 20px
    font-family: $font.body
    color: $color.text
    background: $color.surface
    "@md": { padding: 24px }
  children:
    # ---- the incident: what, how bad, who's on it
    - type: element
      style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 16 }
      children:
        - type: stack
          style: { gap: 6 }
          children:
            - { type: ui-breadcrumb, props: { items: [ { label: Incidents, href: "#" }, { label: INC-2041 } ] } }
            - type: element
              style: { display: flex, flex-wrap: wrap, align-items: center, gap: 10 }
              children:
                - { type: ui-heading, props: { level: 2, text: Card payments failing at checkout } }
                - { type: ui-badge, props: { text: "{{ severity }}", variant: "{{ severity == 'SEV1' || severity == 'SEV2' ? 'destructive' : 'secondary' }}" } }
                - { type: ui-status-badge, props: { status: "{{ status }}", labels: { investigating: Investigating, identified: Identified, monitoring: Monitoring, resolved: Resolved }, tones: { investigating: danger, identified: warning, monitoring: info, resolved: success } } }
            - { type: ui-text, props: { variant: muted, text: "Opened 10:14 by an alert on checkout errors · commander {{ commander }} · 5 services affected" } }
        - type: element
          style: { display: flex, flex-wrap: wrap, gap: 12, align-items: end }
          children:
            - type: ui-field
              props: { label: Severity }
              children:
                - { type: ui-select, props: { bind: severity, options: [SEV1, SEV2, SEV3, SEV4] } }
            - type: ui-field
              props: { label: Commander }
              children:
                - { type: ui-select, props: { bind: commander, options: [Meera Iyer, Asha Rao, Dan Okafor, Ravi Kumar] } }
            - type: ui-field
              props: { label: Status }
              children:
                - type: ui-select
                  props: { bind: status, options: [ { value: investigating, label: Investigating }, { value: identified, label: Identified }, { value: monitoring, label: Monitoring }, { value: resolved, label: Resolved } ] }

    - type: if
      props: { when: "{{ status == 'resolved' }}" }
      children:
        - { type: ui-alert, props: { icon: check, title: Resolved, description: "Write the review while it's fresh: the timeline and charts are kept with the incident." } }

    # ---- the map, and the service picked on it
    - type: element
      style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@xl": { grid-template-columns: "minmax(0, 1fr) 360px" }, align-items: start }
      children:
        - type: ui-card
          props: { title: Service map, description: "Live status, from each service's data. Click one to see its numbers." }
          children:
            - type: ui-flow
              props:
                title: Service map
                nodes: "{{ nodes }}"
                edges: "{{ edges }}"
                layout: layered
                direction: LR
                rankGap: 70
                nodeGap: 24
                height: 440
                highlight: neighbors
                bind: picked
                search: "{{ query }}"
                bindMatches: matches
                filter: "{{ onlyAffected ? affected : null }}"
                filterNeighbors: false
                nodeStyles: false
              on:
                nodeselect: { action: set_state, key: service, value: "{{ picked ? picked : service }}" }
              children:
                - type: ui-flow-panel
                  props: { position: top-left }
                  children:
                    - type: element
                      style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center, padding: 4, background: $color.surface, border-radius: 8 }
                      children:
                        - { type: ui-input, props: { bind: query, placeholder: Find a service… }, attrs: { aria-label: Find a service }, style: { width: 180 } }
                        - { type: ui-switch, props: { bind: onlyAffected, label: "Only what's affected" } }
                - type: ui-flow-node
                  props: { type: service }
                  attrs: { data-status: "{{ node.data.status }}" }
                  style: { "&[data-status=degraded]": { border-color: "#d97706" }, "&[data-status=down]": { border-color: $color.destructive, box-shadow: "0 0 0 3px color-mix(in srgb, var(--color-destructive) 18%, transparent)" } }
                  children:
                    - { type: include, props: { name: node-body } }
                    - { type: ui-flow-port, props: { type: target } }
                    - { type: ui-flow-port, props: { type: source } }
                - type: ui-flow-node
                  props: { type: external, shape: rounded }
                  attrs: { data-status: "{{ node.data.status }}" }
                  style: { border-style: dashed, "&[data-status=degraded]": { border-color: "#d97706" }, "&[data-status=down]": { border-color: $color.destructive } }
                  children:
                    - { type: include, props: { name: node-body } }
                    - { type: ui-flow-port, props: { type: target } }
                    - { type: ui-flow-port, props: { type: source } }
                - type: ui-flow-node
                  props: { type: store, shape: cylinder }
                  style: { padding: "22px 14px 14px" }
                  children:
                    - { type: include, props: { name: node-body } }
                    - { type: ui-flow-port, props: { type: target } }
                - type: ui-flow-edge
                  props: { type: hot, animated: true, marker: arrowclosed }
                  style: { stroke: $color.destructive, stroke-width: 2 }
                - type: ui-flow-edge
                  props: { marker: arrowclosed }
            - type: if
              props: { when: "{{ query != '' }}" }
              children:
                - { type: ui-text, props: { variant: muted, text: "{{ matches.length }} found for “{{ query }}”" }, style: { margin-top: 8, font-size: 13 } }

        - type: ui-card
          props: { title: Runbook, description: Card payment failures (RB-17). }
          children:
            - type: element
              style: { display: flex, align-items: center, gap: 12, margin-bottom: 14 }
              children:
                - { type: ui-progress-ring, props: { value: "{{ ((check1 ? 1 : 0) + (check2 ? 1 : 0) + (check3 ? 1 : 0) + (check4 ? 1 : 0) + (check5 ? 1 : 0)) * 20 }}", size: 44, label: Runbook progress } }
                - { type: text, props: { value: "{{ (check1 ? 1 : 0) + (check2 ? 1 : 0) + (check3 ? 1 : 0) + (check4 ? 1 : 0) + (check5 ? 1 : 0) }} of 5 steps done" }, style: { font-size: 14, font-weight: 500 } }
            - type: stack
              style: { gap: 10 }
              children:
                - { type: include, props: { name: step, with: { key: check1, label: Page the payments on-call } } }
                - { type: include, props: { name: step, with: { key: check2, label: "Check the provider's status page" } } }
                - { type: include, props: { name: step, with: { key: check3, label: Turn on retries with backoff } } }
                - { type: include, props: { name: step, with: { key: check4, label: Fail over to the backup provider } } }
                - { type: include, props: { name: step, with: { key: check5, label: Post on the status page } } }
            - type: if
              props: { when: "{{ check4 }}" }
              children:
                - { type: ui-alert, props: { icon: warning, title: Failing over, description: "Wallet payments stay on the main provider. Watch Payments' error rate below." }, style: { margin-top: 14 } }

    # ---- the picked service's numbers
    - type: element
      style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" } }
      children:
        - type: ui-card
          props: { title: "Latency: {{ service }}", description: "p99 in ms, 10:00 to 10:29. The line marks the alert." }
          children:
            - type: ui-chart
              props:
                title: p99 latency
                type: area
                data: "{{ metrics }}"
                filter: { service: "{{ service }}" }
                x: time
                y: { field: p99, name: p99 ms }
                smooth: true
                height: 240
                group: incident
                option: { series: [ { markLine: { symbol: none, data: [ { xAxis: "10:14", name: Alert } ], label: { formatter: Alert } } } ] }
        - type: ui-card
          props: { title: "Errors: {{ service }}", description: "Share of requests that failed, in %." }
          children:
            - type: ui-chart
              props: { title: Error rate, type: bar, data: "{{ metrics }}", filter: { service: "{{ service }}" }, x: time, y: { field: errors, name: errors % }, height: 240, group: incident }

    # ---- updates: inside, and what customers see
    - type: element
      style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" }, align-items: start }
      children:
        - type: ui-card
          props: { title: Updates, description: "For the incident channel, oldest first." }
          children:
            - type: list
              props: { items: "{{ updates }}", as: u, tag: ol }
              style: { margin: 0, padding-left: 18, display: grid, gap: 8, font-size: 14 }
              children:
                - { type: text, props: { tag: li, value: "{{ u }}" } }
            - type: element
              style: { display: grid, gap: 8, margin-top: 14 }
              children:
                - { type: ui-textarea, props: { bind: draft, rows: 2, placeholder: "What changed, and what's next?" }, attrs: { aria-label: Update } }
                - type: element
                  style: { display: flex, gap: 8, align-items: center }
                  children:
                    - { type: ui-text, props: { variant: muted, text: "Posted as “{{ status }} ({{ severity }})”" }, style: { font-size: 12 } }
                    - type: ui-button
                      props: { label: Post update, size: sm, disabled: "{{ draft == '' }}" }
                      style: { margin-left: auto }
                      on:
                        click:
                          - { action: set_state, key: updates, value: "{{ toggle(updates, status + ' (' + severity + '): ' + draft) }}" }
                          - { action: set_state, key: draft, value: "" }
        - type: ui-card
          props: { title: Status page, description: What customers see. Edit the message; the preview follows. }
          children:
            - { type: ui-textarea, props: { bind: customer, rows: 3 }, attrs: { aria-label: Message for customers } }
            - type: element
              style: { margin-top: 14, padding: 16, border: 1px solid $color.border, border-radius: 10, display: grid, gap: 8 }
              children:
                - type: element
                  style: { display: flex, align-items: center, gap: 8 }
                  children:
                    - { type: ui-status-badge, props: { status: "{{ status == 'resolved' ? 'operational' : (severity == 'SEV1' ? 'outage' : 'partial') }}", labels: { operational: All systems operational, outage: Major outage, partial: Partial outage }, tones: { operational: success, outage: danger, partial: warning } } }
                    - { type: text, props: { value: "Payments" }, style: { font-weight: 600 } }
                - { type: text, props: { tag: p, value: "{{ status == 'resolved' ? 'This incident has been resolved.' : customer }}" }, style: { margin: 0, font-size: 14 } }
                - { type: text, props: { tag: div, value: "{{ status == 'investigating' ? 'Investigating' : (status == 'identified' ? 'Identified' : (status == 'monitoring' ? 'Monitoring' : 'Resolved')) }} · updated 10:22" }, style: { color: $color.muted, font-size: 12 } }
