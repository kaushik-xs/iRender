# Block: rows inside rows, and columns that stay put.
# - Budget: divisions hold teams (`children` arrays), and a team's projects load from
#   an API the first time it's opened (`children: true` with `childrenUrl`). Twelve
#   month columns scroll sideways between the cost centre, pinned left, and the
#   total, pinned right. Summaries add up the top rows only.
# - Org chart: flat rows that name their manager (`parentField`), open to start with
#   (`expanded`). A search shows the people who match with the managers above them.
# The arrow opens a row; on a focused row, Right opens it and steps in, Left closes it
# and steps out. examples/serve.py serves the projects (`api/budget`).
#
#   cargo run -p irender-cli -- render examples/blocks/data-table-05.yaml --ui-kit --chart-kit --icon-kit -o data-table-05.html
#   python3 examples/serve.py   # then open /blocks/data-table-05.html
