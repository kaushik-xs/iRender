root:
  type: stack
  props: { gap: 32 }
  style:
    max-width: 1240px
    margin: 0 auto
    padding: 32px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 12 }
      children:
        - type: stack
          props: { gap: 4 }
          children:
            - { type: ui-heading, props: { level: 2, text: Budget 2026 } }
            - { type: ui-text, props: { variant: muted, text: "Open a division for its teams, and a team for its projects. Scroll sideways through the months." } }
        - type: ui-data-table
          props:
            rows: "{{ budget }}"
            rowKey: id
            title: Budget by cost centre
            childrenUrl: api/budget
            pageSize: 0
            sort: -total
            locale: en-US
            selectable: true
          children:
            - { type: ui-data-table-column, props: { field: name, label: Cost centre, pin: left, tree: true, width: 220, hideable: false } }
            - { type: ui-data-table-column, props: { field: owner, label: Owner, width: 160 } }
            - { type: ui-data-table-column, props: { field: m0, label: Jan, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m1, label: Feb, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m2, label: Mar, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m3, label: Apr, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m4, label: May, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m5, label: Jun, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m6, label: Jul, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m7, label: Aug, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m8, label: Sep, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m9, label: Oct, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m10, label: Nov, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: m11, label: Dec, format: currency, decimals: 0, summary: sum, width: 110 } }
            - { type: ui-data-table-column, props: { field: total, label: Total, format: currency, decimals: 0, summary: sum, pin: right, hideable: false } }

    - type: stack
      props: { gap: 12 }
      children:
        - type: stack
          props: { gap: 4 }
          children:
            - { type: ui-heading, props: { level: 2, text: Organisation } }
            - { type: ui-text, props: { variant: muted, text: Flat rows that name their manager. Search for someone to see who they report to. } }
        - type: ui-data-table
          props:
            rows: "{{ org }}"
            rowKey: id
            title: Organisation
            parentField: manager
            expanded: true
            search: Search people…
            pageSize: 0
            columnsMenu: false
            columns:
              - { field: name, label: Name, tree: true }
              - { field: title, label: Title }
