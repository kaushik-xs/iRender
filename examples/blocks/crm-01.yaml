fragments:
  # A label and value in the deal panel.
  fact:
    type: element
    style: { display: contents }
    children:
      - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: "{{ label }}" } } ] }
      - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ value }}" } } ] }
root:
  type: stack
  style:
    max-width: 1500px
    margin: 0 auto
    padding: 16px
    gap: 20px
    font-family: $font.body
    color: $color.text
    background: $color.surface
    "@md": { padding: 24px }
  children:
    - type: element
      style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12 }
      children:
        - type: stack
          style: { gap: 4 }
          children:
            - { type: ui-breadcrumb, props: { items: [ { label: Sales, href: "#" }, { label: Pipelines, href: "#" }, { label: New business } ] } }
            - { type: ui-heading, props: { level: 2, text: New business pipeline } }
            - { type: ui-text, props: { variant: muted, text: "28 deals closing November to February. Drag a deal to change its stage, or focus it and press Alt with an arrow key." } }
        - type: element
          style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center }
          children:
            - type: ui-filters
              props: { bind: boardFilter, rows: "{{ deals }}", title: Filter the board, currency: USD, locale: en-US }
              children:
                - { type: ui-filter, props: { field: assignee, label: Owner } }
                - { type: ui-filter, props: { field: region, label: Region } }
                - { type: ui-filter, props: { field: tier, label: Tier } }
                - { type: ui-filter, props: { field: product, label: Product } }
                - { type: ui-filter, props: { field: amount, label: Value, type: currency } }
            - type: ui-popover
              props: { trigger: Board settings, align: end }
              style: { width: 300 }
              children:
                - type: stack
                  style: { gap: 14 }
                  children:
                    - type: ui-field
                      props: { label: Swimlanes, description: Dragging a deal to another lane changes that field too. }
                      children:
                        - type: ui-select
                          props: { bind: lanes, options: [ { value: none, label: None }, { value: assignee, label: By owner }, { value: region, label: By region }, { value: tier, label: By tier } ] }
                    - type: ui-field
                      props: { label: Cards show }
                      children:
                        - type: ui-radio-group
                          props: { bind: detail, options: [ { value: compact, label: "The company and tier" }, { value: standard, label: "Value and close date too" }, { value: detailed, label: "Owner and product too" } ] }
            - { type: ui-button, props: { label: New deal, icon: add, size: sm } }

    - type: ui-tabs
      props: { bind: view }
      children:
        - type: ui-tab-panel
          props: { value: board, label: Board }
          children:
            - type: element
              style: { display: grid, gap: 20px, grid-template-columns: "minmax(0, 1fr)", "@xl": { grid-template-columns: "minmax(0, 1fr) 300px" }, align-items: start }
              children:
                - type: ui-kanban
                  props:
                    label: New business pipeline
                    columns: "{{ stages }}"
                    bindColumns: stages
                    cards: "{{ deals }}"
                    bindCards: deals
                    bindCard: deal
                    filter: "{{ boardFilter }}"
                    swimlanes: "{{ lanes == 'none' ? null : lanes }}"
                    fields: "{{ detail == 'compact' ? compact : (detail == 'detailed' ? detailed : standard) }}"
                    collapsible: true
                    collapsed: [Lost]
                    addable: true
                    addLabel: Add deal
                    emptyText: No deals
                    columnWidth: 230
                    locale: en-US
                - type: ui-card
                  props: { title: "{{ deal ? deal.title : 'No deal open' }}", description: "{{ deal ? deal.id + ' · ' + deal.product : 'Click a deal, or press Enter on one, to see it here.' }}" }
                  style: { position: sticky, top: "calc(var(--site-nav, 0px) + 16px)" }
                  children:
                    - type: if
                      props: { when: "{{ deal }}" }
                      children:
                        - type: element
                          style: { display: flex, align-items: center, justify-content: space-between, gap: 12 }
                          children:
                            - { type: ui-status-badge, props: { status: "{{ deal.column }}", tones: "{{ stageTones }}" } }
                            - { type: text, props: { value: "{{ deal.value }}" }, style: { font-size: 24px, font-weight: 600 } }
                        - type: element
                          props: { tag: dl }
                          style: { display: grid, grid-template-columns: "max-content 1fr", gap: "10px 16px", margin: "16px 0 0", font-size: 14px }
                          children:
                            - { type: include, props: { name: fact, with: { label: Owner, value: "{{ deal.assignee }}" } } }
                            - { type: include, props: { name: fact, with: { label: Closes, value: "{{ deal.close }}" } } }
                            - { type: include, props: { name: fact, with: { label: Region, value: "{{ deal.region }}" } } }
                            - { type: include, props: { name: fact, with: { label: Tier, value: "{{ deal.tier }}" } } }
                        - type: if
                          props: { when: "{{ deal.column == 'Lost' }}" }
                          children:
                            - { type: ui-alert, props: { variant: destructive, icon: warning, title: Lost, description: "Move it back to a stage to reopen it." }, style: { margin-top: 16 } }

        - type: ui-tab-panel
          props: { value: table, label: Table }
          children:
            - type: ui-data-table
              props:
                rows: "{{ deals }}"
                title: Deals
                rowKey: id
                sort: close
                groupBy: column
                pageSize: 0
                pageSizes: []
                search: Search companies…
                searchFields: [title]
                filter: { assignee: "{{ owner }}" }
                export: deals.csv
                locale: en-US
              children:
                - type: ui-data-table-toolbar
                  children:
                    - type: if
                      props: { when: "{{ owner != null }}" }
                      children:
                        - type: ui-button
                          props: { label: "{{ owner }}", icon: x, variant: secondary, size: sm }
                          attrs: { aria-label: "Show every owner's deals" }
                          on: { click: { action: set_state, key: owner, value: null } }
                - { type: ui-data-table-column, props: { field: title, label: Company } }
                - { type: ui-data-table-column, props: { field: column, label: Stage, cell: badge, groupable: true, tones: { Won: success, Lost: destructive, Negotiation: warning } } }
                - { type: ui-data-table-column, props: { field: assignee, label: Owner, filter: select, groupable: true } }
                - { type: ui-data-table-column, props: { field: tier, label: Tier, filter: select, groupable: true } }
                - { type: ui-data-table-column, props: { field: region, label: Region, groupable: true } }
                - { type: ui-data-table-column, props: { field: close, label: Closes, format: date, filter: date } }
                - { type: ui-data-table-column, props: { field: amount, label: Amount, format: currency, decimals: 0, summary: sum } }

        - type: ui-tab-panel
          props: { value: forecast, label: Forecast }
          children:
            - type: element
              style: { display: grid, gap: 20, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" } }
              children:
                - type: ui-card
                  props: { title: Value by stage, description: Open deals only. }
                  children:
                    - type: ui-chart
                      props: { title: Value by stage, type: funnel, data: "{{ deals }}", filter: { column: { not: [Won, Lost] } }, x: column, y: amount, aggregate: sum, labels: true, height: 300, option: { series: [ { sort: none } ] } }
                - type: ui-card
                  props: { title: Each owner's pipeline, description: "Stacked by stage. Click an owner to list their deals in the table." }
                  children:
                    - type: ui-chart
                      props: { title: Pipeline by owner, type: bar, data: "{{ deals }}", x: assignee, y: amount, series: column, aggregate: sum, stack: true, horizontal: true, height: 300, bind: owner }
                      on: { change: { action: set_state, key: view, value: table } }
                - type: ui-card
                  props: { title: Closing by month, description: "Open deals, by the month they're due to close, and tier." }
                  children:
                    - type: ui-chart
                      props: { title: Closing by month, type: bar, data: "{{ deals }}", filter: { column: { not: [Won, Lost] } }, x: month, xType: category, sort: month, y: amount, series: tier, aggregate: sum, stack: true, height: 280 }
                - type: ui-card
                  props: { title: Won and lost, description: By region. }
                  children:
                    - type: ui-chart
                      props: { title: Won and lost by region, type: bar, data: "{{ deals }}", filter: { column: [Won, Lost] }, x: region, series: column, aggregate: count, height: 280 }
