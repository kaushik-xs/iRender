# Block: a sales pipeline. One list of deals in state, `deals`, drawn four ways: a board,
# a table, and two charts. Drag a deal to another stage and the table's stage column,
# its subtotals and the charts follow, since they all read `deals`.
#
# - Board settings picks the swimlanes (none, owner, region or tier) and how much each
#   card shows (the `fields` list comes from state), so one board covers several views.
# - Filters narrow the board (its `filter`) by owner, region, tier, product or value;
#   counts read "2 of 5", and Negotiation's limit still counts every deal.
# - Negotiation has a limit of 4; Lost starts folded.
# - The table is grouped by stage with subtotals, and its owner filter, search and sort
#   are its own. Clicking an owner's bar in Forecast filters the table to them.
# - The deal clicked (or opened with Enter) shows beside the board.
#
#   cargo run -p irender-cli -- render examples/blocks/crm-01.yaml --ui-kit --chart-kit --icon-kit -o crm-01.html
version: 1
state:
  view: board
  lanes: none
  detail: standard
  deal: null
  owner: null
  boardFilter: {}
  stageTones: { Lead: neutral, Qualified: info, Proposal: primary, Negotiation: warning, Won: success, Lost: danger }
  compact: []
  standard: [ { field: value, label: Value }, { field: close, label: Closes, cell: date } ]
  detailed: [ { field: value, label: Value }, { field: close, label: Closes, cell: date }, { field: assignee, label: Owner }, { field: product, label: Product, cell: badge, tones: { Platform: primary, Analytics: info } } ]
  stages:
    - { id: Lead, title: Lead, tone: neutral }
    - { id: Qualified, title: Qualified, tone: info }
    - { id: Proposal, title: Proposal, tone: primary }
    - { id: Negotiation, title: Negotiation, tone: warning, limit: 4 }
    - { id: Won, title: Won, tone: success }
    - { id: Lost, title: Lost, tone: danger }
  deals:
    - {"id": "D-301", "column": "Lead", "title": "Northwind Traders", "assignee": "Dan Okafor", "amount": 300000, "value": "$300k", "close": "2026-12-14", "month": "2026-12", "region": "Asia Pacific", "tier": "Enterprise", "product": "Support plus", "tags": [{"label": "Enterprise", "tone": "primary"}]}
    - {"id": "D-302", "column": "Lead", "title": "Harbor Freight Co", "assignee": "Ravi Kumar", "amount": 24000, "value": "$24k", "close": "2027-01-11", "month": "2027-01", "region": "North America", "tier": "Enterprise", "product": "Support plus", "tags": [{"label": "Enterprise", "tone": "primary"}]}
