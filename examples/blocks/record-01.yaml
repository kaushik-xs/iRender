# Block: one record's page, here a piece of plant on a wind farm: its figures, facts edited
# in place, pictures, what changed, and what people say about it.
# - `ui-banner` across the top counts down to the next inspection.
# - `ui-stat` tiles show change, trend and progress to a target.
# - `ui-description-list` edits a value where it's shown (click the owner or the note).
# - `ui-lightbox` opens the pictures, `ui-diff` compares the last change field by field, and
#   `ui-comments` holds threads with mentions, reactions and resolving.
#
#   cargo run -p irender-cli -- render examples/blocks/record-01.yaml --ui-kit --icon-kit -o record-01.html
version: 1
state:
  bannerShut: false
  owner: Lena Hoffmann
  stage: Running
  note: ""
  thread:
    - id: c1
      who: Lena Hoffmann
      when: "2026-11-21T08:40:00Z"
      text: "Gearbox vibration is back above 4 mm/s. @Tomas Vega can you look before the inspection?"
      reactions: { "👀": [Tomas Vega] }
      replies:
        - { id: c2, who: Tomas Vega, when: "2026-11-21T10:05:00Z", text: "On it. I'll change the filter first, the readings are at https://example.com/readings/t14" }
    - { id: c3, who: Ana Ruiz, when: "2026-11-18T15:20:00Z", text: Photos from the blade check are in., resolved: true }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 32px 16px 80px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 40px 24px 96px }
  children:
    - type: stack
      style: { max-width: 1180px, margin: 0 auto, gap: 24px }
      children:
        - { type: ui-banner, props: { title: Inspection due., text: "Time left:", countdown: "2026-12-04T08:00:00Z", tone: warning, icon: warning, bind: bannerShut, align: start }, style: { border-radius: 10px } }
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 4px }
              children:
                - { type: ui-heading, props: { level: 2, text: "Turbine T-14" } }
                - { type: ui-text, props: { variant: muted, text: "Coastal site · 3.6 MW · commissioned 2021" } }
            - type: element
              style: { display: flex, gap: 8px }
              children:
                - { type: ui-status-badge, props: { status: "{{ stage }}", tones: { Running: success, Stopped: danger, Service: warning } } }

        - type: element
          style: { display: grid, gap: 16px, grid-template-columns: "repeat(auto-fit, minmax(210px, 1fr))" }
          children:
            - { type: ui-stat, props: { label: Output today, value: 48200, unit: kWh, previous: 45100, changeLabel: vs yesterday, trend: [31, 36, 34, 40, 43, 45, 48] } }
            - { type: ui-stat, props: { label: Availability, value: 0.962, format: percent, decimals: 1, change: -0.011, goodWhen: up, changeLabel: this month } }
            - { type: ui-stat, props: { label: Gearbox vibration, value: 4.2, unit: mm/s, previous: 3.4, goodWhen: down, changeLabel: in 7 days, trend: [3.1, 3.2, 3.4, 3.3, 3.8, 4, 4.2] } }
            - { type: ui-stat, props: { label: Year to date, value: 10.4, unit: GWh, target: 12, targetLabel: "87% of the year's 12 GWh" } }
        - type: element
          style: { display: grid, gap: 20px, align-items: start, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 1.5fr) minmax(0, 1fr)" } }
          children:
            - type: stack
              style: { gap: 20px }
              children:
                - type: ui-card
                  props: { title: Details }
                  children:
                    - type: ui-description-list
                      props: { columns: 2 }
                      children:
                        - { type: ui-description-item, props: { label: Serial number, value: WT-3600-00814, copy: true } }
                        - { type: ui-description-item, props: { label: Last service, value: "2026-06-11", format: date } }
                        - { type: ui-description-item, props: { label: Owner, bind: owner, edit: select, options: [Lena Hoffmann, Tomas Vega, Ana Ruiz] } }
                        - { type: ui-description-item, props: { label: State, bind: stage, edit: select, options: [Running, Service, Stopped] } }
                        - { type: ui-description-item, props: { label: Manual, value: Service manual 7.2, href: "#manual" } }
                        - { type: ui-description-item, props: { label: Book value, value: 2180000, format: currency, currency: EUR } }
                        - { type: ui-description-item, props: { label: Note, bind: note, edit: multiline, placeholder: Add a note, span: 2 } }
                - type: ui-card
                  props: { title: Pictures }
                  children:
                    - type: ui-lightbox
                      props:
                        minWidth: 120
                        max: 4
                        download: true
                        images:
                          - { src: media/tour.jpg, caption: "Nacelle, 11 June" }
                          - { src: media/alfama.svg, caption: "Blade A, leading edge" }
                          - { src: media/belem.svg, caption: "Blade B" }
                          - { src: media/sintra.svg, caption: "Blade C" }
                          - { src: media/tram.svg, caption: "Access road" }
                - type: ui-diff
                  props:
                    mode: fields
                    title: Last change, 11 June
                    labels: [Before, After]
                    fieldLabels: { gearbox: Gearbox, oil: Oil grade, interval: Service interval, alarm: Vibration alarm }
                    before: { gearbox: "ZF 4.1 rev B", oil: ISO 320, interval: 12 months, alarm: 5 mm/s }
                    after: { gearbox: "ZF 4.1 rev C", oil: ISO 320, interval: 9 months, alarm: 4.5 mm/s, spare: ordered }
            - type: stack
              style: { gap: 20px }
              children:
                - type: ui-item-group
                  props: { label: Documents }
                  children:
                    - { type: ui-item, props: { title: Inspection plan, description: "Version 4, approved", icon: calendar, tone: primary, href: "#plan", meta: 2 pages } }
                    - { type: ui-item, props: { title: Warranty, description: "Until March 2031", icon: lock, tone: success, href: "#warranty" } }
                    - { type: ui-item, props: { title: Open alarms, description: "Gearbox vibration, high", icon: bell, tone: danger }, children: [ { type: ui-button, props: { label: View, size: sm, variant: outline } } ] }
                - type: ui-card
                  props: { title: Comments }
                  children:
                    - { type: ui-comments, props: { bind: thread, user: Tomas Vega, people: [ { name: Lena Hoffmann, detail: Site lead }, { name: Tomas Vega, detail: Technician }, { name: Ana Ruiz, detail: Drone pilot } ], resolvable: true } }
