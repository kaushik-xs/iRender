# Block: an operations dashboard to arrange. Drag a tile by its header, resize it from
# its bottom corner, or focus a header and use the arrow keys (Shift with them resizes);
# the other tiles make way and float up. The layout is kept in state, so Reset layout
# puts the tiles back, and the charts redraw at their tile's new size. The alerts strip
# is locked in place. On a tablet (a grid under 960px) the tiles have a layout of their
# own, six columns wide, kept apart from the desktop one; on a phone they stack.
# Widgets adds and removes tiles: each tile's `when` reads a flag the menu sets, a
# removed tile's space closes up, and Returns (off to start with) takes the first free spot.
# Storage used is a gauge (`ui-gauge`) against the site's bands and its 85% target.
#
#   cargo run -p irender-cli -- render examples/blocks/dashboard-02.yaml --ui-kit --chart-kit --icon-kit -o dashboard-02.html
version: 1
state:
  layout: null
  showOrders: true
  showRate: true
  showAccuracy: true
  showBacklog: true
  showReturns: false
  showThroughput: true
  showZones: true
  showDocks: true
  showStorage: true
  storage: 82.6
  throughput:
    - { hour: "06:00", picked: 420, packed: 380 }
    - { hour: "08:00", picked: 910, packed: 860 }
    - { hour: "10:00", picked: 1240, packed: 1180 }
    - { hour: "12:00", picked: 980, packed: 1020 }
    - { hour: "14:00", picked: 1320, packed: 1250 }
    - { hour: "16:00", picked: 1150, packed: 1190 }
    - { hour: "18:00", picked: 760, packed: 820 }
  zones:
    - { zone: Ambient, orders: 2140 }
    - { zone: Chilled, orders: 960 }
    - { zone: Frozen, orders: 410 }
    - { zone: Bulky, orders: 230 }
  docks:
    - { dock: "D1", carrier: Bluedart, status: Loading, eta: "14:20" }
    - { dock: "D2", carrier: Delhivery, status: Waiting, eta: "14:45" }
    - { dock: "D4", carrier: Ekart, status: Departed, eta: "13:55" }
    - { dock: "D6", carrier: DTDC, status: Delayed, eta: "15:30" }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 28px 16px 64px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 32px 24px 80px }
  children:
    - type: stack
      style: { max-width: 1400px, margin: 0 auto, gap: 20px }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 6px }
              children:
                - { type: ui-breadcrumb, props: { items: [ { label: iRender, href: "#" }, { label: Warehouses, href: "#" }, { label: Bhiwandi DC } ] } }
                - { type: ui-heading, props: { level: 2, text: "Today at Bhiwandi DC" } }
                - { type: ui-text, props: { variant: muted, text: "Drag a tile by its header, or resize it from its corner. Arrow keys work on a focused header." } }
            - type: element
              style: { display: flex, gap: 8px }
              children:
                - type: ui-dropdown-menu
                  props: { trigger: Widgets, align: end }
                  children:
                    - { type: ui-menu-label, props: { text: On the dashboard } }
                    - { type: ui-menu-checkbox, props: { label: Orders shipped, bind: showOrders, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Pick rate, bind: showRate, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Pick accuracy, bind: showAccuracy, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Backlog, bind: showBacklog, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Returns, bind: showReturns, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Throughput by hour, bind: showThroughput, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Orders by zone, bind: showZones, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Dock schedule, bind: showDocks, keepOpen: true } }
                    - { type: ui-menu-checkbox, props: { label: Storage used, bind: showStorage, keepOpen: true } }
                - type: ui-button
                  props: { label: Reset layout, variant: outline, icon: rotate-ccw }
                  on: { click: { action: set_state, key: layout, value: null } }
        - type: ui-dashboard-grid
          props:
            bind: layout
            rowHeight: 72
            label: Bhiwandi DC dashboard
            stackBelow: 560
            breakpoints: { desktop: { width: 960, columns: 12 }, tablet: { width: 560, columns: 6 } }
          children:
            - type: ui-tile
              props: { id: alerts, x: 0, y: 0, w: 12, h: 1, locked: true }
              children:
                - type: element
                  style: { display: flex, align-items: center, gap: 12px, height: 100%, font-size: 14px }
                  children:
                    - { type: ui-badge, props: { text: 2 alerts, variant: destructive } }
                    - { type: text, props: { value: "Dock D6 is 35 minutes late · Chilled zone at 94% capacity" } }
            - type: ui-tile
              props: { id: orders, when: "{{ showOrders }}", title: Orders shipped, x: 0, y: 1, w: 3, h: 2, minW: 2, layouts: { tablet: { w: 3 } } }
              children:
                - { type: text, props: { value: "3,740" }, style: { font-size: 32px, font-weight: 700, line-height: 1 } }
                - { type: ui-text, props: { variant: muted, text: "+8.2% on last Thursday" } }
            - type: ui-tile
              props: { id: rate, when: "{{ showRate }}", title: Pick rate, x: 3, y: 1, w: 3, h: 2, minW: 2, layouts: { tablet: { w: 3 } } }
              children:
                - { type: text, props: { value: "142 / hr" }, style: { font-size: 32px, font-weight: 700, line-height: 1 } }
                - { type: ui-sparkline, props: { data: [118, 126, 131, 129, 138, 142, 140, 142] } }
            - type: ui-tile
              props: { id: accuracy, when: "{{ showAccuracy }}", title: Pick accuracy, x: 6, y: 1, w: 3, h: 2, minW: 2, layouts: { tablet: { w: 3 } } }
              children:
                - type: element
                  style: { display: flex, align-items: center, gap: 16px }
                  children:
                    - { type: ui-progress-ring, props: { value: 99.4, size: 56, label: Pick accuracy } }
                    - { type: ui-text, props: { variant: muted, text: "12 mis-picks in 2,031 lines" } }
            - type: ui-tile
              props: { id: backlog, when: "{{ showBacklog }}", title: Backlog, x: 9, y: 1, w: 3, h: 2, minW: 2, layouts: { tablet: { w: 3 } } }
              children:
                - { type: text, props: { value: "486" }, style: { font-size: 32px, font-weight: 700, line-height: 1 } }
                - { type: ui-progress, props: { value: 38 } }
            - type: ui-tile
              props: { id: returns, when: "{{ showReturns }}", title: Returns, w: 3, h: 2, minW: 2 }
              children:
                - { type: text, props: { value: "27" }, style: { font-size: 32px, font-weight: 700, line-height: 1 } }
                - { type: ui-text, props: { variant: muted, text: "5 damaged in transit" } }
            - type: ui-tile
              props: { id: throughput, when: "{{ showThroughput }}", title: Throughput by hour, x: 0, y: 3, w: 8, h: 4, minW: 4, minH: 3, layouts: { tablet: { x: 0, y: 5, w: 6, h: 4 } } }
              children:
                - { type: ui-chart, props: { type: line, data: "{{ throughput }}", x: hour, smooth: true, height: 100%, title: Throughput by hour } }
            - type: ui-tile
              props: { id: zones, when: "{{ showZones }}", title: Orders by zone, x: 8, y: 3, w: 4, h: 4, minW: 3, minH: 3, layouts: { tablet: { x: 0, y: 9, w: 6, h: 4 } } }
              children:
                - { type: ui-chart, props: { type: donut, data: "{{ zones }}", height: 100%, title: Orders by zone } }
            - type: ui-tile
              props: { id: storage, when: "{{ showStorage }}", title: Storage used, x: 0, y: 11, w: 4, h: 3, minW: 3, minH: 3, layouts: { tablet: { x: 0, y: 13, w: 3, h: 3 } } }
              children:
                - type: element
                  style: { display: flex, justify-content: center }
                  children:
                    - type: ui-gauge
                      props:
                        value: "{{ storage }}"
                        unit: "%"
                        size: 150
                        target: 85
                        caption: "Pallet positions filled; 85% is the target"
                        label: Storage used
                        bands: [{ to: 70, tone: success, label: Room to spare }, { to: 90, tone: warning, label: Getting full }, { tone: danger, label: Full }]
            - type: ui-tile
              props: { id: docks, when: "{{ showDocks }}", title: Dock schedule, x: 0, y: 7, w: 12, h: 4, minW: 6, minH: 3 }
              children:
                - type: ui-data-table
                  props:
                    rows: "{{ docks }}"
                    rowKey: dock
                    paging: none
                    columns: [ { field: dock, label: Dock }, { field: carrier, label: Carrier }, { field: status, label: Status }, { field: eta, label: ETA, align: right } ]
