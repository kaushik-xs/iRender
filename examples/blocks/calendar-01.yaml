# Block: a plant's calendar. Maintenance, audits, safety drills, shifts, meetings and
# holidays in a `ui-event-calendar`, coloured by category, with the month, week and
# list views. Click an event to see it in the panel beside the calendar, or a day to
# see what's on it; the arrow keys move through the days and Enter picks one.
#
#   cargo run -p irender-cli -- render examples/blocks/calendar-01.yaml --ui-kit --icon-kit -o calendar-01.html
version: 1
state:
  event: null
  day: "2026-11-04"
  events:
    - { id: 1, title: Production planning, start: "2026-11-02T10:00", end: "2026-11-02T11:30", category: Meetings, description: "Weekly plan for lines 1–4 with the shift leads." }
    - { id: 2, title: Line 3 maintenance, start: "2026-11-04", end: "2026-11-06", category: Maintenance, description: "Gearbox overhaul. Line 3 is down; orders move to line 2." }
    - { id: 3, title: Shift handover, start: "2026-11-04T06:00", end: "2026-11-04T06:30", category: Shifts }
    - { id: 4, title: Supplier audit, start: "2026-11-04T11:00", end: "2026-11-04T13:00", category: Audits, description: "Castings supplier, on site. Quality and traceability." }
    - { id: 5, title: Fire drill, start: "2026-11-04T11:30", end: "2026-11-04T12:00", category: Safety }
    - { id: 6, title: Diwali, start: "2026-11-08", category: Holidays, description: Plant closed. }
    - { id: 7, title: Night shift begins, start: "2026-11-09T22:00", end: "2026-11-10T06:00", category: Shifts }
    - { id: 8, title: Forklift training, start: "2026-11-12T09:00", end: "2026-11-12T12:00", category: Safety }
    - { id: 9, title: Production planning, start: "2026-11-16T10:00", end: "2026-11-16T11:30", category: Meetings }
    - { id: 10, title: ISO 9001 recertification, start: "2026-11-18", end: "2026-11-19", category: Audits, description: "External auditor, two days. Documents in the quality room." }
    - { id: 11, title: Quarterly review, start: "2026-11-18T14:00", end: "2026-11-18T16:00", category: Meetings }
    - { id: 12, title: Compressor service, start: "2026-11-21T08:00", end: "2026-11-21T14:00", category: Maintenance }
    - { id: 13, title: Boiler inspection, start: "2026-11-24", category: Maintenance, description: "Statutory inspection. Steam off from 6:00." }
    - { id: 14, title: Production planning, start: "2026-11-30T10:00", end: "2026-11-30T11:30", category: Meetings }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 28px 16px 64px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 32px 24px 80px }
  children:
    - type: stack
      style: { max-width: 1320px, margin: 0 auto, gap: 20px }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 6px }
              children:
                - { type: ui-breadcrumb, props: { items: [ { label: Pune plant, href: "#" }, { label: Calendar } ] } }
                - { type: ui-heading, props: { level: 2, text: Plant calendar } }
                - { type: ui-text, props: { variant: muted, text: "Maintenance, audits, safety, shifts and meetings for the Pune plant." } }
            - { type: ui-button, props: { label: Add event, icon: add } }
        - type: element
          style: { display: grid, gap: 20px, grid-template-columns: "minmax(0, 1fr)", "@xl": { grid-template-columns: "minmax(0, 1fr) 300px" }, align-items: start }
          children:
            - type: ui-event-calendar
              props:
                events: "{{ events }}"
                categories: { Maintenance: warning, Audits: info, Safety: danger, Shifts: neutral, Meetings: primary, Holidays: success }
                bindEvent: event
                bindDay: day
                date: "2026-11-04"
                hours: [6, 18]
                label: Plant calendar
            - type: ui-card
              props: { title: "{{ event ? event.title : 'Nothing selected' }}", description: "{{ event ? event.category : 'Click an event to see it here.' }}" }
              style: { position: sticky, top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: if
                  props: { when: "{{ event }}" }
                  children:
                    - type: element
                      props: { tag: dl }
                      style: { display: grid, grid-template-columns: "max-content 1fr", gap: "8px 16px", margin: 0, font-size: 14px }
                      children:
                        - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: Starts } } ] }
                        - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ event.start }}" } } ] }
                        - { type: element, props: { tag: dt }, style: { color: $color.muted }, children: [ { type: text, props: { value: Ends } } ] }
                        - { type: element, props: { tag: dd }, style: { margin: 0 }, children: [ { type: text, props: { value: "{{ event.end ? event.end : 'Same day' }}" } } ] }
                    - type: if
                      props: { when: "{{ event.description }}" }
                      children:
                        - { type: ui-separator }
                        - { type: ui-text, props: { text: "{{ event.description }}" }, style: { font-size: 14px } }
                - { type: ui-separator }
                - { type: ui-text, props: { variant: muted, text: "Picked day: {{ day }}. Add event would open a form for it." }, style: { font-size: 13px } }
