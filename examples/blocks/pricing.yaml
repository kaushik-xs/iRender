# Block: a pricing page with a monthly / yearly switch, three plans, a feature table and
# questions. Prices follow the switch in the browser.
#
#   cargo run -p irender-cli -- render examples/blocks/pricing.yaml --ui-kit --icon-kit -o pricing.html
version: 1
state:
  billing: yearly
  toast: null
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 64px 24px 96px
    background: $color.surface
    color: $color.text
    font-family: $font.body
  children:
    - type: stack
      props: { gap: 56 }
      style: { max-width: 1080, margin: 0 auto }
      children:
        # ---------------------------------------------------------- header
        - type: stack
          props: { gap: 16 }
          style: { align-items: center, text-align: center }
          children:
            - { type: ui-badge, props: { text: Pricing, variant: secondary } }
            - { type: ui-heading, props: { level: 1, text: Plans that grow with you }, style: { text-wrap: balance } }
            - type: ui-text
              props: { variant: lead, text: "Start free, upgrade when your team does. Every plan includes unlimited documents and a 14-day trial of Pro." }
              style: { max-width: 640, text-wrap: balance }
            - type: stack
              props: { direction: row, gap: 12, align: center }
              style: { margin-top: 8 }
              children:
                - type: ui-toggle-group
                  props:
                    bind: billing
                    variant: outline
                    options: [{ value: monthly, label: Monthly }, { value: yearly, label: Yearly }]
                - { type: ui-badge, props: { text: Save 20%, icon: "↓", variant: outline } }

        # ---------------------------------------------------------- plans
        - type: list
          props:
            as: plan
            items:
              - name: Hobby
                description: For side projects and trying things out.
                monthly: "$0"
                yearly: "$0"
                note: Free forever
                cta: Get started
                features: [{ text: 1 project, ok: true }, { text: Up to 3 members, ok: true }, { text: Community support, ok: true }, { text: Custom domains, ok: false }, { text: Audit log, ok: false }]
              - name: Pro
                popular: true
                description: For growing teams that ship every week.
                monthly: "$19"
                yearly: "$15"
                note: per member
                cta: Start a free trial
                features: [{ text: Unlimited projects, ok: true }, { text: Unlimited members, ok: true }, { text: Priority email support, ok: true }, { text: Custom domains, ok: true }, { text: Audit log, ok: false }]
              - name: Enterprise
                description: For organizations with security and compliance needs.
                monthly: Custom
                yearly: Custom
                note: Volume pricing
                cta: Contact sales
                features: [{ text: Everything in Pro, ok: true }, { text: SSO and SCIM, ok: true }, { text: A dedicated success manager, ok: true }, { text: Custom domains, ok: true }, { text: Audit log and 99.99% SLA, ok: true }]
          style: { display: grid, gap: 24, grid-template-columns: "repeat(auto-fit, minmax(280px, 1fr))", align-items: stretch }
          children:
            - type: ui-card
              style:
                position: relative
                gap: 24
                border-color: "{{ plan.popular ? 'var(--color-primary)' : 'var(--color-border)' }}"
                box-shadow: "{{ plan.popular ? '0 10px 30px rgb(0 0 0 / 0.1)' : '0 1px 2px rgb(0 0 0 / 0.05)' }}"
              children:
                - type: if
                  props: { when: "{{ plan.popular == true }}" }
                  children:
                    - type: ui-badge
                      props: { text: Most popular }
                      style: { position: absolute, top: -11, left: 50%, transform: translateX(-50%) }
                - type: stack
                  props: { gap: 6 }
                  children:
                    - { type: element, props: { tag: h2 }, style: { margin: 0, font-size: 18, font-weight: 600 }, children: [ { type: text, props: { value: "{{ plan.name }}" } } ] }
                    - { type: ui-text, props: { variant: muted, text: "{{ plan.description }}" } }
                - type: stack
                  props: { gap: 4 }
                  children:
                    - type: element
                      style: { display: flex, align-items: baseline, gap: 4 }
                      children:
                        - type: text
                          props: { value: "{{ billing == 'yearly' ? plan.yearly : plan.monthly }}" }
                          style: { font-size: 40, font-weight: 700, letter-spacing: -0.02em, font-variant-numeric: tabular-nums }
                        - type: if
                          props: { when: "{{ plan.monthly != 'Custom' }}" }
                          children: [ { type: text, props: { value: /month }, style: { color: $color.muted } } ]
                    - type: text
                      props: { value: "{{ plan.note }}{{ plan.monthly != 'Custom' && plan.monthly != '$0' ? (billing == 'yearly' ? ', billed yearly' : ', billed monthly') : '' }}" }
                      style: { font-size: 14, color: $color.muted }
                - type: ui-button
                  props: { label: "{{ plan.cta }}", variant: "{{ plan.popular ? 'default' : 'outline' }}" }
                  style: { width: 100% }
                  on: { click: { action: set_state, key: toast, value: { title: "{{ plan.name }}", description: "{{ plan.cta }}: we'll take it from here." } } }
                - { type: ui-separator }
                - type: list
                  props: { items: "{{ plan.features }}", as: f, tag: ul }
                  style: { display: grid, gap: 12, margin: 0, padding: 0, list-style: none, font-size: 14 }
                  children:
                    - type: element
                      props: { tag: li }
                      style: { display: flex, align-items: center, gap: 10, color: "{{ f.ok ? 'var(--color-text)' : 'var(--color-muted)' }}" }
                      children:
                        - type: if
                          props: { when: "{{ f.ok }}" }
                          children: [ { type: ui-icon, props: { name: check, size: 16, label: Included }, style: { color: $color.primary } } ]
                        - type: else
                          children: [ { type: ui-icon, props: { name: close, size: 16, label: Not included } } ]
                        - { type: text, props: { value: "{{ f.text }}" }, style: { text-decoration: "{{ f.ok ? 'none' : 'line-through' }}" } }

        # ---------------------------------------------------------- comparison
        - type: stack
          props: { gap: 16 }
          children:
            - { type: ui-heading, props: { level: 3, text: Compare plans }, style: { text-align: center } }
            - type: element
              style: { border: 1px solid $color.border, border-radius: 8, overflow: hidden }
              children:
                - type: ui-table
                  props: { caption: What each plan includes }
                  children:
                    - type: element
                      props: { tag: thead }
                      style: { background: $color.subtle }
                      children:
                        - type: element
                          props: { tag: tr }
                          children:
                            - { type: element, props: { tag: th }, children: [ { type: text, props: { value: Feature } } ] }
                            - { type: element, props: { tag: th }, style: { text-align: center }, children: [ { type: text, props: { value: Hobby } } ] }
                            - { type: element, props: { tag: th }, style: { text-align: center }, children: [ { type: text, props: { value: Pro } } ] }
                            - { type: element, props: { tag: th }, style: { text-align: center }, children: [ { type: text, props: { value: Enterprise } } ] }
                    - type: list
                      props:
                        tag: tbody
                        as: row
                        items:
                          - [Projects, "1", Unlimited, Unlimited]
                          - [Members, Up to 3, Unlimited, Unlimited]
                          - [Storage, 1 GB, 100 GB, Custom]
                          - [Custom domains, "—", "✓", "✓"]
                          - [SSO and SCIM, "—", "—", "✓"]
                          - [Audit log, "—", "—", "✓"]
                          - [Support, Community, Priority email, Dedicated manager]
                      children:
                        - type: element
                          props: { tag: tr }
                          children:
                            - { type: element, props: { tag: th }, attrs: { scope: row }, style: { font-weight: 500 }, children: [ { type: text, props: { value: "{{ row.0 }}" } } ] }
                            - { type: element, props: { tag: td }, style: { text-align: center }, children: [ { type: text, props: { value: "{{ row.1 }}" } } ] }
                            - { type: element, props: { tag: td }, style: { text-align: center }, children: [ { type: text, props: { value: "{{ row.2 }}" } } ] }
                            - { type: element, props: { tag: td }, style: { text-align: center }, children: [ { type: text, props: { value: "{{ row.3 }}" } } ] }

        # ---------------------------------------------------------- questions
        - type: stack
          props: { gap: 16 }
          style: { max-width: 720, width: 100%, margin: 0 auto }
          children:
            - { type: ui-heading, props: { level: 3, text: Frequently asked questions }, style: { text-align: center } }
            - type: ui-accordion
              props: { id: faq }
              children:
                - type: ui-accordion-item
                  props: { title: Can I change plans later? }
                  children: [ { type: ui-text, props: { text: "Yes. Upgrade or downgrade at any time; we prorate the difference on your next invoice." } } ]
                - type: ui-accordion-item
                  props: { title: What happens when my trial ends? }
                  children: [ { type: ui-text, props: { text: "You stay on Hobby unless you add a payment method. Nothing is deleted: projects over the Hobby limit become read-only." } } ]
                - type: ui-accordion-item
                  props: { title: Do you offer discounts for non-profits and education? }
                  children: [ { type: ui-text, props: { text: "Yes, 50% off Pro for registered non-profits and schools. Contact sales with proof of status." } } ]
                - type: ui-accordion-item
                  props: { title: How does yearly billing work? }
                  children: [ { type: ui-text, props: { text: "You pay for twelve months up front at the yearly price, which works out 20% cheaper than paying monthly." } } ]

        # ---------------------------------------------------------- call to action
        - type: ui-card
          style: { align-items: center, text-align: center, gap: 16, padding: 40, background: $color.subtle }
          children:
            - { type: ui-heading, props: { level: 3, text: Still deciding? } }
            - { type: ui-text, props: { variant: muted, text: "Try Pro free for 14 days. No credit card required." } }
            - type: stack
              props: { direction: row, gap: 8, wrap: true }
              style: { justify-content: center }
              children:
                - type: ui-button
                  props: { label: Start a free trial }
                  on: { click: { action: set_state, key: toast, value: { title: Trial started, description: Pro is yours for 14 days. } } }
                - { type: ui-button, props: { label: Talk to sales, variant: outline } }

    - { type: ui-toaster, props: { bind: toast } }
