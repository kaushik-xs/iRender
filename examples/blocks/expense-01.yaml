# Block: an expense claim with its receipts. The claim's lines are a table; the receipts
# are a `ui-file-upload` holding three files already sent and taking more:
# - Drop files on the zone or click it; images, PDFs, spreadsheets and text up to 10 MB.
#   Served with `python3 examples/serve.py`, they upload to its api/upload.
# - Click a receipt to preview it: the image, the PDF, and the .xlsx as a table, read in
#   the browser. Arrows go through them.
# - Download all saves the receipts as one zip; Submit needs at least one receipt.
# - Submitting sends it for approval (`ui-approval`): the line manager, then any one of
#   finance. "Viewing as" switches who's looking, to decide on each one's turn; asking for
#   changes or rejecting needs a reason, and then the claimant can send it again.
#
#   cargo run -p irender-cli -- render examples/blocks/expense-01.yaml --ui-kit --icon-kit -o expense-01.html
version: 1
state:
  toast: null
  submitted: false
  claimStatus: pending
  viewer: ravi
  approval:
    - { id: manager, title: Line manager, approvers: [ { id: ravi, name: Ravi Kumar } ] }
    - { id: finance, title: Finance, rule: any, approvers: [ { id: asha, name: Asha Rao }, { id: mei, name: Mei Lin } ] }
  purpose: Client visit, Mumbai
  advance: 10000
  receipts:
    - { id: r1, name: taxi-receipt.svg, size: 1169, type: image/svg+xml, url: files/taxi-receipt.svg, status: done }
    - { id: r2, name: hotel-invoice.pdf, size: 781, type: application/pdf, url: files/hotel-invoice.pdf, status: done }
    - { id: r3, name: expenses.xlsx, size: 2078, url: files/expenses.xlsx, status: done }
  lines:
    - { date: "3 Nov", merchant: IndiGo, category: Travel, amount: "₹8,450" }
    - { date: "3 Nov", merchant: Taj Lands End, category: Hotel, amount: "₹12,600" }
    - { date: "4 Nov", merchant: Uber, category: Travel, amount: "₹640" }
    - { date: "4 Nov", merchant: Café Madras, category: Meals, amount: "₹920" }
    - { date: "5 Nov", merchant: Uber, category: Travel, amount: "₹710" }
root:
  type: element
  style:
    min-height: 100svh
    box-sizing: border-box
    padding: 32px 16px 80px
    background: $color.surface
    color: $color.text
    font-family: $font.body
    "@md": { padding: 40px 24px 96px }
  children:
    - type: stack
      style: { max-width: 960px, margin: 0 auto, gap: 24px }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, align-items: end, justify-content: space-between, gap: 12px }
          children:
            - type: stack
              style: { gap: 6px }
              children:
                - { type: ui-breadcrumb, props: { items: [ { label: Expenses, href: "#" }, { label: "Claim EXP-2048" } ] } }
                - { type: ui-heading, props: { level: 2, text: "{{ purpose }}" } }
                - type: element
                  style: { display: flex, gap: 8px, align-items: center, flex-wrap: wrap }
                  children:
                    - { type: ui-status-badge, props: { status: "{{ !submitted ? 'Draft' : claimStatus == 'pending' ? 'Waiting for approval' : claimStatus == 'changes' ? 'Changes requested' : claimStatus == 'approved' ? 'Approved' : 'Rejected' }}", tones: { Waiting for approval: info, Changes requested: warning } } }
                    - { type: ui-text, props: { variant: muted, text: "3–5 Nov 2026 · 5 expenses · ₹23,320" } }
            - type: element
              style: { display: flex, gap: 8px }
              children:
                - type: ui-button
                  props: { label: Save draft, variant: outline }
                  on: { click: { action: set_state, key: toast, value: { title: Draft saved } } }
                - type: ui-button
                  props: { label: "{{ submitted ? 'Submitted' : 'Submit claim' }}", disabled: "{{ receipts.length == 0 || submitted }}" }
                  on:
                    click:
                      - { action: set_state, key: submitted, value: true }
                      - { action: set_state, key: toast, value: { title: Claim submitted, description: "{{ receipts.length }} receipts attached. Your manager will review it." } }
        - type: if
          props: { when: "{{ submitted }}" }
          children:
            - type: ui-card
              props: { title: Approval, description: "The line manager, then any one of finance." }
              children:
                - type: ui-field
                  props: { label: Viewing as, orientation: horizontal }
                  style: { margin-bottom: 16px, max-width: 360px }
                  children:
                    - type: ui-select
                      props: { bind: viewer, options: [ { value: kaushik, label: Kaushik (sent it) }, { value: ravi, label: Ravi (line manager) }, { value: asha, label: Asha (finance) }, { value: mei, label: Mei (finance) } ] }
                - type: ui-approval
                  props: { bind: approval, me: "{{ viewer }}", owner: kaushik, bindStatus: claimStatus, label: Claim approval }
                  on: { done: { action: set_state, key: toast, value: { title: "Claim {{ claimStatus }}" } } }
        - type: ui-card
          props: { title: Expenses }
          children:
            - type: ui-table
              children:
                - type: element
                  props: { tag: thead }
                  children:
                    - type: element
                      props: { tag: tr }
                      children:
                        - { type: element, props: { tag: th }, children: [ { type: text, props: { value: Date } } ] }
                        - { type: element, props: { tag: th }, children: [ { type: text, props: { value: Merchant } } ] }
                        - { type: element, props: { tag: th }, children: [ { type: text, props: { value: Category } } ] }
                        - { type: element, props: { tag: th }, style: { text-align: right }, children: [ { type: text, props: { value: Amount } } ] }
                - type: list
                  props: { items: "{{ lines }}", as: line, tag: tbody }
                  children:
                    - type: element
                      props: { tag: tr }
                      children:
                        - { type: element, props: { tag: td }, children: [ { type: text, props: { value: "{{ line.date }}" } } ] }
                        - { type: element, props: { tag: td }, children: [ { type: text, props: { value: "{{ line.merchant }}" } } ] }
                        - { type: element, props: { tag: td }, children: [ { type: ui-badge, props: { text: "{{ line.category }}", variant: outline } } ] }
                        - { type: element, props: { tag: td }, style: { text-align: right, font-variant-numeric: tabular-nums }, children: [ { type: text, props: { value: "{{ line.amount }}" } } ] }
        - type: ui-card
          props: { title: Advance, description: "Cash taken before the trip is taken off what you're paid back." }
          children:
            - type: element
              style: { display: grid, gap: 16px, grid-template-columns: "minmax(0, 1fr)", "@md": { grid-template-columns: "minmax(0, 260px) 1fr" }, align-items: end }
              children:
                - type: ui-field
                  props: { label: Cash advance }
                  children: [ { type: ui-number-input, props: { bind: advance, currency: INR, locale: en-IN, min: 0, max: 23320, placeholder: "0" } } ]
                - type: stack
                  style: { gap: 2px, padding-bottom: 6px }
                  children:
                    - { type: text, props: { value: "{{ advance > 23320 ? 'More than the claim' : 'To be paid back: ₹' + (23320 - (advance ? advance : 0)) }}" }, style: { font-weight: 600, font-size: 15px } }
                    - { type: text, props: { value: "Claim total ₹23,320, less the advance." }, style: { color: $color.muted, font-size: 13px } }
        - type: ui-card
          props: { title: Receipts, description: "Attach a receipt for every expense over ₹500. Click one to check it." }
          children:
            - type: ui-file-upload
              props:
                bind: receipts
                url: api/upload
                params: { claim: EXP-2048 }
                accept: "image/*,.pdf,.csv,.xlsx,.txt"
                maxSize: 10 MB
                maxFiles: 12
                hint: Images, PDFs, spreadsheets or text, up to 10 MB each
                zipName: EXP-2048 receipts
    - { type: ui-toaster, props: { bind: toast } }
