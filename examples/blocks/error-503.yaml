# Block: an error page (Error 503). The drawing is `ui-illustration` (`maintenance`), coloured
# by the theme's primary colour and its second brand colour (`color.brand-2`), so it
# follows the palette, the custom colours and dark mode.
#
#   cargo run -p irender-cli -- render examples/blocks/error-503.yaml --ui-kit --icon-kit -o error-503.html
version: 1
root:
  type: element
  props: { tag: main }
  style:
    min-height: 100svh
    box-sizing: border-box
    display: grid
    place-items: center
    padding: 40px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 16, align: center }
      style: { max-width: 540, text-align: center }
      children:
        - { type: ui-illustration, props: { name: maintenance, size: "min(340px, 80vw)" } }
        - { type: ui-badge, props: { text: "Error 503", variant: secondary } }
        - { type: ui-heading, props: { level: 1, text: "We'll be back shortly" }, style: { font-size: 32 } }
        - { type: ui-text, props: { variant: lead, text: "We're doing some planned maintenance to make things faster. Your data is safe, and nothing you saved is lost." }, style: { font-size: 16 } }
        - type: stack
          props: { gap: 6 }
          style: { width: 100%, max-width: 320 }
          children:
            - { type: ui-progress, props: { value: 70 } }
            - { type: ui-text, props: { variant: muted, text: "About 70% done. Back by 14:00 UTC." } }
        - type: stack
          props: { direction: row, gap: 8, justify: center }
          style: { flex-wrap: wrap, margin-top: 8 }
          children:
            - { type: ui-button, props: { label: Check status, variant: default, href: "#" } }
            - { type: ui-button, props: { label: Follow updates, variant: outline, href: "#" } }
