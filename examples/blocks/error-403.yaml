# Block: an error page (Error 403). The drawing is `ui-illustration` (`forbidden`), coloured
# by the theme's primary colour and its second brand colour (`color.brand-2`), so it
# follows the palette, the custom colours and dark mode.
#
#   cargo run -p irender-cli -- render examples/blocks/error-403.yaml --ui-kit --icon-kit -o error-403.html
version: 1
root:
  type: element
  props: { tag: main }
  style:
    min-height: 100svh
    box-sizing: border-box
    display: grid
    place-items: center
    padding: 40px 24px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 16, align: center }
      style: { max-width: 540, text-align: center }
      children:
        - { type: ui-illustration, props: { name: forbidden, size: "min(340px, 80vw)" } }
        - { type: ui-badge, props: { text: "Error 403", variant: secondary } }
        - { type: ui-heading, props: { level: 1, text: "You don't have access to this page" }, style: { font-size: 32 } }
        - { type: ui-text, props: { variant: lead, text: "Your account doesn't have permission to see this. Ask a workspace admin for access, or switch to an account that has it." }, style: { font-size: 16 } }
        - type: ui-text
          props: { variant: muted, text: "Signed in as ada@example.com" }
        - type: stack
          props: { direction: row, gap: 8, justify: center }
          style: { flex-wrap: wrap, margin-top: 8 }
          children:
            - { type: ui-button, props: { label: Request access, variant: default, href: "#" } }
            - { type: ui-button, props: { label: Switch account, variant: outline, href: "#" } }
