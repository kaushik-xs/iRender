# Digital twins: paths and following. One example of irender-twin-kit; twin/index.yaml
# links them all, and blocks twin-01 to twin-03 are whole pages.
#
#   cargo run -p irender-cli -- render examples/twin/paths.yaml --ui-kit --twin-kit -o twin/paths.html
#
# The models are in examples/twin/models, next to the page (see models/CREDITS.md).
version: 1
state:
  # A world from configuration
  view: overview
  # Machine data
  motorTemp: 64
  beltSpeed: 24
  fault: false
  machine: null
  # Coloured by value
  heat: 0
  # Paths
  amrSpeed: 0.8
  liftAt: 30
  following: ""
  # Popups
  job: null
  # Live
  live: {}
  # Editing
  desk:
    - { id: table-1, model: table, position: [-1.5, 0], title: Table 1 }
    - { id: table-2, model: table, position: [1.5, 0], title: Table 2 }
    - { id: drum-1, model: drum, position: [0, 2], title: Drum 1 }
root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 24px 24px 64px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: element
      props: { tag: nav }
      attrs: { aria-label: Twin examples }
      style: { display: flex, flex-wrap: wrap, gap: 4, padding-bottom: 12, border-bottom: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: All twins, variant: ghost, size: sm, href: index.html } }
        - { type: ui-button, props: { label: "A world from configuration", variant: ghost, size: sm, href: world.html } }
        - { type: ui-button, props: { label: "Machine data and limits", variant: ghost, size: sm, href: machine-data.html } }
        - { type: ui-button, props: { label: "Coloured by value", variant: ghost, size: sm, href: colour-by-value.html } }
        - { type: ui-button, props: { label: "Paths and following", variant: secondary, size: sm, href: paths.html }, attrs: { aria-current: page } }
        - { type: ui-button, props: { label: "Popups of your own", variant: ghost, size: sm, href: popups.html } }
        - { type: ui-button, props: { label: "Any model format", variant: ghost, size: sm, href: formats.html } }
        - { type: ui-button, props: { label: "Live data", variant: ghost, size: sm, href: live-data.html } }
        - { type: ui-button, props: { label: "Editing a layout", variant: ghost, size: sm, href: editing.html } }
    - type: stack
      props: { gap: 6 }
      children:
        - { type: ui-heading, props: { level: 1, text: "Paths and following" } }
        - { type: ui-text, props: { variant: lead, text: "An object with a path drives it at its speed in metres a second, or stands at progress (0 to 1) along it, so a feed can say where it is. The camera can follow one." } }
    - type: element
      style: { display: flex, flex-wrap: wrap, gap: 16, align-items: end, margin-bottom: 12 }
      children:
        - type: ui-field
          props: { label: "Robots at {{ amrSpeed }} m/s" }
          style: { width: 240 }
          children: [ { type: ui-slider, props: { bind: amrSpeed, min: 0, max: 2, step: 0.1 } } ]
        - type: ui-field
          props: { label: "Lift at {{ liftAt }}%" }
          style: { width: 240 }
          children: [ { type: ui-slider, props: { bind: liftAt, min: 0, max: 100 } } ]
        - type: ui-button
          props: { label: "{{ following ? 'Stop following' : 'Follow robot 1' }}", variant: outline, size: sm }
          on: { click: { action: set_state, key: following, value: "{{ following ? '' : 'a1' }}" } }
    - type: ui-twin
      attrs: { id: paths }
      props:
        height: 600
        title: Robots on their paths
        follow: "{{ following }}"
        models: { amr: { url: models/amr.glb, fit: 1 }, jack: models/pallet_jack.glb }
        paths:
          - { id: loop, points: [[-5, -3], [5, -3], [5, 3], [-5, 3]], closed: true, tone: info, flow: 0.8 }
          - { id: lane, points: [[-5, 5], [5, 5]], tone: warning }
        objects:
          - { id: a1, model: amr, path: loop, speed: "{{ amrSpeed }}", title: Robot 1, label: Robot 1 }
          - { id: a2, model: amr, path: loop, speed: "{{ amrSpeed }}", progress: 0.5, title: Robot 2 }
          - { id: j1, model: jack, path: lane, progress: "{{ liftAt / 100 }}", title: Lift, label: "Lift {{ liftAt }}%" }
    - type: element
      style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center, padding-top: 16, border-top: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: "Next: Popups of your own", href: popups.html } }
        - { type: text, props: { value: "Whole pages:" }, style: { margin-left: auto, color: $color.muted, font-size: 14 } }
        - { type: ui-button, props: { label: Packing hall, variant: outline, size: sm, href: ../blocks/twin-01.html } }
        - { type: ui-button, props: { label: Cold store, variant: outline, size: sm, href: ../blocks/twin-02.html } }
        - { type: ui-button, props: { label: Layout planner, variant: outline, size: sm, href: ../blocks/twin-03.html } }
