# Digital twins: coloured by value. One example of irender-twin-kit; twin/index.yaml
# links them all, and blocks twin-01 to twin-03 are whole pages.
#
#   cargo run -p irender-cli -- render examples/twin/colour-by-value.yaml --ui-kit --twin-kit -o twin/colour-by-value.html
#
# The models are in examples/twin/models, next to the page (see models/CREDITS.md).
version: 1
state:
  # A world from configuration
  view: overview
  # Machine data
  motorTemp: 64
  beltSpeed: 24
  fault: false
  machine: null
  # Coloured by value
  heat: 0
  # Paths
  amrSpeed: 0.8
  liftAt: 30
  following: ""
  # Popups
  job: null
  # Live
  live: {}
  # Editing
  desk:
    - { id: table-1, model: table, position: [-1.5, 0], title: Table 1 }
    - { id: table-2, model: table, position: [1.5, 0], title: Table 2 }
    - { id: drum-1, model: drum, position: [0, 2], title: Drum 1 }
root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 24px 24px 64px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: element
      props: { tag: nav }
      attrs: { aria-label: Twin examples }
      style: { display: flex, flex-wrap: wrap, gap: 4, padding-bottom: 12, border-bottom: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: All twins, variant: ghost, size: sm, href: index.html } }
        - { type: ui-button, props: { label: "A world from configuration", variant: ghost, size: sm, href: world.html } }
        - { type: ui-button, props: { label: "Machine data and limits", variant: ghost, size: sm, href: machine-data.html } }
        - { type: ui-button, props: { label: "Coloured by value", variant: secondary, size: sm, href: colour-by-value.html }, attrs: { aria-current: page } }
        - { type: ui-button, props: { label: "Paths and following", variant: ghost, size: sm, href: paths.html } }
        - { type: ui-button, props: { label: "Popups of your own", variant: ghost, size: sm, href: popups.html } }
        - { type: ui-button, props: { label: "Any model format", variant: ghost, size: sm, href: formats.html } }
        - { type: ui-button, props: { label: "Live data", variant: ghost, size: sm, href: live-data.html } }
        - { type: ui-button, props: { label: "Editing a layout", variant: ghost, size: sm, href: editing.html } }
    - type: stack
      props: { gap: 6 }
      children:
        - { type: ui-heading, props: { level: 1, text: "Coloured by value" } }
        - { type: ui-text, props: { variant: lead, text: "colorBy colours objects along a scale by a field: here nine temperature sensors over a floor, from blue at 0 °C to red at 40 °C. A sensor is a small sphere that shows its value." } }
    - type: ui-field
      props: { label: "Warmer by {{ heat }} °C" }
      style: { max-width: 320, margin-bottom: 12 }
      children: [ { type: ui-slider, props: { bind: heat, min: -10, max: 20 } } ]
    - type: ui-twin
      attrs: { id: heatmap }
      props:
        height: 600
        title: Temperature sensors
        colorBy: { field: temp, min: 0, max: 40 }
        readouts: [ { field: temp, label: Temperature, unit: °C, decimals: 0, warn: 30, alarm: 35 } ]
        ground: { size: [12, 10] }
        camera: { position: [0, 9, 9], target: [0, 0, 0] }
        objects:
          - { id: s1, shape: sensor, position: [-4, 1, -3], title: Sensor 1, temp: "{{ 12 + heat }}" }
          - { id: s2, shape: sensor, position: [0, 1, -3], title: Sensor 2, temp: "{{ 16 + heat }}" }
          - { id: s3, shape: sensor, position: [4, 1, -3], title: Sensor 3, temp: "{{ 18 + heat }}" }
          - { id: s4, shape: sensor, position: [-4, 1, 0], title: Sensor 4, temp: "{{ 15 + heat }}" }
          - { id: s5, shape: sensor, position: [0, 1, 0], title: Sensor 5, temp: "{{ 22 + heat }}" }
          - { id: s6, shape: sensor, position: [4, 1, 0], title: Sensor 6, temp: "{{ 25 + heat }}" }
          - { id: s7, shape: sensor, position: [-4, 1, 3], title: Sensor 7, temp: "{{ 17 + heat }}" }
          - { id: s8, shape: sensor, position: [0, 1, 3], title: Sensor 8, temp: "{{ 24 + heat }}" }
          - { id: s9, shape: sensor, position: [4, 1, 3], title: Sensor 9, temp: "{{ 28 + heat }}" }
    - type: element
      style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center, padding-top: 16, border-top: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: "Next: Paths and following", href: paths.html } }
        - { type: text, props: { value: "Whole pages:" }, style: { margin-left: auto, color: $color.muted, font-size: 14 } }
        - { type: ui-button, props: { label: Packing hall, variant: outline, size: sm, href: ../blocks/twin-01.html } }
        - { type: ui-button, props: { label: Cold store, variant: outline, size: sm, href: ../blocks/twin-02.html } }
        - { type: ui-button, props: { label: Bottling line, variant: outline, size: sm, href: ../blocks/twin-04.html } }
        - { type: ui-button, props: { label: Layout planner, variant: outline, size: sm, href: ../blocks/twin-03.html } }
