# Digital twins from irender-twin-kit, in irender-ui-kit cards.
#
#   cargo run -p irender-cli -- render examples/twin/gallery.yaml --ui-kit --twin-kit -o twin/index.html
#
# The models are in examples/twin/models, next to the page; most are NVIDIA SimReady assets
# (see models/CREDITS.md). The Live data section needs examples/serve.py.
version: 1
state:
  # A world from configuration
  view: overview
  # Machine data
  motorTemp: 64
  beltSpeed: 24
  fault: false
  machine: null
  # Coloured by value
  heat: 0
  # Paths
  amrSpeed: 0.8
  liftAt: 30
  following: ""
  # Popups
  job: null
  # Live
  live: {}
  # Editing
  desk:
    - { id: table-1, model: table, position: [-1.5, 0], title: Table 1 }
    - { id: table-2, model: table, position: [1.5, 0], title: Table 2 }
    - { id: drum-1, model: drum, position: [0, 2], title: Drum 1 }
root:
  type: stack
  props: { gap: 32 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 40px 24px 80px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-heading, props: { level: 1, text: Digital twins } }
        - type: ui-text
          props:
            variant: lead
            text: "irender-twin-kit draws 3D worlds with three.js from models of most formats. Everything in a world is configuration that may use state: the models, where things stand, the paths they follow, zones, walls, light and views. Machine and sensor values come from state or a feed of the twin's own, show on the objects, and raise warnings and alarms past their limits."

    # ---------------------------------------------------------------- a world from configuration
    - type: ui-card
      props: { title: A world from configuration, description: "Models by name, objects placed in metres, zones and walls, a path with flow, and named views. Drag to turn it, right-drag to move it, scroll to zoom; with the keyboard, the arrows turn it and + and − zoom." }
      children:
        - type: ui-twin
          attrs: { id: world }
          props:
            height: 420
            title: A small warehouse
            bindView: view
            models: { rack: models/rack.glb, pallet: models/pallet.glb, forklift: models/forklift.glb, carton: models/carton.glb, conveyor: models/conveyor.glb }
            objects:
              - { id: r1, model: rack, position: [-4, -3], title: Rack 1 }
              - { id: r2, model: rack, position: [-4, 0], title: Rack 2 }
              - { id: c1, model: conveyor, position: [3, -3], title: Conveyor 1 }
              - { id: c2, model: conveyor, position: [5, -3], title: Conveyor 2 }
              - { id: p1, model: pallet, position: [3, 2.5], title: Pallet }
              - { id: b1, model: carton, position: [3, 0.14, 2.5], title: Order 1200, description: 12 cases }
              - { id: f1, model: forklift, path: route, speed: 1, title: Forklift }
              - { id: pillar, shape: box, size: [0.4, 3, 0.4], position: [0, 3], color: "#a1a1aa", title: Pillar }
            paths:
              - { id: route, points: [[-1.5, -4.5], [-1.5, 4], [6, 4], [6, -1]], closed: true, flow: true, tone: warning }
            zones:
              - { id: store, center: [-4, -1.5], size: [5.5, 6], tone: info, label: Storage }
              - { id: pack, center: [4, -3], size: [5, 2.2], tone: success, label: Packing }
            walls:
              - { points: [[-8, -6], [8, -6], [8, 6], [-8, 6]], closed: true, height: 1.2, opacity: 0.5 }
            views:
              - { id: overview, label: Overview, position: [9, 11, 13], target: [0, 0, 0] }
              - { id: storage, label: Storage, position: [1, 5, 4], target: [-4, 1, -1.5] }
              - { id: top, label: Top, position: [0, 20, 0.1], target: [0, 0, 0] }

    # ---------------------------------------------------------------- machine data
    - type: ui-card
      props: { title: Machine data and limits, description: "Any field of an object is its data. Readouts say which to show, with their unit and limits: past warn the machine turns warning, past alarm it's in alarm, glows red and is announced. Move the sliders, or make it fault." }
      children:
        - type: element
          style: { display: grid, gap: 16, grid-template-columns: "minmax(0, 1fr)", "@lg": { grid-template-columns: "minmax(0, 2fr) minmax(0, 1fr)" } }
          children:
            - type: ui-twin
              attrs: { id: machine }
              props:
                height: 340
                title: A conveyor's data
                bindObject: machine
                models: { conveyor: models/conveyor.glb }
                toneBy: { field: status, tones: { running: success, fault: danger } }
                alarmBy: { field: status, values: [fault] }
                readouts:
                  - { field: temp, label: Motor, unit: °C, warn: 70, alarm: 85 }
                  - { field: speed, label: Belt, unit: m/min, warn: 28, alarm: 32 }
                objects:
                  - { id: cv, model: conveyor, position: [0, 0], title: Conveyor 4, status: "{{ fault ? 'fault' : 'running' }}", temp: "{{ motorTemp }}", speed: "{{ beltSpeed }}" }
                camera: { position: [3.5, 3, 4.5], target: [0, 0.6, 0] }
            - type: stack
              props: { gap: 16 }
              children:
                - type: ui-field
                  props: { label: "Motor {{ motorTemp }} °C" }
                  children: [ { type: ui-slider, props: { bind: motorTemp, min: 40, max: 95 } } ]
                - type: ui-field
                  props: { label: "Belt {{ beltSpeed }} m/min" }
                  children: [ { type: ui-slider, props: { bind: beltSpeed, min: 0, max: 35 } } ]
                - { type: ui-switch, props: { bind: fault, label: Fault } }
                - type: text
                  props: { value: "{{ machine ? (machine.status == 'fault' ? 'In alarm: fault' : motorTemp >= 85 ? 'In alarm: motor too hot' : motorTemp >= 70 || beltSpeed >= 28 ? 'Warning' : 'Within limits') : '' }}" }
                  style: { font-size: 14, color: $color.muted }

    # ---------------------------------------------------------------- coloured by value
    - type: ui-card
      props: { title: Coloured by value, description: "colorBy colours objects along a scale by a field: here nine temperature sensors over a floor, from blue at 0 °C to red at 40 °C. A sensor is a small sphere that shows its value." }
      children:
        - type: ui-field
          props: { label: "Warmer by {{ heat }} °C" }
          style: { max-width: 320, margin-bottom: 12 }
          children: [ { type: ui-slider, props: { bind: heat, min: -10, max: 20 } } ]
        - type: ui-twin
          attrs: { id: heatmap }
          props:
            height: 360
            title: Temperature sensors
            colorBy: { field: temp, min: 0, max: 40 }
            readouts: [ { field: temp, label: Temperature, unit: °C, decimals: 0, warn: 30, alarm: 35 } ]
            ground: { size: [12, 10] }
            camera: { position: [0, 9, 9], target: [0, 0, 0] }
            objects:
              - { id: s1, shape: sensor, position: [-4, 1, -3], title: Sensor 1, temp: "{{ 12 + heat }}" }
              - { id: s2, shape: sensor, position: [0, 1, -3], title: Sensor 2, temp: "{{ 16 + heat }}" }
              - { id: s3, shape: sensor, position: [4, 1, -3], title: Sensor 3, temp: "{{ 18 + heat }}" }
              - { id: s4, shape: sensor, position: [-4, 1, 0], title: Sensor 4, temp: "{{ 15 + heat }}" }
              - { id: s5, shape: sensor, position: [0, 1, 0], title: Sensor 5, temp: "{{ 22 + heat }}" }
              - { id: s6, shape: sensor, position: [4, 1, 0], title: Sensor 6, temp: "{{ 25 + heat }}" }
              - { id: s7, shape: sensor, position: [-4, 1, 3], title: Sensor 7, temp: "{{ 17 + heat }}" }
              - { id: s8, shape: sensor, position: [0, 1, 3], title: Sensor 8, temp: "{{ 24 + heat }}" }
              - { id: s9, shape: sensor, position: [4, 1, 3], title: Sensor 9, temp: "{{ 28 + heat }}" }

    # ---------------------------------------------------------------- paths
    - type: ui-card
      props: { title: Paths and following, description: "An object with a path drives it at its speed in metres a second, or stands at progress (0 to 1) along it, so a feed can say where it is. The camera can follow one." }
      children:
        - type: element
          style: { display: flex, flex-wrap: wrap, gap: 16, align-items: end, margin-bottom: 12 }
          children:
            - type: ui-field
              props: { label: "Robots at {{ amrSpeed }} m/s" }
              style: { width: 240 }
              children: [ { type: ui-slider, props: { bind: amrSpeed, min: 0, max: 2, step: 0.1 } } ]
            - type: ui-field
              props: { label: "Lift at {{ liftAt }}%" }
              style: { width: 240 }
              children: [ { type: ui-slider, props: { bind: liftAt, min: 0, max: 100 } } ]
            - type: ui-button
              props: { label: "{{ following ? 'Stop following' : 'Follow robot 1' }}", variant: outline, size: sm }
              on: { click: { action: set_state, key: following, value: "{{ following ? '' : 'a1' }}" } }
        - type: ui-twin
          attrs: { id: paths }
          props:
            height: 380
            title: Robots on their paths
            follow: "{{ following }}"
            models: { amr: { url: models/amr.glb, fit: 1 }, jack: models/pallet_jack.glb }
            paths:
              - { id: loop, points: [[-5, -3], [5, -3], [5, 3], [-5, 3]], closed: true, tone: info, flow: 0.8 }
              - { id: lane, points: [[-5, 5], [5, 5]], tone: warning }
            objects:
              - { id: a1, model: amr, path: loop, speed: "{{ amrSpeed }}", title: Robot 1, label: Robot 1 }
              - { id: a2, model: amr, path: loop, speed: "{{ amrSpeed }}", progress: 0.5, title: Robot 2 }
              - { id: j1, model: jack, path: lane, progress: "{{ liftAt / 100 }}", title: Lift, label: "Lift {{ liftAt }}%" }

    # ---------------------------------------------------------------- popups
    - type: ui-card
      props: { title: Popups of your own, description: "Without a popup of its own, an object's popup shows its title, description and readouts. A ui-twin-popup is any components, with the object in scope as object; ui-twin-panel floats above the view." }
      children:
        - type: ui-twin
          attrs: { id: popups }
          props:
            height: 360
            title: Pallets to pick
            bind: job
            models: { pallet: models/pallet.glb, crate: models/crate_green.glb }
            camera: { position: [0, 5, 6], target: [0, 0, 0] }
            toneBy: { field: state, tones: { ready: success, waiting: warning, late: danger } }
            objects:
              - { id: P-1, model: pallet, position: [-2.5, 0], title: Pallet P-1, state: ready, order: "Store 12", lines: 24, done: 24 }
              - { id: P-2, model: pallet, position: [0, 0], title: Pallet P-2, state: waiting, order: "Store 3", lines: 18, done: 11 }
              - { id: P-3, model: pallet, position: [2.5, 0], title: Pallet P-3, state: late, order: "Store 7", lines: 30, done: 6 }
              - { id: c1, model: crate, position: [-2.5, 0.14, 0], clickable: false }
              - { id: c2, model: crate, position: [0, 0.14, 0], clickable: false }
          children:
            - type: ui-twin-popup
              children:
                - type: element
                  style: { display: flex, align-items: center, gap: 8 }
                  children:
                    - { type: text, props: { value: "{{ object.title }}" }, style: { font-weight: 600 } }
                    - { type: ui-status-badge, props: { status: "{{ object.state }}", tones: { ready: success, waiting: warning, late: danger } } }
                - { type: text, props: { value: "For {{ object.order }} · {{ object.done }} of {{ object.lines }} lines picked" }, style: { color: $color.muted, font-size: 13 } }
                - { type: ui-progress, props: { value: "{{ object.done * 100 / object.lines }}" } }
                - type: ui-button
                  props: { label: Close, size: sm, variant: outline }
                  on: { click: { action: set_state, key: job, value: null } }
            - type: ui-twin-panel
              props: { position: top-left }
              children:
                - { type: ui-badge, props: { text: "{{ job ? 'Picked ' + job : 'Click a pallet' }}", variant: secondary } }

    # ---------------------------------------------------------------- formats
    - type: ui-card
      props: { title: Any model format, description: "glTF and GLB (with Draco, meshopt and KTX2 compression), OBJ with its MTL, FBX, STL, PLY, Collada, 3MF, 3DS, VRML and USD. units, up, scale, fit and rotate put a model right: here an STL drawn in millimetres with z up, and an OBJ beside a GLB." }
      children:
        - type: ui-twin
          attrs: { id: formats }
          props:
            height: 340
            title: Models of three formats
            labels: all
            camera: { position: [0, 3, 5], target: [0, 0.4, 0] }
            models:
              drum: models/drum_steel.glb
              beacon: { url: models/beacon.obj, color: "#f59e0b" }
              bracket: { url: models/bracket.stl, units: mm, up: z, color: "#64748b" }
            objects:
              - { id: g, model: drum, position: [-1.6, 0], title: GLB }
              - { id: o, model: beacon, position: [0, 0], title: OBJ }
              - { id: s, model: bracket, position: [1.6, 0], title: STL in mm }

    # ---------------------------------------------------------------- live data
    - type: ui-card
      props: { title: Live data, description: "live polls an address or follows a stream of server-sent events, and merges each answer into the objects with the same id. Here, a packing line from examples/serve.py, every two seconds; bindLive keeps the values in state too." }
      children:
        - type: ui-twin
          attrs: { id: live }
          props:
            height: 340
            title: A line, live
            live: { url: api/twin/plant, every: 2000 }
            bindLive: live
            models: { conveyor: models/conveyor.glb }
            toneBy: { field: status, tones: { running: success, stopped: warning, fault: danger } }
            alarmBy: { field: status, values: [fault] }
            readouts: [ { field: temp, label: Motor, unit: °C, warn: 70, alarm: 85 }, { field: speed, label: Belt, unit: m/min, tag: false } ]
            camera: { position: [0, 4.5, 6], target: [0, 0.5, 0] }
            objects:
              - { id: cv-1, model: conveyor, position: [-3, 0], title: Section 1 }
              - { id: cv-2, model: conveyor, position: [-1, 0], title: Section 2 }
              - { id: cv-3, model: conveyor, position: [1, 0], title: Section 3 }
              - { id: cv-4, model: conveyor, position: [3, 0], title: Section 4 }
        - type: text
          props: { value: "{{ live['cv-1'] ? 'Last values at ' + live.plant.time : 'No values yet: serve the examples with examples/serve.py' }}" }
          style: { display: block, margin-top: 8, font-size: 13, color: $color.muted }

    # ---------------------------------------------------------------- editing
    - type: ui-card
      props: { title: Editing a layout, description: "editable with bindObjects: drag objects to move them, Alt and the arrows move the selected one, Alt+R turns it, Delete removes it, and the palette adds more. Each change is written back to the rows in state. Block twin-03 is a whole planner." }
      children:
        - type: ui-twin
          attrs: { id: editing }
          props:
            height: 340
            title: A layout to change
            objects: "{{ desk }}"
            bindObjects: desk
            editable: true
            snap: 0.5
            labels: all
            camera: { position: [0, 6, 7], target: [0, 0, 0] }
            models: { table: models/table_ss.glb, drum: models/drum_steel.glb }
            palette: [ { label: Table, model: table, title: Table }, { label: Drum, model: drum, title: Drum } ]
            ground: { size: [10, 8], grid: 0.5 }
        - type: text
          props: { value: "{{ desk.length }} objects: {{ desk[0] ? desk[0].title + ' at ' + desk[0].position[0] + ', ' + desk[0].position[1] : '' }} …" }
          style: { display: block, margin-top: 8, font-size: 13, color: $color.muted }
