# Digital twins: any model format. One example of irender-twin-kit; twin/index.yaml
# links them all, and blocks twin-01 to twin-03 are whole pages.
#
#   cargo run -p irender-cli -- render examples/twin/formats.yaml --ui-kit --twin-kit -o twin/formats.html
#
# The models are in examples/twin/models, next to the page (see models/CREDITS.md).
version: 1
state:
  # A world from configuration
  view: overview
  # Machine data
  motorTemp: 64
  beltSpeed: 24
  fault: false
  machine: null
  # Coloured by value
  heat: 0
  # Paths
  amrSpeed: 0.8
  liftAt: 30
  following: ""
  # Popups
  job: null
  # Live
  live: {}
  # Editing
  desk:
    - { id: table-1, model: table, position: [-1.5, 0], title: Table 1 }
    - { id: table-2, model: table, position: [1.5, 0], title: Table 2 }
    - { id: drum-1, model: drum, position: [0, 2], title: Drum 1 }
root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 24px 24px 64px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: element
      props: { tag: nav }
      attrs: { aria-label: Twin examples }
      style: { display: flex, flex-wrap: wrap, gap: 4, padding-bottom: 12, border-bottom: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: All twins, variant: ghost, size: sm, href: index.html } }
        - { type: ui-button, props: { label: "A world from configuration", variant: ghost, size: sm, href: world.html } }
        - { type: ui-button, props: { label: "Machine data and limits", variant: ghost, size: sm, href: machine-data.html } }
        - { type: ui-button, props: { label: "Coloured by value", variant: ghost, size: sm, href: colour-by-value.html } }
        - { type: ui-button, props: { label: "Paths and following", variant: ghost, size: sm, href: paths.html } }
        - { type: ui-button, props: { label: "Popups of your own", variant: ghost, size: sm, href: popups.html } }
        - { type: ui-button, props: { label: "Any model format", variant: secondary, size: sm, href: formats.html }, attrs: { aria-current: page } }
        - { type: ui-button, props: { label: "Live data", variant: ghost, size: sm, href: live-data.html } }
        - { type: ui-button, props: { label: "Editing a layout", variant: ghost, size: sm, href: editing.html } }
        - { type: ui-button, props: { label: "Big worlds", variant: ghost, size: sm, href: big-world.html } }
    - type: stack
      props: { gap: 6 }
      children:
        - { type: ui-heading, props: { level: 1, text: "Any model format" } }
        - { type: ui-text, props: { variant: lead, text: "glTF and GLB (with Draco, meshopt and KTX2 compression), OBJ with its MTL, FBX, STL, PLY, Collada, 3MF, 3DS, VRML and USD. units, up, scale, fit and rotate put a model right: here an STL drawn in millimetres with z up, and an OBJ beside a GLB." } }
    - type: ui-twin
      attrs: { id: formats }
      props:
        height: 600
        title: Models of three formats
        labels: all
        camera: { position: [0, 3, 5], target: [0, 0.4, 0] }
        models:
          drum: models/drum_steel.glb
          beacon: { url: models/beacon.obj, color: "#f59e0b" }
          bracket: { url: models/bracket.stl, units: mm, up: z, color: "#64748b" }
        objects:
          - { id: g, model: drum, position: [-1.6, 0], title: GLB }
          - { id: o, model: beacon, position: [0, 0], title: OBJ }
          - { id: s, model: bracket, position: [1.6, 0], title: STL in mm }
    - type: element
      style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center, padding-top: 16, border-top: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: "Next: Live data", href: live-data.html } }
        - { type: text, props: { value: "Whole pages:" }, style: { margin-left: auto, color: $color.muted, font-size: 14 } }
        - { type: ui-button, props: { label: Packing hall, variant: outline, size: sm, href: ../blocks/twin-01.html } }
        - { type: ui-button, props: { label: Cold store, variant: outline, size: sm, href: ../blocks/twin-02.html } }
        - { type: ui-button, props: { label: Bottling line, variant: outline, size: sm, href: ../blocks/twin-04.html } }
        - { type: ui-button, props: { label: Layout planner, variant: outline, size: sm, href: ../blocks/twin-03.html } }
