# Digital twins: live data. One example of irender-twin-kit; twin/index.yaml
# links them all, and blocks twin-01 to twin-03 are whole pages.
#
#   cargo run -p irender-cli -- render examples/twin/live-data.yaml --ui-kit --twin-kit -o twin/live-data.html
#
# The models are in examples/twin/models, next to the page (see models/CREDITS.md). Needs examples/serve.py for its feed.
version: 1
state:
  # A world from configuration
  view: overview
  # Machine data
  motorTemp: 64
  beltSpeed: 24
  fault: false
  machine: null
  # Coloured by value
  heat: 0
  # Paths
  amrSpeed: 0.8
  liftAt: 30
  following: ""
  # Popups
  job: null
  # Live
  live: {}
  # Editing
  desk:
    - { id: table-1, model: table, position: [-1.5, 0], title: Table 1 }
    - { id: table-2, model: table, position: [1.5, 0], title: Table 2 }
    - { id: drum-1, model: drum, position: [0, 2], title: Drum 1 }
root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 24px 24px 64px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: element
      props: { tag: nav }
      attrs: { aria-label: Twin examples }
      style: { display: flex, flex-wrap: wrap, gap: 4, padding-bottom: 12, border-bottom: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: All twins, variant: ghost, size: sm, href: index.html } }
        - { type: ui-button, props: { label: "A world from configuration", variant: ghost, size: sm, href: world.html } }
        - { type: ui-button, props: { label: "Machine data and limits", variant: ghost, size: sm, href: machine-data.html } }
        - { type: ui-button, props: { label: "Coloured by value", variant: ghost, size: sm, href: colour-by-value.html } }
        - { type: ui-button, props: { label: "Paths and following", variant: ghost, size: sm, href: paths.html } }
        - { type: ui-button, props: { label: "Popups of your own", variant: ghost, size: sm, href: popups.html } }
        - { type: ui-button, props: { label: "Any model format", variant: ghost, size: sm, href: formats.html } }
        - { type: ui-button, props: { label: "Live data", variant: secondary, size: sm, href: live-data.html }, attrs: { aria-current: page } }
        - { type: ui-button, props: { label: "Editing a layout", variant: ghost, size: sm, href: editing.html } }
    - type: stack
      props: { gap: 6 }
      children:
        - { type: ui-heading, props: { level: 1, text: "Live data" } }
        - { type: ui-text, props: { variant: lead, text: "live polls an address or follows a stream of server-sent events, and merges each answer into the objects with the same id. Here, a packing line from examples/serve.py, every two seconds; bindLive keeps the values in state too." } }
    - type: ui-twin
      attrs: { id: live }
      props:
        height: 600
        title: A line, live
        live: { url: api/twin/plant, every: 2000 }
        bindLive: live
        models: { conveyor: models/conveyor.glb }
        toneBy: { field: status, tones: { running: success, stopped: warning, fault: danger } }
        alarmBy: { field: status, values: [fault] }
        readouts: [ { field: temp, label: Motor, unit: °C, warn: 70, alarm: 85 }, { field: speed, label: Belt, unit: m/min, tag: false } ]
        camera: { position: [0, 4.5, 6], target: [0, 0.5, 0] }
        objects:
          - { id: cv-1, model: conveyor, position: [-3, 0], title: Section 1 }
          - { id: cv-2, model: conveyor, position: [-1, 0], title: Section 2 }
          - { id: cv-3, model: conveyor, position: [1, 0], title: Section 3 }
          - { id: cv-4, model: conveyor, position: [3, 0], title: Section 4 }
    - type: text
      props: { value: "{{ live['cv-1'] ? 'Last values at ' + live.plant.time : 'No values yet: serve the examples with examples/serve.py' }}" }
      style: { display: block, margin-top: 8, font-size: 13, color: $color.muted }
    - type: element
      style: { display: flex, flex-wrap: wrap, gap: 8, align-items: center, padding-top: 16, border-top: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: "Next: Editing a layout", href: editing.html } }
        - { type: text, props: { value: "Whole pages:" }, style: { margin-left: auto, color: $color.muted, font-size: 14 } }
        - { type: ui-button, props: { label: Packing hall, variant: outline, size: sm, href: ../blocks/twin-01.html } }
        - { type: ui-button, props: { label: Cold store, variant: outline, size: sm, href: ../blocks/twin-02.html } }
        - { type: ui-button, props: { label: Bottling line, variant: outline, size: sm, href: ../blocks/twin-04.html } }
        - { type: ui-button, props: { label: Layout planner, variant: outline, size: sm, href: ../blocks/twin-03.html } }
