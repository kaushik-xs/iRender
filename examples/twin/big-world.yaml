root:
  type: stack
  props: { gap: 20 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 24px 24px 64px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: element
      props: { tag: nav }
      attrs: { aria-label: Twin examples }
      style: { display: flex, flex-wrap: wrap, gap: 4, padding-bottom: 12, border-bottom: 1px solid $color.border }
      children:
        - { type: ui-button, props: { label: All twins, variant: ghost, size: sm, href: index.html } }
        - { type: ui-button, props: { label: "A world from configuration", variant: ghost, size: sm, href: world.html } }
        - { type: ui-button, props: { label: "Machine data and limits", variant: ghost, size: sm, href: machine-data.html } }
        - { type: ui-button, props: { label: "Coloured by value", variant: ghost, size: sm, href: colour-by-value.html } }
        - { type: ui-button, props: { label: "Paths and following", variant: ghost, size: sm, href: paths.html } }
        - { type: ui-button, props: { label: "Popups of your own", variant: ghost, size: sm, href: popups.html } }
        - { type: ui-button, props: { label: "Any model format", variant: ghost, size: sm, href: formats.html } }
        - { type: ui-button, props: { label: "Live data", variant: ghost, size: sm, href: live-data.html } }
        - { type: ui-button, props: { label: "Editing a layout", variant: ghost, size: sm, href: editing.html } }
        - { type: ui-button, props: { label: "Big worlds", variant: secondary, size: sm, href: big-world.html }, attrs: { aria-current: page } }
    - type: stack
      props: { gap: 6 }
      children:
        - { type: ui-heading, props: { level: 1, text: "Big worlds" } }
        - { type: ui-text, props: { variant: lead, text: "900 objects, each with a readout; past its limit one is in alarm. Objects of the same model are drawn together, only those in view are drawn, and far from the camera a model used by 100 objects or more is drawn simpler (lod), made in the browser with meshoptimizer's simplifier; a model's far can name a simpler model of its own. Tags that would cover one that matters more wait." } }
    - type: ui-twin
      attrs: { id: big }
      props:
        height: 640
        title: 900 objects
        objects: "{{ rows }}"
        bind: picked
        lod: "{{ lod }}"
        labels: "{{ labels }}"
        models:
          pallet: models/pallet.glb
          crate: models/crate_blue.glb
          drum: models/drum_steel.glb
          tank: models/ibc_tank.glb
          conveyor: models/conveyor.glb
          lift: models/pallet_jack.glb
        readouts: [ { field: temp, label: Temperature, unit: °C, warn: 78, alarm: 85 } ]
        camera: { position: [34, 40, 52], target: [0, 0, 2] }
      children:
        - type: ui-twin-panel
          props: { position: top-left }
          children:
            - type: stack
              props: { gap: 6 }
              children:
                - type: ui-toggle-group
                  props: { bind: lod, variant: outline, size: sm, options: [{ value: auto, label: Simpler far away }, { value: none, label: Full detail }] }
                  attrs: { aria-label: Far away }
                  style: { background: $color.surface, border-radius: $radius.md }
                - type: ui-toggle-group
                  props: { bind: labels, variant: outline, size: sm, options: [{ value: auto, label: Tags }, { value: none, label: Alarms only }] }
                  attrs: { aria-label: Tags }
                  style: { background: $color.surface, border-radius: $radius.md }
