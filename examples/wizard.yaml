# A multi-step sign-up flow that runs entirely in the browser: no server data, no API.
#
# Shows:
#   - one `if` per step, switched by `step` in state; hidden steps keep their inputs
#   - fields that appear only for some answers (seats for Team, company for Enterprise)
#   - validation as an expression on the Next button
#   - a bound `select` with a placeholder and a bound `textarea`
#   - a step indicator built from a literal list, with live `aria-current`
#   - a computed summary, then a `call` that hands everything to the host app
#
#   cargo run -p irender-cli -- render examples/wizard.yaml -o wizard.html
version: 1
theme:
  tokens:
    color: { primary: "#0f766e", primary-hover: "#115e59" }
state:
  step: 1
  name: ""
  email: ""
  role: ""
  plan: ""
  seats: 2
  company: ""
  newsletter: true
  notes: ""
  done: false
root:
  type: stack
  props: { gap: $space.lg }
  style:
    max-width: 520px
    margin: 40px auto
    padding: $space.xl
    border: 1px solid $color.border
    border-radius: $radius.lg
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    # Step indicator: the labels are fixed, the highlighting is live.
    - type: list
      props:
        items:
          - { n: 1, label: Account }
          - { n: 2, label: Plan }
          - { n: 3, label: Preferences }
          - { n: 4, label: Review }
        as: s
        tag: ol
      style: { display: flex, gap: $space.sm, margin: 0, padding: 0, list-style: none, font-size: $font.size.sm }
      children:
        - type: text
          props: { tag: li, value: "{{ step > s.n || done ? '✓' : s.n }} {{ s.label }}" }
          attrs: { aria-current: "{{ step == s.n && !done ? 'step' : null }}" }
          style:
            flex: 1
            padding-bottom: 6px
            color: "{{ step >= s.n ? 'var(--color-text)' : 'var(--color-muted)' }}"
            border-bottom: 3px solid $color.border
            "&[aria-current=step]": { border-color: $color.primary, font-weight: 600 }

    - type: if
      props: { when: "{{ !done }}" }
      children:
        - type: stack
          props: { gap: $space.md }
          children:
            # ---- 1. Account
            - type: if
              props: { when: "{{ step == 1 }}" }
              children:
                - { type: text, props: { tag: h2, value: Create your account }, style: { margin: 0 } }
                - { type: input, props: { bind: name, placeholder: Full name }, attrs: { aria-label: Full name, autocomplete: name } }
                - { type: input, props: { bind: email, type: email, placeholder: you@example.com }, attrs: { aria-label: Email, autocomplete: email } }
                - type: select
                  props:
                    bind: role
                    placeholder: What do you do?
                    options:
                      - { value: dev, label: Developer }
                      - { value: design, label: Designer }
                      - { value: pm, label: Product manager }
                      - { value: other, label: Something else }
                  attrs: { aria-label: Role }

            # ---- 2. Plan
            - type: if
              props: { when: "{{ step == 2 }}" }
              children:
                - { type: text, props: { tag: h2, value: "Pick a plan, {{ name }}" }, style: { margin: 0 } }
                - type: list
                  props:
                    items:
                      - { key: solo, title: Solo, price: "₹499 / month" }
                      - { key: team, title: Team, price: "₹399 / seat / month" }
                      - { key: enterprise, title: Enterprise, price: Talk to us }
                    as: option
                  attrs: { role: radiogroup }
                  style: { display: grid, gap: $space.sm }
                  children:
                    - type: element
                      props: { tag: button }
                      attrs: { type: button, role: radio, aria-checked: "{{ plan == option.key }}" }
                      style:
                        display: flex
                        justify-content: space-between
                        padding: 14px 16px
                        font: inherit
                        text-align: left
                        cursor: pointer
                        background: $color.surface
                        color: $color.text
                        border: 1px solid $color.border
                        border-radius: $radius.md
                        "&[aria-checked=true]": { border-color: $color.primary, box-shadow: "0 0 0 1px var(--color-primary)" }
                      on: { click: { action: set_state, key: plan, value: "{{ option.key }}" } }
                      children:
                        - { type: text, props: { value: "{{ option.title }}" }, style: { font-weight: 600 } }
                        - { type: text, props: { value: "{{ option.price }}" }, style: { color: $color.muted } }
                - type: if
                  props: { when: "{{ plan == 'team' }}" }
                  children:
                    - type: stack
                      props: { direction: row, align: center, gap: $space.sm }
                      children:
                        - { type: text, props: { tag: label, value: "Seats (2 or more)" }, attrs: { for: seats } }
                        - { type: input, props: { bind: seats, type: number }, attrs: { id: seats, min: 2 }, style: { width: 90 } }
                - type: if
                  props: { when: "{{ plan == 'enterprise' }}" }
                  children:
                    - { type: input, props: { bind: company, placeholder: Company name }, attrs: { aria-label: Company } }
                    - type: text
                      props: { tag: p, value: "We'll contact {{ email }} within one business day." }
                      style: { margin: 0, color: $color.muted, font-size: $font.size.sm }

            # ---- 3. Preferences
            - type: if
              props: { when: "{{ step == 3 }}" }
              children:
                - { type: text, props: { tag: h2, value: Preferences }, style: { margin: 0 } }
                - type: element
                  props: { tag: label }
                  style: { display: flex, gap: $space.sm, align-items: center }
                  children:
                    - { type: input, props: { bind: newsletter, type: checkbox }, style: { padding: 0 } }
                    - { type: text, props: { value: Send me the monthly product newsletter } }
                - type: textarea
                  props: { bind: notes, rows: 3, placeholder: Anything we should know? (optional) }
                  attrs: { aria-label: Notes }

            # ---- 4. Review
            - type: if
              props: { when: "{{ step == 4 }}" }
              children:
                - { type: text, props: { tag: h2, value: Review }, style: { margin: 0 } }
                - type: element
                  props: { tag: dl }
                  style:
                    display: grid
                    grid-template-columns: max-content 1fr
                    gap: 6px 16px
                    margin: 0
                    "& dt": { color: $color.muted }
                    "& dd": { margin: 0 }
                  children:
                    - { type: text, props: { tag: dt, value: Name } }
                    - { type: text, props: { tag: dd, value: "{{ name }}" } }
                    - { type: text, props: { tag: dt, value: Email } }
                    - { type: text, props: { tag: dd, value: "{{ email }}" } }
                    - { type: text, props: { tag: dt, value: Plan } }
                    - type: text
                      props:
                        tag: dd
                        value: "{{ plan == 'team' ? 'Team · ' + seats + ' seats' : plan == 'enterprise' ? 'Enterprise · ' + (company || 'company not set') : 'Solo' }}"
                    - { type: text, props: { tag: dt, value: Monthly } }
                    - type: text
                      props:
                        tag: dd
                        value: "{{ plan == 'solo' ? '₹499' : plan == 'team' ? '₹' + seats * 399 : 'Custom quote' }}"
                      style: { font-weight: 600 }
                    - { type: text, props: { tag: dt, value: Role } }
                    - type: text
                      props:
                        tag: dd
                        value: "{{ role == 'dev' ? 'Developer' : role == 'design' ? 'Designer' : role == 'pm' ? 'Product manager' : 'Something else' }}"
                    - { type: text, props: { tag: dt, value: Newsletter } }
                    - { type: text, props: { tag: dd, value: "{{ newsletter ? 'Yes' : 'No' }}" } }
                    - { type: text, props: { tag: dt, value: Notes } }
                    - { type: text, props: { tag: dd, value: "{{ notes || '—' }}" }, style: { white-space: pre-wrap } }

            # ---- Navigation
            - type: stack
              props: { direction: row, justify: space-between }
              children:
                - type: button
                  props: { label: Back, variant: ghost, disabled: "{{ step == 1 }}" }
                  on: { click: { action: set_state, key: step, value: "{{ step - 1 }}" } }
                - type: if
                  props: { when: "{{ step < 4 }}" }
                  children:
                    - type: button
                      props:
                        label: Next
                        disabled: "{{ step == 1 ? !(name && email && role) : step == 2 ? !plan || (plan == 'team' && seats < 2) || (plan == 'enterprise' && !company) : false }}"
                      on: { click: { action: set_state, key: step, value: "{{ step + 1 }}" } }
                - type: if
                  props: { when: "{{ step == 4 }}" }
                  children:
                    - type: button
                      props: { label: Create account }
                      on:
                        click:
                          - action: call
                            name: signup
                            args: { name: "{{ name }}", email: "{{ email }}", role: "{{ role }}", plan: "{{ plan }}", seats: "{{ seats }}", company: "{{ company }}", newsletter: "{{ newsletter }}", notes: "{{ notes }}" }
                          - { action: set_state, key: done, value: true }

    # ---- Done
    - type: if
      props: { when: "{{ done }}" }
      children:
        - type: stack
          props: { align: center, gap: $space.sm }
          style: { padding: $space.lg 0, text-align: center }
          children:
            - { type: text, props: { value: "🎉" }, style: { font-size: 40 } }
            - { type: text, props: { tag: h2, value: "Welcome aboard, {{ name }}!" }, style: { margin: 0 } }
            - type: text
              props: { tag: p, value: "We've sent a confirmation to {{ email }}." }
              style: { margin: 0, color: $color.muted }
