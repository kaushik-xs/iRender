                - type: ui-menubar
                  children:
                    - type: ui-menubar-menu
                      props: { label: File }
                      children:
                        - { type: ui-menu-item, props: { label: New tab, shortcut: ⌘T }, on: { click: { action: set_state, key: lastAction, value: New tab } } }
                        - { type: ui-menu-item, props: { label: New window, shortcut: ⌘N }, on: { click: { action: set_state, key: lastAction, value: New window } } }
                        - { type: ui-menu-item, props: { label: New incognito window, disabled: true } }
                        - { type: ui-menu-separator }
                        - type: ui-menu-sub
                          props: { label: Share }
                          children:
                            - { type: ui-menu-item, props: { label: Email link }, on: { click: { action: set_state, key: lastAction, value: Email link } } }
                            - { type: ui-menu-item, props: { label: Messages }, on: { click: { action: set_state, key: lastAction, value: Messages } } }
                            - { type: ui-menu-item, props: { label: Notes }, on: { click: { action: set_state, key: lastAction, value: Notes } } }
                        - { type: ui-menu-separator }
                        - { type: ui-menu-item, props: { label: Print…, shortcut: ⌘P }, on: { click: { action: set_state, key: lastAction, value: Print } } }
                    - type: ui-menubar-menu
                      props: { label: Edit }
                      children:
                        - { type: ui-menu-item, props: { label: Undo, shortcut: ⌘Z }, on: { click: { action: set_state, key: lastAction, value: Undo } } }
                        - { type: ui-menu-item, props: { label: Redo, shortcut: ⇧⌘Z }, on: { click: { action: set_state, key: lastAction, value: Redo } } }
                        - { type: ui-menu-separator }
                        - type: ui-menu-sub
                          props: { label: Find }
                          children:
                            - { type: ui-menu-item, props: { label: Search the web }, on: { click: { action: set_state, key: lastAction, value: Search the web } } }
                            - { type: ui-menu-item, props: { label: Find… }, on: { click: { action: set_state, key: lastAction, value: Find } } }
                            - { type: ui-menu-item, props: { label: Find next }, on: { click: { action: set_state, key: lastAction, value: Find next } } }
                        - { type: ui-menu-separator }
                        - { type: ui-menu-item, props: { label: Cut }, on: { click: { action: set_state, key: lastAction, value: Cut } } }
                        - { type: ui-menu-item, props: { label: Copy }, on: { click: { action: set_state, key: lastAction, value: Copy } } }
                        - { type: ui-menu-item, props: { label: Paste }, on: { click: { action: set_state, key: lastAction, value: Paste } } }
                    - type: ui-menubar-menu
                      props: { label: View }
                      children:
                        - { type: ui-menu-checkbox, props: { label: Always show bookmarks bar, bind: bookmarks } }
                        - { type: ui-menu-checkbox, props: { label: Always show full URLs, bind: statusBar } }
                        - { type: ui-menu-separator }
                        - { type: ui-menu-label, props: { text: Zoom } }
                        - { type: ui-menu-radio-group, props: { bind: zoom, label: Zoom, options: [90%, 100%, 125%, 150%] } }
                    - type: ui-menubar-menu
                      props: { label: Profiles }
                      children:
                        - { type: ui-menu-radio-group, props: { bind: person, label: Profiles, options: [Andy, Benoit, Luis] } }
                        - { type: ui-menu-separator }
                        - { type: ui-menu-item, props: { label: Edit… }, on: { click: { action: set_state, key: lastAction, value: Edit profiles } } }
                - { type: ui-text, props: { variant: muted, text: "Last action: {{ lastAction }} · bookmarks bar {{ bookmarks ? 'on' : 'off' }} · full URLs {{ statusBar ? 'on' : 'off' }} · zoom {{ zoom }} · profile {{ person }}" } }
                - { type: if, props: { when: "{{ api.menubar.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.menubar }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- navigation-menu
            - type: element
              props: { tag: section }
              attrs: { id: navigation-menu, aria-labelledby: navigation-menu-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.navigation_menu }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: ui-navigation-menu
                  children:
                    - type: ui-navigation-item
                      props: { label: Getting started, width: 460 }
                      children:
                        - type: element
                          style: { display: grid, grid-template-columns: "1fr 1fr", gap: 4 }
                          children:
                            - { type: ui-navigation-link, props: { label: Introduction, href: "#overview", description: Components built from configuration. } }
                            - { type: ui-navigation-link, props: { label: Theming, href: "#theme", description: "Palettes, radius, density and dark mode." } }
                            - { type: ui-navigation-link, props: { label: Forms, href: "#form-controls", description: "Inputs, selects, checkboxes and fields." } }
                            - { type: ui-navigation-link, props: { label: Data table, href: "#data-table", description: "Sort, filter and page rows." } }
                    - type: ui-navigation-item
                      props: { label: Components, width: 300 }
                      children:
                        - { type: ui-navigation-link, props: { label: Dialog, href: "#dialog", description: A window over the page. } }
                        - { type: ui-navigation-link, props: { label: Date picker, href: "#date-picker", description: "Days, ranges, months and quarters." } }
                        - { type: ui-navigation-link, props: { label: Command palette, href: "#command", description: Search for actions. } }
                    - { type: ui-navigation-link, props: { label: Docs, href: "#overview", active: true } }
                    - { type: ui-navigation-link, props: { label: GitHub, href: "https://github.com/kaushik-xs/iRender" } }
                - { type: if, props: { when: "{{ api.navigation_menu.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.navigation_menu }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- breadcrumb
            - type: element
              props: { tag: section }
              attrs: { id: breadcrumb, aria-labelledby: breadcrumb-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.breadcrumb }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-breadcrumb
                      props:
                        items:
                          - { label: Home, href: "#" }
                          - { label: Components, href: "#" }
                          - { label: Breadcrumb }
                    - type: ui-pagination
                      props: { page: 5, pages: 12, href: "#page-{{ p }}" }

                - { type: if, props: { when: "{{ api.breadcrumb.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.breadcrumb }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- sidebar
            - type: element
              props: { tag: section }
              attrs: { id: sidebar, aria-labelledby: sidebar-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.sidebar }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                # A sidebar is a whole-page layout; here it's boxed in so it fits the gallery. See the
                # blocks for full pages.
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "The button in the header, or ⌘B / Ctrl+B, narrows it to its icons. On a phone it opens as a sheet." }
                    - type: ui-sidebar-layout
                      props: { bind: sidebar, collapsible: icon }
                      style: { min-height: 0, height: 440, overflow: hidden, border: 1px solid $color.border, border-radius: $radius.lg }
                      children:
                        - type: ui-sidebar
                          style: { height: 100% }
                          children:
                            - type: ui-sidebar-header
                              children:
                                - type: ui-sidebar-group
                                  style: { padding: 0 }
                                  children:
                                    - type: ui-sidebar-item
                                      props: { label: Acme Inc, icon: "◆", badge: Enterprise }
                                      children:
                                        - { type: ui-sidebar-item, props: { label: Acme Inc, active: true } }
                                        - { type: ui-sidebar-item, props: { label: Acme Corp. } }
                            - type: ui-sidebar-content
                              children:
                                - type: ui-sidebar-group
                                  props: { label: Platform }
                                  children:
                                    - { type: ui-sidebar-item, props: { label: Dashboard, icon: "⌂", href: "#", active: true } }
                                    - { type: ui-sidebar-item, props: { label: Inbox, icon: "✉", href: "#", badge: 12 } }
                                    - type: ui-sidebar-item
                                      props: { label: Documentation, icon: "☰", open: true }
                                      children:
                                        - { type: ui-sidebar-item, props: { label: Introduction, href: "#" } }
                                        - { type: ui-sidebar-item, props: { label: Get Started, href: "#" } }
                                        - { type: ui-sidebar-item, props: { label: Changelog, href: "#" } }
                                    - { type: ui-sidebar-item, props: { label: Settings, icon: "⚙", href: "#" } }
                            - type: ui-sidebar-footer
                              children:
                                - type: ui-sidebar-group
                                  style: { padding: 0 }
                                  children:
                                    - { type: ui-sidebar-item, props: { label: shadcn, icon: "☺", badge: m@example.com, href: "#" } }
                        - type: element
                          props: { tag: header }
                          style: { display: flex, align-items: center, gap: 8, height: 56, flex-shrink: 0, padding: 0 16px }
                          children:
                            - { type: ui-sidebar-trigger }
                            - { type: ui-separator, props: { orientation: vertical }, style: { height: 16, align-self: center, margin-right: 8 } }
                            - type: ui-breadcrumb
                              props: { items: [{ label: Platform, href: "#" }, { label: Dashboard }] }
                        - type: element
                          style: { display: flex, flex-direction: column, gap: 16, flex: 1, padding: 0 16px 16px }
                          children:
                            - type: element
                              style: { display: grid, grid-template-columns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 16 }
                              children:
                                - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                                - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                                - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                            - { type: element, style: { flex: 1, border-radius: 12, background: $color.subtle } }

                - { type: if, props: { when: "{{ api.sidebar.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.sidebar }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- chat
            - type: element
              props: { tag: section }
              attrs: { id: chat, aria-labelledby: chat-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.chat }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                # The input appends to `chat` and streams the reply from api/chat, which
                # examples/serve.py answers; a plain static server can't, so the reply fails there.
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "A conversation that keeps to its latest message, bubbles with threaded replies, and an input that streams the reply in. Enter sends; Shift+Enter starts a new line." }
                    - type: ui-card
                      style: { padding: 0, gap: 0, overflow: hidden }
                      children:
                        - type: ui-conversation
                          props: { messages: "{{ chat }}", typing: "{{ chatWaiting }}", assistant: { name: Assistant, initials: AI }, height: 380, empty: "Ask anything to start." }
                        - type: element
                          style: { padding: 12, border-top: 1px solid $color.border }
                          children:
                            - type: ui-chat-input
                              props:
                                messages: chat
                                bind: chatDraft
                                waiting: chatWaiting
                                endpoint: api/chat
                                placeholder: Ask about the report…
                                suggestions: [What drove the growth?, Compare with last year]
                              children:
                                - { type: ui-button, props: { label: "+", variant: ghost, size: icon }, attrs: { aria-label: Attach } }
                    - type: stack
                      props: { direction: row, gap: 8, align: center }
                      children:
                        - { type: ui-button, props: { label: New chat, variant: outline, size: sm }, on: { click: { action: set_state, key: chat, value: [] } } }
                        - { type: ui-separator, props: { orientation: vertical }, style: { height: 16, margin: 0 8px } }
                        - { type: ui-typing-indicator }
                        - { type: ui-text, props: { variant: muted, text: "ui-typing-indicator on its own" } }

                - { type: ui-label, props: { text: A message written in the document } }
                - type: ui-message
                  props: { role: assistant, name: Assistant, initials: AI, time: "9:42", content: "Here's the summary you asked for." }
                - { type: if, props: { when: "{{ api.chat.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.chat }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- carousel
            - type: element
              props: { tag: section }
              attrs: { id: carousel, aria-labelledby: carousel-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.carousel }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: ui-carousel
                  props: { label: Plans, size: 240 }
                  children:
                    - { type: ui-card, props: { title: Starter, description: For side projects. }, children: [ { type: ui-heading, props: { level: 3, text: Free } } ] }
                    - { type: ui-card, props: { title: Pro, description: For growing teams. }, children: [ { type: ui-heading, props: { level: 3, text: $12 / month } } ] }
                    - { type: ui-card, props: { title: Team, description: For organisations. }, children: [ { type: ui-heading, props: { level: 3, text: $40 / month } } ] }
                    - { type: ui-card, props: { title: Enterprise, description: Talk to us. }, children: [ { type: ui-heading, props: { level: 3, text: Custom } } ] }
                - { type: if, props: { when: "{{ api.carousel.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.carousel }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            - { type: ui-toaster, props: { bind: toast } }

