                    - { type: ui-tab-panel, props: { value: alerts, label: Alerts }, children: [ { type: ui-text, props: { text: What you're told about. } } ] }
                    - { type: ui-tab-panel, props: { value: billing, label: Billing }, children: [ { type: ui-text, props: { text: Plans and invoices. } } ] }
