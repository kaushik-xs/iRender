                        - { type: ui-tab-panel, props: { value: march, label: March }, children: [ { type: ui-text, props: { variant: muted, text: "March's figures." } } ] }
                        - { type: ui-tab-panel, props: { value: april, label: April }, children: [ { type: ui-text, props: { variant: muted, text: "April's figures." } } ] }
                        - { type: ui-tab-panel, props: { value: may, label: May }, children: [ { type: ui-text, props: { variant: muted, text: "May's figures." } } ] }
