# Every irender-ui-kit component, in its variants.
#
#   cargo run -p irender-cli -- render examples/ui-kit/gallery.yaml --ui-kit -o gallery.html
#
# The combobox's "Load as you type" example fetches api/fruits.json, so serve the page over
# HTTP next to examples/ui-kit/api (examples/build.sh does this).
version: 1
state:
  progress: 40
  email: ""
  bio: ""
  framework: ""
  terms: false
  notifications: true
  airplane: false
  plan: pro
  saved: 0
  profile: Pedro Duarte
  tab: account
  bold: false
  italic: true
  align: left
  volume: 40
  toast: null
  projects: 3
  colour: ocean
  flavours: [chocolate, vanilla]
  tags: [rust]
  grouped: null
  fruit: null
  fruits: []
  city: null
  cities: [Mumbai, Pune, Bengaluru]
  size: m
  locked: false
  busy: false
  team: [kaushik, asha]
  username: ""
  site: ""
  amount: ""
  marketing: false
  view: grid
  marks: [underline]
  chat:
    - { id: 1, role: system, content: "Today" }
    - { id: 2, role: user, name: You, initials: KS, time: "9:41", content: "Can you summarise the Q3 report?" }
    - id: 3
      role: assistant
      name: Assistant
      initials: AI
      time: "9:41"
      content: "Revenue grew 12% on Q2, led by the Asia region.\nCosts were flat, so margins improved by two points."
      replies:
        - { id: 31, role: user, name: Asha, initials: AS, content: "Does that include the one-off licence deal?" }
        - { id: 32, role: assistant, name: Assistant, initials: AI, content: "No, that's booked in Q4." }
  chatDraft: ""
  chatWaiting: false
  sidebar: true
root:
  type: stack
  props: { gap: 40 }
  style:
    max-width: 920px
    margin: 0 auto
    padding: 40px 24px 80px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 8 }
      children:
        # The Theme button picks a palette, radius, density, text size, font, chart
        # colours and the mode; the choices are shared with every example page.
        - type: stack
          props: { direction: row, justify: space-between, align: center, gap: 16, wrap: true }
          children:
            - { type: ui-heading, props: { level: 1, text: irender-ui-kit } }
            - { type: ui-popover, props: { trigger: Theme, align: end }, style: { width: 340 }, children: [ { type: ui-theme-panel } ] }
        - type: ui-text
          props: { variant: lead, text: "Ready-made components for iRender documents. Every one is plain config: no JavaScript beyond the runtime." }

    # ---------------------------------------------------------------- buttons
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Button } }
        - type: stack
          props: { direction: row, gap: 8, wrap: true, align: center }
          children:
            - { type: ui-button, props: { label: Default } }
            - { type: ui-button, props: { label: Secondary, variant: secondary } }
            - { type: ui-button, props: { label: Destructive, variant: destructive } }
            - { type: ui-button, props: { label: Outline, variant: outline } }
            - { type: ui-button, props: { label: Ghost, variant: ghost } }
            - { type: ui-button, props: { label: Link, variant: link } }
            # The second brand colour: Theme > Custom colours > Second colour.
            - { type: ui-button, props: { label: Brand, variant: brand } }
        - type: stack
          props: { direction: row, gap: 8, wrap: true, align: center }
          children:
            - { type: ui-button, props: { label: Small, size: sm, variant: outline } }
            - { type: ui-button, props: { label: Default size, variant: outline } }
            - { type: ui-button, props: { label: Large, size: lg, variant: outline } }
            - { type: ui-button, props: { label: "+", size: icon, variant: outline }, attrs: { aria-label: Add } }
            - { type: ui-button, props: { label: Disabled, disabled: true } }
            - { type: ui-button, props: { label: "Link that looks like a button", href: "#button", variant: secondary } }
            - type: ui-button
              props: { label: "Saved {{ saved }} times" }
              on: { click: { action: set_state, key: saved, value: "{{ saved + 1 }}" } }

    # ---------------------------------------------------------------- badges, kbd
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Badge and Kbd } }
        - type: stack
          props: { direction: row, gap: 8, wrap: true, align: center }
          children:
            - { type: ui-badge, props: { text: Default } }
            - { type: ui-badge, props: { text: Secondary, variant: secondary } }
            - { type: ui-badge, props: { text: Destructive, variant: destructive } }
            - { type: ui-badge, props: { text: Outline, variant: outline } }
            - { type: ui-badge, props: { text: Brand, variant: brand } }
            - { type: ui-separator, props: { orientation: vertical }, style: { height: 20 } }
            - { type: ui-text, props: { variant: muted, text: "Press" } }
            - { type: ui-kbd, props: { text: "⌘K" } }
            - { type: ui-text, props: { variant: muted, text: "to search" } }

    # ---------------------------------------------------------------- cards
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Card } }
        - type: element
          style: { display: grid, gap: 16, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))" }
          children:
            - type: ui-card
              props: { title: Create project, description: Deploy your new project in one click. }
              children:
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Name, for: project-name } }
                    - { type: ui-input, props: { placeholder: Name of your project }, attrs: { id: project-name } }
                - type: ui-card-footer
                  children:
                    - { type: ui-button, props: { label: Cancel, variant: outline } }
                    - { type: ui-button, props: { label: Deploy } }
            - type: ui-card
              props: { title: Team members, description: Invite people to work with you. }
              children:
                - type: list
                  props:
                    items:
                      - { name: Sofia Davis, email: sofia@example.com, initials: SD, role: Owner }
                      - { name: Jackson Lee, email: jackson@example.com, initials: JL, role: Member }
                    as: m
                  style: { display: grid, gap: 12 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 12, align: center }
                      children:
                        - { type: ui-avatar, props: { fallback: "{{ m.initials }}" } }
                        - type: stack
                          props: { gap: 2 }
                          style: { flex: 1 }
                          children:
                            - { type: ui-text, props: { variant: small, text: "{{ m.name }}" } }
                            - { type: ui-text, props: { variant: muted, text: "{{ m.email }}" } }
                        - { type: ui-badge, props: { text: "{{ m.role }}", variant: outline } }

    # ---------------------------------------------------------------- alerts
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Alert } }
        - type: ui-alert
          props: { icon: "ℹ", title: Heads up!, description: You can add components to your app using the CLI. }
        - type: ui-alert
          props: { variant: destructive, icon: "⚠", title: Error, description: Your session has expired. Please log in again. }

    # ---------------------------------------------------------------- form
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Form controls } }
        - type: element
          style: { display: grid, gap: 24, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))", align-items: start }
          children:
            - type: stack
              props: { gap: 16 }
              children:
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Email, for: email } }
                    - { type: ui-input, props: { bind: email, type: email, placeholder: you@example.com }, attrs: { id: email } }
                    - type: ui-text
                      props: { variant: muted, text: "{{ email ? 'We will write to ' + email : 'We never share it.' }}" }
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Framework, for: framework } }
                    - type: ui-select
                      props:
                        bind: framework
                        placeholder: Select a framework
                        options:
                          - { value: axum, label: Axum }
                          - { value: actix, label: Actix Web }
                          - { value: rocket, label: Rocket }
                      attrs: { id: framework }
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Bio, for: bio } }
                    - { type: ui-textarea, props: { bind: bio, placeholder: Tell us a little about yourself }, attrs: { id: bio } }
                    - type: ui-text
                      props: { variant: muted, text: "{{ bio.length }} / 160 characters" }
                      style: { color: "{{ bio.length > 160 ? 'var(--color-destructive)' : 'inherit' }}" }
            - type: stack
              props: { gap: 16 }
              children:
                - { type: ui-checkbox, props: { bind: terms, label: Accept terms and conditions } }
                - { type: ui-checkbox, props: { label: Disabled checkbox, disabled: true, checked: true } }
                - { type: ui-switch, props: { bind: notifications, label: Email notifications } }
                - { type: ui-switch, props: { bind: airplane, label: "Airplane mode {{ airplane ? 'on' : 'off' }}" } }
                - { type: ui-separator }
                - { type: ui-label, props: { text: Plan } }
                - type: ui-radio-group
                  props:
                    bind: plan
                    options:
                      - { value: free, label: Free }
                      - { value: pro, label: Pro }
                      - { value: team, label: Team (coming soon), disabled: true }
                - { type: ui-text, props: { variant: muted, text: "Chosen: {{ plan }}" } }
                - type: ui-button
                  props: { label: Continue, disabled: "{{ !terms }}" }
                  style: { align-self: flex-start }

    # ---------------------------------------------------------------- field, input group, button group
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Field, Input group and Button group" } }
        - type: element
          style: { display: grid, gap: 24, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))" }
          children:
            - type: stack
              props: { gap: 20 }
              children:
                - type: ui-field
                  props:
                    label: Username
                    for: username
                    description: Letters and numbers; at least 3.
                    error: "{{ username != '' && username.length < 3 ? 'Too short: at least 3 characters.' : '' }}"
                  children:
                    - type: ui-input
                      props: { bind: username, placeholder: pedro }
                      attrs: { id: username, aria-invalid: "{{ username != '' && username.length < 3 }}" }
                - type: ui-field
                  props: { label: Marketing emails, for: marketing, description: About new features and offers., orientation: horizontal }
                  children:
                    - { type: ui-switch, props: { bind: marketing }, parts: { control: { attrs: { id: marketing } } } }
            - type: stack
              props: { gap: 20 }
              children:
                - type: ui-field
                  props: { label: Website, for: site }
                  children:
                    - type: ui-input-group
                      props: { prefix: "https://", suffix: .com }
                      children:
                        - { type: ui-input, props: { bind: site, placeholder: example }, attrs: { id: site } }
                - type: ui-field
                  props: { label: Amount, for: amount }
                  children:
                    - type: ui-input-group
                      props: { prefix: "$" }
                      children:
                        - { type: ui-input, props: { bind: amount, placeholder: "0.00" }, attrs: { id: amount, inputmode: decimal } }
                        - type: ui-button
                          props: { label: Clear, variant: ghost, size: sm }
                          on: { click: { action: set_state, key: amount, value: "" } }
        - type: stack
          props: { direction: row, gap: 12, align: center, wrap: true }
          children:
            - type: ui-button-group
              props: { label: View }
              children:
                - type: ui-button
                  props: { label: Grid, variant: "{{ view == 'grid' ? 'secondary' : 'outline' }}" }
                  attrs: { aria-pressed: "{{ view == 'grid' }}" }
                  on: { click: { action: set_state, key: view, value: grid } }
                - type: ui-button
                  props: { label: List, variant: "{{ view == 'list' ? 'secondary' : 'outline' }}" }
                  attrs: { aria-pressed: "{{ view == 'list' }}" }
                  on: { click: { action: set_state, key: view, value: list } }
            - type: ui-button-group
              props: { label: Pages }
              children:
                - { type: ui-button, props: { label: "‹ Previous", variant: outline, size: sm } }
                - { type: ui-button, props: { label: "Next ›", variant: outline, size: sm } }
            - type: ui-button-group
              props: { orientation: vertical, label: Zoom }
              children:
                - { type: ui-button, props: { label: "+", variant: outline, size: icon } }
                - { type: ui-button, props: { label: "−", variant: outline, size: icon } }

    # ---------------------------------------------------------------- split button
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Split button } }
        - type: ui-text
          props: { variant: muted, text: "A primary action, with the others one click away. The arrow opens a menu: ↑ ↓ to move, Enter to choose, Esc to close." }
        - type: stack
          props: { direction: row, gap: 12, wrap: true, align: center }
          children:
            - type: ui-split-button
              props: { label: Download PDF, variant: outline, menuLabel: More download formats }
              on: { click: { action: set_state, key: toast, value: { title: "Downloading report.pdf", description: "Your PDF is on its way." } } }
              children:
                - type: ui-menu-item
                  props: { label: Download Excel }
                  on: { click: { action: set_state, key: toast, value: { title: "Downloading report.xlsx", description: "Your spreadsheet is on its way." } } }
                - type: ui-menu-item
                  props: { label: Download CSV }
                  on: { click: { action: set_state, key: toast, value: { title: "Downloading report.csv", description: "Your CSV is on its way." } } }
                - { type: ui-menu-separator }
                - type: ui-menu-item
                  props: { label: Email the report }
                  on: { click: { action: set_state, key: toast, value: { title: "Report emailed", description: "Sent to your inbox." } } }
            - type: ui-split-button
              props: { label: Publish, menuLabel: More publishing options }
              on: { click: { action: set_state, key: toast, value: { title: "Published", description: "The page is live." } } }
              children:
                - type: ui-menu-item
                  props: { label: Schedule… }
                  on: { click: { action: set_state, key: toast, value: { title: "Scheduled", description: "It goes live tomorrow at 9:00." } } }
                - type: ui-menu-item
                  props: { label: Publish to staging }
                  on: { click: { action: set_state, key: toast, value: { title: "Published to staging", description: "Check it before it goes live." } } }
                - { type: ui-menu-separator }
                - type: ui-menu-item
                  props: { label: Unpublish, variant: destructive }
                  on: { click: { action: set_state, key: toast, value: { title: "Unpublished", description: "The page is offline." } } }
            - type: ui-split-button
              props: { label: Save draft, variant: secondary, size: sm, menuLabel: More save options }
              on: { click: { action: set_state, key: toast, value: { title: "Draft saved", description: "" } } }
              children:
                - { type: ui-menu-label, props: { text: Save as } }
                - type: ui-menu-item
                  props: { label: Template }
                  on: { click: { action: set_state, key: toast, value: { title: "Saved as a template", description: "" } } }
                - type: ui-menu-item
                  props: { label: Copy }
                  on: { click: { action: set_state, key: toast, value: { title: "Saved a copy", description: "" } } }

    # ---------------------------------------------------------------- combobox
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-heading, props: { level: 2, text: Combobox } }
        - type: ui-text
          props: { variant: muted, text: "A searchable select in the style of react-select. Keyboard: ↑ ↓ to move, Enter or Tab to choose, Esc to close, Backspace to remove the last value." }

    # ---------------------------------------------------------------- single
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: "Single, searchable and clearable" } }
        - type: ui-combobox
          props:
            bind: colour
            clearable: true
            label: Colour
            options:
              - { value: ocean, label: Ocean }
              - { value: blue, label: Blue }
              - { value: purple, label: Purple, disabled: true }
              - { value: red, label: Red }
              - { value: orange, label: Orange }
              - { value: yellow, label: Yellow }
              - { value: green, label: Green }
              - { value: forest, label: Forest }
              - { value: slate, label: Slate }
              - { value: silver, label: Silver }
        - { type: ui-text, props: { variant: muted, text: "colour = {{ colour }}" } }

    # ---------------------------------------------------------------- multi
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: "Multi, with a fixed value" } }
        - type: ui-combobox
          props:
            bind: flavours
            multiple: true
            clearable: true
            fixed: [chocolate]
            label: Flavours
            options:
              - { value: chocolate, label: Chocolate }
              - { value: strawberry, label: Strawberry }
              - { value: vanilla, label: Vanilla }
              - { value: salted-caramel, label: Salted caramel }
              - { value: pistachio, label: Pistachio }
              - { value: mango, label: Mango }
        - { type: ui-text, props: { variant: muted, text: "flavours = {{ flavours }} (Chocolate can't be removed)" } }

    # ---------------------------------------------------------------- groups
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: Grouped options with descriptions } }
        - type: ui-combobox
          props:
            bind: grouped
            clearable: true
            label: Grouped
            placeholder: Pick a colour or a flavour…
            options:
              - label: Colours
                options:
                  - { value: ocean, label: Ocean, description: "#00B8D9" }
                  - { value: red, label: Red, description: "#FF5630" }
                  - { value: green, label: Green, description: "#36B37E" }
              - label: Flavours
                options:
                  - { value: vanilla, label: Vanilla, description: Creamy and classic }
                  - { value: chocolate, label: Chocolate, description: Rich cocoa }
                  - { value: mango, label: Mango, description: Seasonal, disabled: true }
        - { type: ui-text, props: { variant: muted, text: "grouped = {{ grouped }}" } }

    # ---------------------------------------------------------------- async
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: Load as you type } }
        - type: ui-combobox
          props:
            bind: fruits
            multiple: true
            searchUrl: api/fruits.json
            debounce: 300
            label: Fruits
            placeholder: Type to search fruits…
            noOptionsText: Type to search
        - { type: ui-text, props: { variant: muted, text: "Each pause in typing asks api/fruits.json?q=…; answers are cached. fruits = {{ fruits }}" } }

    # ---------------------------------------------------------------- creatable
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: "Creatable: type a new tag and press Enter" } }
        - type: ui-combobox
          props:
            bind: tags
            multiple: true
            creatable: true
            clearable: true
            label: Tags
            options: [rust, javascript, python, go, kotlin, swift]
        - { type: ui-text, props: { variant: muted, text: "tags = {{ tags }}" } }

    # ---------------------------------------------------------------- options from state
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: Options from state } }
        - type: stack
          props: { direction: row, gap: 8 }
          children:
            - type: ui-button
              props: { label: Indian cities, variant: outline, size: sm }
              on: { click: [{ action: set_state, key: cities, value: [Mumbai, Pune, Bengaluru, Chennai] }, { action: set_state, key: city, value: null }] }
            - type: ui-button
              props: { label: German cities, variant: outline, size: sm }
              on: { click: [{ action: set_state, key: cities, value: [Berlin, Munich, Hamburg] }, { action: set_state, key: city, value: null }] }
        - { type: ui-combobox, props: { bind: city, options: "{{ cities }}", clearable: true, label: City, placeholder: Choose a city… } }
        - { type: ui-text, props: { variant: muted, text: "city = {{ city }}" } }

    # ---------------------------------------------------------------- states
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: "Not searchable, disabled and loading" } }
        - type: ui-combobox
          props:
            bind: size
            searchable: false
            disabled: "{{ locked }}"
            loading: "{{ busy }}"
            label: Size
            options: [{ value: s, label: Small }, { value: m, label: Medium }, { value: l, label: Large }]
        - type: stack
          props: { direction: row, gap: 16 }
          children:
            - { type: ui-switch, props: { bind: locked, label: Disabled } }
            - { type: ui-switch, props: { bind: busy, label: Loading } }

    # ---------------------------------------------------------------- forms
    - type: stack
      props: { gap: 8 }
      children:
        - { type: ui-label, props: { text: In a form } }
        - type: element
          props: { tag: form }
          attrs: { action: "#", id: team-form }
          style: { display: grid, gap: 8 }
          children:
            - type: ui-combobox
              props:
                bind: team
                multiple: true
                name: member
                label: Team
                options: [{ value: kaushik, label: Kaushik }, { value: asha, label: Asha }, { value: ravi, label: Ravi }, { value: lena, label: Lena }]
            - { type: ui-text, props: { variant: muted, text: "Submitting sends one member=… field per chosen person." } }

    # ---------------------------------------------------------------- dialogs
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Dialog, Alert dialog and Sheet" } }
        - type: stack
          props: { direction: row, gap: 8, wrap: true }
          children:
            - type: ui-dialog
              props: { trigger: Edit profile, title: Edit profile, description: "Make changes to your profile here. Click save when you're done.", id: edit-profile }
              children:
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Name, for: profile-name } }
                    - { type: ui-input, props: { bind: profile }, attrs: { id: profile-name } }
                - type: ui-dialog-footer
                  children:
                    - { type: ui-dialog-close, props: { label: Cancel, variant: outline } }
                    - type: ui-dialog-close
                      props: { label: Save changes }
                      on:
                        click:
                          - { action: set_state, key: toast, value: { title: Profile saved } }
            - type: ui-alert-dialog
              props:
                trigger: "Delete {{ projects }} projects"
                triggerVariant: destructive
                title: Are you absolutely sure?
                description: This permanently deletes your projects. It cannot be undone.
                id: confirm-delete
              children:
                - type: ui-dialog-footer
                  children:
                    - { type: ui-dialog-close, props: { label: Cancel, variant: outline } }
                    - type: ui-dialog-close
                      props: { label: "Yes, delete", variant: destructive }
                      on:
                        click:
                          - { action: set_state, key: projects, value: 0 }
                          - { action: set_state, key: toast, value: { title: Projects deleted, description: Nothing is left to delete., variant: destructive } }
            - type: ui-sheet
              props: { trigger: Open sheet, title: Settings, description: A panel along the right edge., id: settings-sheet }
              children:
                - { type: ui-switch, props: { bind: notifications, label: Email notifications } }
                - { type: ui-switch, props: { bind: airplane, label: Airplane mode } }
                - type: ui-dialog-footer
                  children:
                    - { type: ui-dialog-close, props: { label: Done } }

    # ---------------------------------------------------------------- popovers
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Popover, Dropdown menu, Tooltip and Hover card" } }
        - type: stack
          props: { direction: row, gap: 12, wrap: true, align: center }
          children:
            - type: ui-popover
              props: { trigger: Dimensions, id: dimensions }
              children:
                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-text, props: { variant: small, text: Dimensions } }
                    - { type: ui-text, props: { variant: muted, text: Set the dimensions for the layer. } }
                    - { type: ui-input, props: { value: 100% }, attrs: { aria-label: Width } }
            - type: ui-dropdown-menu
              props: { trigger: My account, id: account-menu }
              children:
                - { type: ui-menu-label, props: { text: My account } }
                - type: ui-menu-item
                  props: { label: Profile, shortcut: "⇧⌘P" }
                  on: { click: { action: call, name: menu, args: { item: profile } } }
                - { type: ui-menu-item, props: { label: Billing, shortcut: "⌘B" } }
                - { type: ui-menu-item, props: { label: Docs, href: "#docs" } }
                - { type: ui-menu-separator }
                - { type: ui-menu-item, props: { label: Log out, variant: destructive } }
            - type: ui-tooltip
              props: { text: Add to library }
              children:
                - { type: ui-button, props: { label: Hover me, variant: outline } }
            - type: ui-tooltip
              props: { text: Shown below, side: bottom }
              children:
                - { type: ui-button, props: { label: And me, variant: ghost } }
            - type: ui-hover-card
              props: { trigger: "@irender", href: "#hover" }
              children:
                - type: stack
                  props: { direction: row, gap: 12 }
                  children:
                    - { type: ui-avatar, props: { fallback: iR } }
                    - type: stack
                      props: { gap: 4 }
                      children:
                        - { type: ui-text, props: { variant: small, text: "@irender" } }
                        - { type: ui-text, props: { variant: muted, text: "UI from configuration, rendered in Rust." } }

    # ---------------------------------------------------------------- command palette
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Command } }
        - type: stack
          props: { direction: row, gap: 24, wrap: true, align: start }
          children:
            - type: ui-command
              props: { id: command }
              style: { max-width: 420 }
              children:
                - type: ui-command-group
                  props: { heading: Suggestions }
                  children:
                    - type: ui-command-item
                      props: { label: Calendar, icon: "📅" }
                      on: { click: { action: set_state, key: toast, value: { title: Calendar, description: Opened the calendar. } } }
                    - type: ui-command-item
                      props: { label: Search emoji, icon: "😀", keywords: [smiley, face] }
                      on: { click: { action: set_state, key: toast, value: { title: Emoji, description: Pick one. } } }
                    - { type: ui-command-item, props: { label: Calculator, icon: "🧮", disabled: true } }
                - { type: ui-command-separator }
                - type: ui-command-group
                  props: { heading: Settings }
                  children:
                    - type: ui-command-item
                      props: { label: Profile, icon: "👤", shortcut: "⌘P" }
                      on: { click: { action: set_state, key: toast, value: { title: Profile } } }
                    - { type: ui-command-item, props: { label: Billing, icon: "💳", shortcut: "⌘B", href: "#billing" } }
                    - type: ui-command-item
                      props: { label: Settings, icon: "⚙️", shortcut: "⌘S", keywords: preferences }
                      on: { click: { action: set_state, key: toast, value: { title: Settings } } }
            - type: stack
              props: { gap: 8 }
              children:
                - { type: ui-text, props: { variant: muted, text: "Press ⌘K (Ctrl+K) or the button." } }
                - type: ui-command-dialog
                  props: { trigger: Open command palette, shortcut: mod+k, id: command-dialog }
                  children:
                    - type: ui-command-group
                      props: { heading: Projects }
                      children:
                        - type: ui-command-item
                          props: { label: New project, shortcut: "⌘N" }
                          on: { click: { action: set_state, key: projects, value: "{{ projects + 1 }}" } }
                        - type: ui-command-item
                          props: { label: Delete all projects, keywords: [remove, clear] }
                          on: { click: { action: set_state, key: projects, value: 0 } }
                    - { type: ui-command-separator }
                    - type: ui-command-group
                      props: { heading: Theme }
                      children:
                        - type: ui-command-item
                          props: { label: Toggle bold, keywords: [format] }
                          on: { click: { action: set_state, key: bold, value: "{{ !bold }}" } }

    # ---------------------------------------------------------------- tabs, accordion
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Tabs, Accordion and Collapsible" } }
        - type: ui-tabs
          props: { bind: tab, id: settings-tabs }
          style: { max-width: 420 }
          children:
            - type: ui-tab-panel
              props: { value: account, label: Account }
              children:
                - type: ui-card
                  props: { title: Account, description: "Make changes to your account here." }
                  children:
                    - { type: ui-input, props: { bind: profile }, attrs: { aria-label: Name } }
            - type: ui-tab-panel
              props: { value: password, label: Password }
              children:
                - type: ui-card
                  props: { title: Password, description: "Change your password here." }
                  children:
                    - { type: ui-input, props: { type: password, placeholder: New password }, attrs: { aria-label: New password } }
        - type: ui-accordion
          props: { id: faq }
          style: { max-width: 560 }
          children:
            - type: ui-accordion-item
              props: { title: Is it accessible?, open: true }
              children:
                - { type: text, props: { value: "Yes. It uses native <details> elements, so it works with a keyboard and screen readers." } }
            - type: ui-accordion-item
              props: { title: Does it need JavaScript? }
              children:
                - { type: text, props: { value: "No. Only one item opens at a time thanks to the details element's name attribute." } }
            - type: ui-accordion-item
              props: { title: Can several be open? }
              children:
                - { type: text, props: { value: "Set multiple: true on the accordion." } }
        - type: ui-collapsible
          props: { trigger: "@peduarte starred 3 repositories" }
          style: { max-width: 360 }
          children:
            - type: stack
              props: { gap: 6 }
              children:
                - { type: ui-text, props: { variant: code, text: "@radix-ui/primitives" } }
                - { type: ui-text, props: { variant: code, text: "@radix-ui/colors" } }
                - { type: ui-text, props: { variant: code, text: "@stitches/react" } }

    # ---------------------------------------------------------------- toggles, slider
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Toggle, Toggle group and Slider" } }
        - type: stack
          props: { direction: row, gap: 12, wrap: true, align: center }
          children:
            - { type: ui-toggle, props: { bind: bold, label: B }, attrs: { aria-label: Bold }, style: { font-weight: 700 } }
            - { type: ui-toggle, props: { bind: italic, label: I, variant: outline }, attrs: { aria-label: Italic }, style: { font-style: italic } }
            - { type: ui-separator, props: { orientation: vertical }, style: { height: 24 } }
            - type: ui-toggle-group
              props:
                bind: align
                variant: outline
                options:
                  - { value: left, label: Left }
                  - { value: center, label: Center }
                  - { value: right, label: Right }
            - { type: ui-separator, props: { orientation: vertical }, style: { height: 24 } }
            - type: ui-toggle-group
              props:
                bind: marks
                multiple: true
                variant: outline
                options:
                  - { value: underline, label: Underline }
                  - { value: strike, label: Strike }
        - type: ui-text
          props: { text: "Preview text" }
          style:
            font-weight: "{{ bold ? 700 : 400 }}"
            font-style: "{{ italic ? 'italic' : 'normal' }}"
            text-align: "{{ align || 'left' }}"
            text-decoration-line: "{{ (includes(marks, 'underline') ? 'underline ' : '') + (includes(marks, 'strike') ? 'line-through' : '') || 'none' }}"
            max-width: 420
        - type: stack
          props: { direction: row, gap: 12, align: center }
          style: { max-width: 420 }
          children:
            - { type: ui-slider, props: { bind: volume }, attrs: { aria-label: Volume } }
            - { type: ui-text, props: { variant: muted, text: "{{ volume }}%" }, style: { min-width: 40 } }
        - type: ui-progress
          props: { value: "{{ volume }}" }
          style: { max-width: 420 }

    - { type: ui-toaster, props: { bind: toast } }

    # ---------------------------------------------------------------- progress, skeleton
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Progress and Skeleton } }
        - type: ui-progress
          props: { value: "{{ progress }}" }
        - type: stack
          props: { direction: row, gap: 8, align: center }
          children:
            - type: ui-button
              props: { label: "−10", variant: outline, size: sm }
              on: { click: { action: set_state, key: progress, value: "{{ progress <= 10 ? 0 : progress - 10 }}" } }
            - type: ui-button
              props: { label: "+10", variant: outline, size: sm }
              on: { click: { action: set_state, key: progress, value: "{{ progress >= 90 ? 100 : progress + 10 }}" } }
            - { type: ui-text, props: { variant: muted, text: "{{ progress }}%" } }
        - type: stack
          props: { direction: row, gap: 12, align: center }
          children:
            - { type: ui-skeleton, props: { width: 48, height: 48, round: true } }
            - type: stack
              props: { gap: 8 }
              style: { flex: 1 }
              children:
                - { type: ui-skeleton, props: { width: 60%, height: 14 } }
                - { type: ui-skeleton, props: { width: 40%, height: 14 } }

    # ---------------------------------------------------------------- spinner, empty, scroll area
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: "Spinner, Empty and Scroll area" } }
        - type: stack
          props: { direction: row, gap: 16, align: center }
          children:
            - { type: ui-spinner }
            - { type: ui-spinner, props: { size: 24 } }
            - { type: ui-spinner, props: { size: 32 }, style: { color: $color.muted } }
            - type: ui-button
              props: { disabled: true }
              children:
                - { type: ui-spinner, props: { label: Saving } }
                - { type: text, props: { value: Saving… } }
        - type: element
          style: { display: grid, gap: 16, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))" }
          children:
            - type: ui-empty
              props: { icon: "📁", title: No projects yet, description: "You haven't created any projects. Start by creating your first one." }
              children:
                - type: stack
                  props: { direction: row, gap: 8 }
                  children:
                    - { type: ui-button, props: { label: Create project } }
                    - { type: ui-button, props: { label: Import, variant: outline } }
            - type: ui-scroll-area
              props: { height: 220, label: Tags }
              style: { border: 1px solid $color.border }
              children:
                - type: list
                  props:
                    items: [v1.2.0-beta.50, v1.2.0-beta.49, v1.2.0-beta.48, v1.2.0-beta.47, v1.2.0-beta.46, v1.2.0-beta.45, v1.2.0-beta.44, v1.2.0-beta.43, v1.2.0-beta.42, v1.2.0-beta.41, v1.2.0-beta.40, v1.2.0-beta.39]
                    as: tag
                  style: { padding: 4px 16px }
                  children:
                    - { type: element, props: { tag: div }, style: { padding: 8px 0, font-size: 14px, border-bottom: 1px solid $color.border }, children: [ { type: text, props: { value: "{{ tag }}" } } ] }

    # ---------------------------------------------------------------- table
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Table } }
        - type: ui-table
          props: { caption: A list of your recent invoices. }
          children:
            - type: element
              props: { tag: thead }
              children:
                - type: element
                  props: { tag: tr }
                  children:
                    - { type: text, props: { tag: th, value: Invoice } }
                    - { type: text, props: { tag: th, value: Status } }
                    - { type: text, props: { tag: th, value: Method } }
                    - { type: text, props: { tag: th, value: Amount }, style: { text-align: right } }
            - type: list
              props:
                tag: tbody
                as: inv
                items:
                  - { id: INV001, status: Paid, method: Credit card, amount: "₹2,500" }
                  - { id: INV002, status: Pending, method: UPI, amount: "₹1,500" }
                  - { id: INV003, status: Unpaid, method: Bank transfer, amount: "₹3,500" }
              children:
                - type: element
                  props: { tag: tr }
                  children:
                    - { type: text, props: { tag: td, value: "{{ inv.id }}" }, style: { font-weight: 500 } }
                    - type: element
                      props: { tag: td }
                      children:
                        - type: ui-badge
                          props:
                            text: "{{ inv.status }}"
                            variant: "{{ inv.status == 'Paid' ? 'secondary' : inv.status == 'Unpaid' ? 'destructive' : 'outline' }}"
                    - { type: text, props: { tag: td, value: "{{ inv.method }}" } }
                    - { type: text, props: { tag: td, value: "{{ inv.amount }}" }, style: { text-align: right } }

    # ---------------------------------------------------------------- navigation
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Breadcrumb and Pagination } }
        - type: ui-breadcrumb
          props:
            items:
              - { label: Home, href: "#" }
              - { label: Components, href: "#" }
              - { label: Breadcrumb }
        - type: ui-pagination
          props: { page: 5, pages: 12, href: "#page-{{ p }}" }

    # ---------------------------------------------------------------- sidebar
    # A sidebar is a whole-page layout; here it's boxed in so it fits the gallery. See the
    # blocks for full pages.
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Sidebar } }
        - type: ui-text
          props: { variant: muted, text: "The button in the header, or ⌘B / Ctrl+B, narrows it to its icons. On a phone it opens as a sheet." }
        - type: ui-sidebar-layout
          props: { bind: sidebar, collapsible: icon }
          style: { min-height: 0, height: 440, overflow: hidden, border: 1px solid $color.border, border-radius: $radius.lg }
          children:
            - type: ui-sidebar
              style: { height: 100% }
              children:
                - type: ui-sidebar-header
                  children:
                    - type: ui-sidebar-group
                      style: { padding: 0 }
                      children:
                        - type: ui-sidebar-item
                          props: { label: Acme Inc, icon: "◆", badge: Enterprise }
                          children:
                            - { type: ui-sidebar-item, props: { label: Acme Inc, active: true } }
                            - { type: ui-sidebar-item, props: { label: Acme Corp. } }
                - type: ui-sidebar-content
                  children:
                    - type: ui-sidebar-group
                      props: { label: Platform }
                      children:
                        - { type: ui-sidebar-item, props: { label: Dashboard, icon: "⌂", href: "#", active: true } }
                        - { type: ui-sidebar-item, props: { label: Inbox, icon: "✉", href: "#", badge: 12 } }
                        - type: ui-sidebar-item
                          props: { label: Documentation, icon: "☰", open: true }
                          children:
                            - { type: ui-sidebar-item, props: { label: Introduction, href: "#" } }
                            - { type: ui-sidebar-item, props: { label: Get Started, href: "#" } }
                            - { type: ui-sidebar-item, props: { label: Changelog, href: "#" } }
                        - { type: ui-sidebar-item, props: { label: Settings, icon: "⚙", href: "#" } }
                - type: ui-sidebar-footer
                  children:
                    - type: ui-sidebar-group
                      style: { padding: 0 }
                      children:
                        - { type: ui-sidebar-item, props: { label: shadcn, icon: "☺", badge: m@example.com, href: "#" } }
            - type: element
              props: { tag: header }
              style: { display: flex, align-items: center, gap: 8, height: 56, flex-shrink: 0, padding: 0 16px }
              children:
                - { type: ui-sidebar-trigger }
                - { type: ui-separator, props: { orientation: vertical }, style: { height: 16, align-self: center, margin-right: 8 } }
                - type: ui-breadcrumb
                  props: { items: [{ label: Platform, href: "#" }, { label: Dashboard }] }
            - type: element
              style: { display: flex, flex-direction: column, gap: 16, flex: 1, padding: 0 16px 16px }
              children:
                - type: element
                  style: { display: grid, grid-template-columns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 16 }
                  children:
                    - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                    - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                    - { type: element, style: { aspect-ratio: 16 / 9, border-radius: 12, background: $color.subtle } }
                - { type: element, style: { flex: 1, border-radius: 12, background: $color.subtle } }

    # ---------------------------------------------------------------- chat
    # The input appends to `chat` and streams the reply from api/chat, which
    # examples/serve.py answers; a plain static server can't, so the reply fails there.
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Chat } }
        - type: ui-text
          props: { variant: muted, text: "A conversation that keeps to its latest message, bubbles with threaded replies, and an input that streams the reply in. Enter sends; Shift+Enter starts a new line." }
        - type: ui-card
          style: { padding: 0, gap: 0, overflow: hidden }
          children:
            - type: ui-conversation
              props: { messages: "{{ chat }}", typing: "{{ chatWaiting }}", assistant: { name: Assistant, initials: AI }, height: 380, empty: "Ask anything to start." }
            - type: element
              style: { padding: 12, border-top: 1px solid $color.border }
              children:
                - type: ui-chat-input
                  props:
                    messages: chat
                    bind: chatDraft
                    waiting: chatWaiting
                    endpoint: api/chat
                    placeholder: Ask about the report…
                    suggestions: [What drove the growth?, Compare with last year]
                  children:
                    - { type: ui-button, props: { label: "+", variant: ghost, size: icon }, attrs: { aria-label: Attach } }
        - type: stack
          props: { direction: row, gap: 8, align: center }
          children:
            - { type: ui-button, props: { label: New chat, variant: outline, size: sm }, on: { click: { action: set_state, key: chat, value: [] } } }
            - { type: ui-separator, props: { orientation: vertical }, style: { height: 16, margin: 0 8px } }
            - { type: ui-typing-indicator }
            - { type: ui-text, props: { variant: muted, text: "ui-typing-indicator on its own" } }

    # ---------------------------------------------------------------- avatar, aspect ratio
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Avatar and Aspect ratio } }
        - type: stack
          props: { direction: row, gap: 12, align: center }
          children:
            - { type: ui-avatar, props: { fallback: KS } }
            - { type: ui-avatar, props: { fallback: AB, size: 56 } }
            - { type: ui-avatar, props: { fallback: SM, size: 32 } }
        - type: ui-aspect-ratio
          props: { ratio: "16 / 9" }
          style: { max-width: 480, border-radius: $radius.lg, background: "linear-gradient(135deg, #18181b, #71717a)" }
          children:
            - type: stack
              props: { align: center, justify: center }
              children:
                - { type: text, props: { value: "16 : 9" }, style: { color: "#fafafa", font-size: 24, font-weight: 600 } }

    # ---------------------------------------------------------------- typography
    - type: stack
      props: { gap: 16 }
      children:
        - { type: ui-heading, props: { level: 2, text: Typography } }
        - { type: ui-heading, props: { level: 3, text: The joke tax } }
        - type: ui-text
          props: { text: "The king, seeing how much happier his subjects were, realized the error of his ways and repealed the joke tax." }
        - { type: ui-text, props: { variant: blockquote, text: "\"After all,\" he said, \"everyone enjoys a good joke, so it's only fair that they should pay for the privilege.\"" } }
        - type: ui-text
          children:
            - { type: text, props: { value: "Render with " } }
            - { type: ui-text, props: { variant: code, text: "irender render --ui-kit" } }
            - { type: text, props: { value: " to enable these components." } }
        - { type: ui-text, props: { variant: large, text: Are you absolutely sure? } }
        - { type: ui-text, props: { variant: small, text: Email address } }
