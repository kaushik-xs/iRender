root:
  type: element
  style:
    display: grid
    grid-template-columns: "minmax(0, 1fr)"
    min-height: 100svh
    font-family: $font.body
    color: $color.text
    background: $color.surface
    "@lg": { grid-template-columns: "260px minmax(0, 1fr)" }
  children:
    # ---------------------------------------------------------------- the sidebar
    - type: element
      props: { tag: aside }
      attrs: { aria-label: Components }
      style:
        display: flex
        flex-direction: column
        gap: 16
        padding: 16px
        border-bottom: 1px solid $color.border
        # Below the examples' bar when the site puts one at the top (`--site-nav`).
        "@lg": { position: sticky, top: "var(--site-nav, 0px)", height: "calc(100svh - var(--site-nav, 0px))", box-sizing: border-box, overflow-y: auto, padding: 24px 16px, border-bottom: 0, border-right: 1px solid $color.border }
      children:
        - type: stack
          props: { direction: row, align: center, gap: 8 }
          children:
            - { type: text, props: { value: irender-ui-kit }, style: { font-weight: 700, font-size: 15 } }
            - type: if
              props: { when: "{{ componentCount }}" }
              children: [ { type: ui-badge, props: { text: "{{ componentCount }} components", variant: secondary } } ]
        # Jumps to a section: ⌘K or Ctrl+K anywhere on the page.
        - type: ui-command-dialog
          props: { trigger: Search components…, triggerVariant: outline, shortcut: mod+k, title: Search components }
          parts: { trigger: { style: { width: 100%, justify-content: flex-start, color: $color.muted, font-weight: 400 } } }
          children:
            - type: list
              props: { items: "{{ groups }}", as: g }
              style: { display: contents }
              children:
                - type: ui-command-group
                  props: { heading: "{{ g.title }}" }
                  children:
                    - type: list
                      props: { items: "{{ g.sections }}", as: sec }
                      style: { display: contents }
                      children:
                        - { type: ui-command-item, props: { label: "{{ sec.title }}", href: "#{{ sec.id }}" } }
        # The link for the section being read is marked as you scroll.
        - type: ui-scroll-spy
          props: { label: Sections }
          style: { display: flex, flex-direction: column, gap: 22, max-height: 260, overflow-y: auto, "@lg": { max-height: none, overflow: visible } }
          children:
            - type: list
              props: { items: "{{ groups }}", as: g }
              style: { display: contents }
              children:
                - type: element
                  style: { display: flex, flex-direction: column, gap: 1 }
                  children:
                    - { type: text, props: { value: "{{ g.title }}" }, style: { padding: 0 8px 6px, color: $color.text, font-size: 11, font-weight: 600, letter-spacing: 0.06em, text-transform: uppercase, opacity: 0.55 } }
                    - type: list
                      props: { items: "{{ g.sections }}", as: sec }
                      style: { display: contents }
                      children:
                        # One line each, muted until hovered or current (the scroll spy
                        # marks the current one); the full title is in its tooltip.
                        - type: element
                          props: { tag: a }
                          attrs: { href: "#{{ sec.id }}", title: "{{ sec.title }}" }
                          style:
                            display: flex
                            align-items: center
                            gap: 6
                            padding: 4px 8px
                            border-radius: $radius.sm
                            color: $color.muted
                            font-size: 13.5
                            line-height: 1.5
                            white-space: nowrap
                            text-decoration: none
                            transition: color .15s, background .15s
                            ":hover": { color: $color.text, background: "color-mix(in srgb, var(--color-text) 5%, transparent)" }
                            ":focus-visible": { outline: 2px solid $color.primary }
                            # The page's style outranks the scroll spy's, so the current
                            # link is styled here.
                            "&[aria-current=location]": { color: $color.text, font-weight: 600, background: "color-mix(in srgb, var(--color-text) 7%, transparent)" }
                          children:
                            - { type: text, props: { value: "{{ sec.nav }}" }, style: { min-width: 0, overflow: hidden, text-overflow: ellipsis } }
                            # Introduced lately (docs.json's `new`).
                            - { type: if, props: { when: "{{ sec.new }}" }, children: [ { type: ui-badge, props: { text: New, variant: success }, style: { flex: none, padding: 0 6px, font-size: 11, line-height: 1.5 } } ] }

    # ---------------------------------------------------------------- the content
    - type: element
      props: { tag: main }
      style: { min-width: 0, padding: 32px 20px 96px, "@lg": { padding: 40px 48px 120px } }
      children:
        - type: element
          style: { display: flex, flex-direction: column, gap: 80, max-width: 920px, margin: 0 auto }
          children:
            - type: stack
              props: { gap: 8 }
              children:
                # The Theme button in the bar at the top picks a palette, radius, density,
                # text size, font, chart colours and the mode, for every example page.
                - type: stack
                  props: { direction: row, justify: space-between, align: center, gap: 16, wrap: true }
                  children:
                    - { type: ui-heading, props: { level: 1, text: irender-ui-kit } }
                - type: ui-text
                  props: { variant: lead, text: "Ready-made components for iRender documents, in the style of shadcn/ui. Each section says what a component is for, shows how to write it, lets you try it, and lists its props." }

            # ---------------------------------------------------------------- overview
            - type: element
              props: { tag: section }
              attrs: { id: overview, aria-labelledby: overview-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.overview }}", as: s }
                  style: { display: contents }
                  children: &head
                    - type: stack
                      props: { gap: 12 }
                      children:
                        - { type: text, props: { value: "{{ s.group }}" }, style: { color: $color.muted, font-size: 12, font-weight: 600, letter-spacing: 0.06em, text-transform: uppercase } }
                        - type: element
                          style: { display: flex, flex-wrap: wrap, align-items: center, gap: 10 }
                          children:
                            - { type: ui-heading, props: { level: 2, text: "{{ s.title }}" }, attrs: { id: "{{ s.id }}-title" } }
                            - { type: if, props: { when: "{{ s.new }}" }, children: [ { type: ui-badge, props: { text: New, variant: success }, style: { flex: none, padding: 0 6px, font-size: 12, line-height: 1.5 } } ] }
                        - { type: ui-text, props: { variant: lead, text: "{{ s.summary }}" }, style: { font-size: 16, max-width: 72ch } }
                        - type: element
                          props: { tag: pre }
                          attrs: { tabindex: 0, aria-label: "Usage: {{ s.title }}" }
                          style: { margin: 0, padding: 14px 16px, overflow-x: auto, border: 1px solid $color.border, border-radius: $radius.md, background: "color-mix(in srgb, var(--color-text) 4%, var(--color-surface))", font-family: "ui-monospace, SFMono-Regular, Menlo, monospace", font-size: 13, line-height: 1.55 }
                          children: [ { type: text, props: { tag: code, value: "{{ s.usage }}" } } ]
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: ui-card
                  props: { title: Welcome, description: "This card, its input and button are the overview's snippet, rendered." }
                  style: { max-width: 420 }
                  children:
                    - { type: ui-input, props: { bind: name, placeholder: Your name } }
                    - type: ui-card-footer
                      children:
                        - type: ui-button
                          props: { label: "Say hi to {{ name || 'you' }}" }
                          on: { click: { action: set_state, key: toast, value: { title: "Hi {{ name || 'there' }}!" } } }
                - { type: if, props: { when: "{{ api.overview.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.overview }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: &api
                    - type: element
                      style: { border: 1px solid $color.border, border-radius: $radius.md, overflow: hidden }
                      children:
                        - type: element
                          style: { display: flex, flex-wrap: wrap, align-items: baseline, gap: 4px 12px, padding: 10px 14px, border-bottom: 1px solid $color.border, background: "color-mix(in srgb, var(--color-text) 3%, var(--color-surface))" }
                          children:
                            - { type: text, props: { tag: code, value: "{{ c.name }}" }, style: { font-family: "ui-monospace, SFMono-Regular, Menlo, monospace", font-size: 13, font-weight: 600 } }
                            - { type: if, props: { when: "{{ c.new }}" }, children: [ { type: ui-badge, props: { text: New, variant: success }, style: { flex: none, padding: 0 6px, font-size: 11, line-height: 1.5 } } ] }
                            - { type: text, props: { value: "{{ c.doc }}" }, style: { color: $color.muted, font-size: 13 } }
                        - type: if
                          props: { when: "{{ c.props.length > 0 }}" }
                          children:
                            - type: ui-table
                              parts: { table: { style: { font-size: 13 } } }
                              children:
                                - type: element
                                  props: { tag: thead }
                                  children:
                                    - type: element
                                      props: { tag: tr }
                                      children:
                                        - { type: text, props: { tag: th, value: Prop }, style: { width: 22% } }
                                        - { type: text, props: { tag: th, value: Type }, style: { width: 26% } }
                                        - { type: text, props: { tag: th, value: Description } }
                                - type: list
                                  props: { tag: tbody, items: "{{ c.props }}", as: p }
                                  children:
                                    - type: element
                                      props: { tag: tr }
                                      children:
                                        - type: element
                                          props: { tag: td }
                                          style: { vertical-align: top }
                                          children:
                                            - { type: text, props: { tag: code, value: "{{ p.name }}" }, style: { font-family: "ui-monospace, SFMono-Regular, Menlo, monospace", font-weight: 500 } }
                                            - type: if
                                              props: { when: "{{ p.required }}" }
                                              children: [ { type: text, props: { value: " required" }, style: { color: $color.destructive, font-size: 11 } } ]
                                        - { type: text, props: { tag: td, value: "{{ p.type }}" }, style: { vertical-align: top, color: $color.muted, font-family: "ui-monospace, SFMono-Regular, Menlo, monospace", font-size: 12, white-space: normal, overflow-wrap: anywhere } }
                                        - { type: text, props: { tag: td, value: "{{ p.doc }}" }, style: { white-space: normal } }
                        - type: element
                          style: { padding: 8px 14px, border-top: 1px solid $color.border, color: $color.muted, font-size: 12 }
                          children:
                            - { type: text, props: { value: "{{ (c.parts ? 'Parts: ' + c.parts + ' · ' : '') + 'Children: ' + (c.children ? 'yes' : 'no') }}" } }

            # ---------------------------------------------------------------- theme
            - type: element
              props: { tag: section }
              attrs: { id: theme, aria-labelledby: theme-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.theme }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: element
                  style: { display: flex, flex-wrap: wrap, align-items: center, gap: 12 }
                  children:
                    - { type: ui-theme-toggle }
                    - { type: ui-theme-option, props: { option: palette, swatch: color.primary } }
                    - { type: ui-theme-option, props: { option: radius } }
                    - { type: ui-theme-option, props: { option: density } }
                - { type: ui-label, props: { text: Custom colours } }
                - { type: ui-theme-colors }
                - { type: ui-text, props: { variant: muted, text: "The Theme button at the top of the page holds all of these: ui-theme-panel in a ui-popover." } }
                - { type: if, props: { when: "{{ api.theme.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.theme }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- button
            - type: element
              props: { tag: section }
              attrs: { id: button, aria-labelledby: button-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.button }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 8, wrap: true, align: center }
                      children:
                        - { type: ui-button, props: { label: Default } }
                        - { type: ui-button, props: { label: Secondary, variant: secondary } }
                        - { type: ui-button, props: { label: Destructive, variant: destructive } }
                        - { type: ui-button, props: { label: Outline, variant: outline } }
                        - { type: ui-button, props: { label: Ghost, variant: ghost } }
                        - { type: ui-button, props: { label: Link, variant: link } }
                        # The second brand colour: Theme > Custom colours > Second colour.
                        - { type: ui-button, props: { label: Brand, variant: brand } }
                    - type: stack
                      props: { direction: row, gap: 8, wrap: true, align: center }
                      children:
                        - { type: ui-button, props: { label: Small, size: sm, variant: outline } }
                        - { type: ui-button, props: { label: Default size, variant: outline } }
                        - { type: ui-button, props: { label: Large, size: lg, variant: outline } }
                        - { type: ui-button, props: { label: "+", size: icon, variant: outline }, attrs: { aria-label: Add } }
                        - { type: ui-button, props: { label: Disabled, disabled: true } }
                        - { type: ui-button, props: { label: "Link that looks like a button", href: "#button", variant: secondary } }
                        - type: ui-button
                          props: { label: "Saved {{ saved }} times" }
                          on: { click: { action: set_state, key: saved, value: "{{ saved + 1 }}" } }

                - { type: if, props: { when: "{{ api.button.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.button }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- split-button
            - type: element
              props: { tag: section }
              attrs: { id: split-button, aria-labelledby: split-button-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.split_button }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "A primary action, with the others one click away. The arrow opens a menu: ↑ ↓ to move, Enter to choose, Esc to close." }
                    - type: stack
                      props: { direction: row, gap: 12, wrap: true, align: center }
                      children:
                        - type: ui-split-button
                          props: { label: Download PDF, variant: outline, menuLabel: More download formats }
                          on: { click: { action: set_state, key: toast, value: { title: "Downloading report.pdf", description: "Your PDF is on its way." } } }
                          children:
                            - type: ui-menu-item
                              props: { label: Download Excel }
                              on: { click: { action: set_state, key: toast, value: { title: "Downloading report.xlsx", description: "Your spreadsheet is on its way." } } }
                            - type: ui-menu-item
                              props: { label: Download CSV }
                              on: { click: { action: set_state, key: toast, value: { title: "Downloading report.csv", description: "Your CSV is on its way." } } }
                            - { type: ui-menu-separator }
                            - type: ui-menu-item
                              props: { label: Email the report }
                              on: { click: { action: set_state, key: toast, value: { title: "Report emailed", description: "Sent to your inbox." } } }
                        - type: ui-split-button
                          props: { label: Publish, menuLabel: More publishing options }
                          on: { click: { action: set_state, key: toast, value: { title: "Published", description: "The page is live." } } }
                          children:
                            - type: ui-menu-item
                              props: { label: Schedule… }
                              on: { click: { action: set_state, key: toast, value: { title: "Scheduled", description: "It goes live tomorrow at 9:00." } } }
                            - type: ui-menu-item
                              props: { label: Publish to staging }
                              on: { click: { action: set_state, key: toast, value: { title: "Published to staging", description: "Check it before it goes live." } } }
                            - { type: ui-menu-separator }
                            - type: ui-menu-item
                              props: { label: Unpublish, variant: destructive }
                              on: { click: { action: set_state, key: toast, value: { title: "Unpublished", description: "The page is offline." } } }
                        - type: ui-split-button
                          props: { label: Save draft, variant: secondary, size: sm, menuLabel: More save options }
                          on: { click: { action: set_state, key: toast, value: { title: "Draft saved", description: "" } } }
                          children:
                            - { type: ui-menu-label, props: { text: Save as } }
                            - type: ui-menu-item
                              props: { label: Template }
                              on: { click: { action: set_state, key: toast, value: { title: "Saved as a template", description: "" } } }
                            - type: ui-menu-item
                              props: { label: Copy }
                              on: { click: { action: set_state, key: toast, value: { title: "Saved a copy", description: "" } } }

                - { type: if, props: { when: "{{ api.split_button.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.split_button }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- toggle
            - type: element
              props: { tag: section }
              attrs: { id: toggle, aria-labelledby: toggle-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.toggle }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 12, wrap: true, align: center }
                      children:
                        - { type: ui-toggle, props: { bind: bold, label: B }, attrs: { aria-label: Bold }, style: { font-weight: 700 } }
                        - { type: ui-toggle, props: { bind: italic, label: I, variant: outline }, attrs: { aria-label: Italic }, style: { font-style: italic } }
                        - { type: ui-separator, props: { orientation: vertical }, style: { height: 24 } }
                        - type: ui-toggle-group
                          props:
                            bind: align
                            variant: outline
                            options:
                              - { value: left, label: Left }
                              - { value: center, label: Center }
                              - { value: right, label: Right }
                        - { type: ui-separator, props: { orientation: vertical }, style: { height: 24 } }
                        - type: ui-toggle-group
                          props:
                            bind: marks
                            multiple: true
                            variant: outline
                            options:
                              - { value: underline, label: Underline }
                              - { value: strike, label: Strike }
                    - type: ui-text
                      props: { text: "Preview text" }
                      style:
                        font-weight: "{{ bold ? 700 : 400 }}"
                        font-style: "{{ italic ? 'italic' : 'normal' }}"
                        text-align: "{{ align || 'left' }}"
                        text-decoration-line: "{{ (includes(marks, 'underline') ? 'underline ' : '') + (includes(marks, 'strike') ? 'line-through' : '') || 'none' }}"
                        max-width: 420
                    - type: stack
                      props: { direction: row, gap: 12, align: center }
                      style: { max-width: 420 }
                      children:
                        - { type: ui-slider, props: { bind: volume }, attrs: { aria-label: Volume } }
                        - { type: ui-text, props: { variant: muted, text: "{{ volume }}%" }, style: { min-width: 40 } }
                    - type: ui-progress
                      props: { value: "{{ volume }}" }
                      style: { max-width: 420 }

                - { type: if, props: { when: "{{ api.toggle.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.toggle }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- form-controls
            - type: element
              props: { tag: section }
              attrs: { id: form-controls, aria-labelledby: form-controls-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.form_controls }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: element
                      style: { display: grid, gap: 24, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))", align-items: start }
                      children:
                        - type: stack
                          props: { gap: 16 }
                          children:
                            - type: stack
                              props: { gap: 8 }
                              children:
                                - { type: ui-label, props: { text: Email, for: email } }
                                - { type: ui-input, props: { bind: email, type: email, placeholder: you@example.com }, attrs: { id: email } }
                                - type: ui-text
                                  props: { variant: muted, text: "{{ email ? 'We will write to ' + email : 'We never share it.' }}" }
                            - type: stack
                              props: { gap: 8 }
                              children:
                                - { type: ui-label, props: { text: Framework, for: framework } }
                                - type: ui-select
                                  props:
                                    bind: framework
                                    placeholder: Select a framework
                                    options:
                                      - { value: axum, label: Axum }
                                      - { value: actix, label: Actix Web }
                                      - { value: rocket, label: Rocket }
                                  attrs: { id: framework }
                            - type: stack
                              props: { gap: 8 }
                              children:
                                - { type: ui-label, props: { text: Bio, for: bio } }
                                - { type: ui-textarea, props: { bind: bio, placeholder: Tell us a little about yourself }, attrs: { id: bio } }
                                - type: ui-text
                                  props: { variant: muted, text: "{{ bio.length }} / 160 characters" }
                                  style: { color: "{{ bio.length > 160 ? 'var(--color-destructive)' : 'inherit' }}" }
                        - type: stack
                          props: { gap: 16 }
                          children:
                            - { type: ui-checkbox, props: { bind: terms, label: Accept terms and conditions } }
                            - { type: ui-checkbox, props: { label: Disabled checkbox, disabled: true, checked: true } }
                            - { type: ui-switch, props: { bind: notifications, label: Email notifications } }
                            - { type: ui-switch, props: { bind: airplane, label: "Airplane mode {{ airplane ? 'on' : 'off' }}" } }
                            - { type: ui-separator }
                            - { type: ui-label, props: { text: Plan } }
                            - type: ui-radio-group
                              props:
                                bind: plan
                                options:
                                  - { value: free, label: Free }
                                  - { value: pro, label: Pro }
                                  - { value: team, label: Team (coming soon), disabled: true }
                            - { type: ui-text, props: { variant: muted, text: "Chosen: {{ plan }}" } }
                            - type: ui-button
                              props: { label: Continue, disabled: "{{ !terms }}" }
                              style: { align-self: flex-start }

                - { type: if, props: { when: "{{ api.form_controls.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.form_controls }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- field
            - type: element
              props: { tag: section }
              attrs: { id: field, aria-labelledby: field-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.field }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: element
                      style: { display: grid, gap: 24, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))" }
                      children:
                        - type: stack
                          props: { gap: 20 }
                          children:
                            - type: ui-field
                              props:
                                label: Username
                                for: username
                                description: Letters and numbers; at least 3.
                                error: "{{ username != '' && username.length < 3 ? 'Too short: at least 3 characters.' : '' }}"
                              children:
                                - type: ui-input
                                  props: { bind: username, placeholder: pedro }
                                  attrs: { id: username, aria-invalid: "{{ username != '' && username.length < 3 }}" }
                            - type: ui-field
                              props: { label: Marketing emails, for: marketing, description: About new features and offers., orientation: horizontal }
                              children:
                                - { type: ui-switch, props: { bind: marketing }, parts: { control: { attrs: { id: marketing } } } }
                        - type: stack
                          props: { gap: 20 }
                          children:
                            - type: ui-field
                              props: { label: Website, for: site }
                              children:
                                - type: ui-input-group
                                  props: { prefix: "https://", suffix: .com }
                                  children:
                                    - { type: ui-input, props: { bind: site, placeholder: example }, attrs: { id: site } }
                            - type: ui-field
                              props: { label: Amount, for: amount }
                              children:
                                - type: ui-input-group
                                  props: { prefix: "$" }
                                  children:
                                    - { type: ui-input, props: { bind: amount, placeholder: "0.00" }, attrs: { id: amount, inputmode: decimal } }
                                    - type: ui-button
                                      props: { label: Clear, variant: ghost, size: sm }
                                      on: { click: { action: set_state, key: amount, value: "" } }
                    - type: stack
                      props: { direction: row, gap: 12, align: center, wrap: true }
                      children:
                        - type: ui-button-group
                          props: { label: View }
                          children:
                            - type: ui-button
                              props: { label: Grid, variant: "{{ view == 'grid' ? 'secondary' : 'outline' }}" }
                              attrs: { aria-pressed: "{{ view == 'grid' }}" }
                              on: { click: { action: set_state, key: view, value: grid } }
                            - type: ui-button
                              props: { label: List, variant: "{{ view == 'list' ? 'secondary' : 'outline' }}" }
                              attrs: { aria-pressed: "{{ view == 'list' }}" }
                              on: { click: { action: set_state, key: view, value: list } }
                        - type: ui-button-group
                          props: { label: Pages }
                          children:
                            - { type: ui-button, props: { label: "‹ Previous", variant: outline, size: sm } }
                            - { type: ui-button, props: { label: "Next ›", variant: outline, size: sm } }
                        - type: ui-button-group
                          props: { orientation: vertical, label: Zoom }
                          children:
                            - { type: ui-button, props: { label: "+", variant: outline, size: icon } }
                            - { type: ui-button, props: { label: "−", variant: outline, size: icon } }

                - { type: if, props: { when: "{{ api.field.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.field }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- combobox
            - type: element
              props: { tag: section }
              attrs: { id: combobox, aria-labelledby: combobox-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.combobox }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 8 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "A searchable select in the style of react-select. Keyboard: ↑ ↓ to move, Enter or Tab to choose, Esc to close, Backspace to remove the last value." }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: "Single, searchable and clearable" } }
                    - type: ui-combobox
                      props:
                        bind: colour
                        clearable: true
                        label: Colour
                        options:
                          - { value: ocean, label: Ocean }
                          - { value: blue, label: Blue }
                          - { value: purple, label: Purple, disabled: true }
                          - { value: red, label: Red }
                          - { value: orange, label: Orange }
                          - { value: yellow, label: Yellow }
                          - { value: green, label: Green }
                          - { value: forest, label: Forest }
                          - { value: slate, label: Slate }
                          - { value: silver, label: Silver }
                    - { type: ui-text, props: { variant: muted, text: "colour = {{ colour }}" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: "Multi, with a fixed value" } }
                    - type: ui-combobox
                      props:
                        bind: flavours
                        multiple: true
                        clearable: true
                        fixed: [chocolate]
                        label: Flavours
                        options:
                          - { value: chocolate, label: Chocolate }
                          - { value: strawberry, label: Strawberry }
                          - { value: vanilla, label: Vanilla }
                          - { value: salted-caramel, label: Salted caramel }
                          - { value: pistachio, label: Pistachio }
                          - { value: mango, label: Mango }
                    - { type: ui-text, props: { variant: muted, text: "flavours = {{ flavours }} (Chocolate can't be removed)" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Grouped options with descriptions } }
                    - type: ui-combobox
                      props:
                        bind: grouped
                        clearable: true
                        label: Grouped
                        placeholder: Pick a colour or a flavour…
                        options:
                          - label: Colours
                            options:
                              - { value: ocean, label: Ocean, description: "#00B8D9" }
                              - { value: red, label: Red, description: "#FF5630" }
                              - { value: green, label: Green, description: "#36B37E" }
                          - label: Flavours
                            options:
                              - { value: vanilla, label: Vanilla, description: Creamy and classic }
                              - { value: chocolate, label: Chocolate, description: Rich cocoa }
                              - { value: mango, label: Mango, description: Seasonal, disabled: true }
                    - { type: ui-text, props: { variant: muted, text: "grouped = {{ grouped }}" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Load as you type } }
                    - type: ui-combobox
                      props:
                        bind: fruits
                        multiple: true
                        searchUrl: api/fruits.json
                        debounce: 300
                        label: Fruits
                        placeholder: Type to search fruits…
                        noOptionsText: Type to search
                    - { type: ui-text, props: { variant: muted, text: "Each pause in typing asks api/fruits.json?q=…; answers are cached. fruits = {{ fruits }}" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: "Creatable: type a new tag and press Enter" } }
                    - type: ui-combobox
                      props:
                        bind: tags
                        multiple: true
                        creatable: true
                        clearable: true
                        label: Tags
                        options: [rust, javascript, python, go, kotlin, swift]
                    - { type: ui-text, props: { variant: muted, text: "tags = {{ tags }}" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: Options from state } }
                    - type: stack
                      props: { direction: row, gap: 8 }
                      children:
                        - type: ui-button
                          props: { label: Indian cities, variant: outline, size: sm }
                          on: { click: [{ action: set_state, key: cities, value: [Mumbai, Pune, Bengaluru, Chennai] }, { action: set_state, key: city, value: null }] }
                        - type: ui-button
                          props: { label: German cities, variant: outline, size: sm }
                          on: { click: [{ action: set_state, key: cities, value: [Berlin, Munich, Hamburg] }, { action: set_state, key: city, value: null }] }
                    - { type: ui-combobox, props: { bind: city, options: "{{ cities }}", clearable: true, label: City, placeholder: Choose a city… } }
                    - { type: ui-text, props: { variant: muted, text: "city = {{ city }}" } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: "Not searchable, disabled and loading" } }
                    - type: ui-combobox
                      props:
                        bind: size
                        searchable: false
                        disabled: "{{ locked }}"
                        loading: "{{ busy }}"
                        label: Size
                        options: [{ value: s, label: Small }, { value: m, label: Medium }, { value: l, label: Large }]
                    - type: stack
                      props: { direction: row, gap: 16 }
                      children:
                        - { type: ui-switch, props: { bind: locked, label: Disabled } }
                        - { type: ui-switch, props: { bind: busy, label: Loading } }

                - type: stack
                  props: { gap: 8 }
                  children:
                    - { type: ui-label, props: { text: In a form } }
                    - type: element
                      props: { tag: form }
                      attrs: { action: "#", id: team-form }
                      style: { display: grid, gap: 8 }
                      children:
                        - type: ui-combobox
                          props:
                            bind: team
                            multiple: true
