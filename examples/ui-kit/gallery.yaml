                      props: { trigger: "@peduarte starred 3 repositories" }
                      style: { max-width: 360 }
                      children:
                        - type: stack
                          props: { gap: 6 }
                          children:
                            - { type: ui-text, props: { variant: code, text: "@radix-ui/primitives" } }
                            - { type: ui-text, props: { variant: code, text: "@radix-ui/colors" } }
                            - { type: ui-text, props: { variant: code, text: "@stitches/react" } }

                - { type: if, props: { when: "{{ api.tabs.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.tabs }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- menubar
            - type: element
              props: { tag: section }
              attrs: { id: menubar, aria-labelledby: menubar-title }
