              props: { tag: section }
              attrs: { id: chat, aria-labelledby: chat-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.chat }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                # The input appends to `chat` and streams the reply from api/chat, which
                # examples/serve.py answers; a plain static server can't, so the reply fails there.
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "A conversation that keeps to its latest message, bubbles with threaded replies, and an input that streams the reply in. Enter sends; Shift+Enter starts a new line." }
                    - type: ui-card
                      style: { padding: 0, gap: 0, overflow: hidden }
                      children:
                        - type: ui-conversation
                          props: { messages: "{{ chat }}", typing: "{{ chatWaiting }}", assistant: { name: Assistant, initials: AI }, height: 380, empty: "Ask anything to start." }
                        - type: element
                          style: { padding: 12, border-top: 1px solid $color.border }
                          children:
                            - type: ui-chat-input
                              props:
                                messages: chat
                                bind: chatDraft
                                waiting: chatWaiting
                                endpoint: api/chat
                                placeholder: Ask about the report…
                                suggestions: [What drove the growth?, Compare the plans in a table]
                              children:
                                - { type: ui-button, props: { label: "+", variant: ghost, size: icon }, attrs: { aria-label: Attach } }
                    - type: stack
                      props: { direction: row, gap: 8, align: center }
                      children:
                        - { type: ui-button, props: { label: New chat, variant: outline, size: sm }, on: { click: { action: set_state, key: chat, value: [] } } }
                        - { type: ui-separator, props: { orientation: vertical }, style: { height: 16, margin: 0 8px } }
                        - { type: ui-typing-indicator }
                        - { type: ui-text, props: { variant: muted, text: "ui-typing-indicator on its own" } }

                # The same text with and without `streaming`; the chat's input sets it on a
                # reply while it arrives.
                - { type: ui-label, props: { text: A reply as it arrives } }
                - type: ui-card
                  style: { padding: 16px, gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 12, align: center }
                      children:
                        - { type: ui-slider, props: { bind: arrivedAt, min: 0, max: 7 }, attrs: { aria-label: How much of the reply has arrived } }
                        - { type: ui-text, props: { variant: muted, text: "{{ (arrivedAt + 1) + ' of ' + arriving.length }}" }, style: { white-space: nowrap } }
                    - type: element
                      style: { display: grid, gap: 16, grid-template-columns: "minmax(0, 1fr)", "@md": { grid-template-columns: "minmax(0, 1fr) minmax(0, 1fr)" }, align-items: start }
                      children:
                        - type: stack
                          props: { gap: 8 }
                          children:
                            - { type: ui-text, props: { variant: muted, text: "With streaming: true" } }
                            - { type: ui-message, props: { role: assistant, initials: AI, content: "{{ arriving[arrivedAt] }}", streaming: true } }
                        - type: stack
                          props: { gap: 8 }
                          children:
                            - { type: ui-text, props: { variant: muted, text: Without } }
                            - { type: ui-message, props: { role: assistant, initials: AI, content: "{{ arriving[arrivedAt] }}" } }

                - { type: ui-label, props: { text: A message written in the document } }
                - type: ui-message
                  props: { role: assistant, name: Assistant, initials: AI, time: "9:42", content: "Here's the summary you asked for." }
                - { type: if, props: { when: "{{ api.chat.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.chat }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- agent
            - type: element
              props: { tag: section }
              attrs: { id: agent, aria-labelledby: agent-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.agent }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - { type: ui-attachment, props: { files: "{{ agFiles }}", bindFiles: agFiles } }
                - { type: ui-sources, props: { layout: chips, text: "Highs reach 18°C in March [1], and rooms average €165 [2].", items: [ { title: City guide, url: "https://example.com/guide", text: Monthly weather. }, { title: Rates 2026, page: 12 } ] } }
                - { type: ui-tool-call, props: { title: Searched rooms, name: search_rooms, status: done, duration: 1840, input: { nights: 2 }, output: { found: 14 } } }
                - { type: ui-tool-call, props: { title: Hold three rooms, name: hold_rooms, status: approval, input: { rooms: 3 }, bindApproval: agOk } }
                - { type: if, props: { when: "{{ api.agent.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.agent }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- trace
            - type: element
              props: { tag: section }
              attrs: { id: trace, aria-labelledby: trace-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.trace }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - { type: ui-trace, props: { title: Run 12, spans: [ { id: a, name: Answer, kind: agent, start: 0, duration: 4200 }, { id: b, parent: a, name: Search, kind: tool, start: 100, duration: 900, output: { hits: 3 } }, { id: c, parent: a, name: Write, kind: model, start: 1100, duration: 3000, tokens: 812 } ] } }
                - { type: ui-questionnaire, props: { bind: qnAnswers, bindDone: qnDone, title: A few questions, doneText: "Thank you.", questions: [ { id: what, question: What is it for?, options: [Work, Home], other: true, required: true }, { id: sure, question: How sure are you?, type: scale, labels: [Not, Very] }, { id: note, question: Anything else?, type: text } ] } }
                - { type: if, props: { when: "{{ api.trace.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.trace }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- carousel
            - type: element
              props: { tag: section }
              attrs: { id: carousel, aria-labelledby: carousel-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.carousel }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: ui-carousel
                  props: { label: Plans, size: 240, dots: true, loop: true }
                  children:
                    - { type: ui-card, props: { title: Starter, description: For side projects. }, children: [ { type: ui-heading, props: { level: 3, text: Free } } ] }
                    - { type: ui-card, props: { title: Pro, description: For growing teams. }, children: [ { type: ui-heading, props: { level: 3, text: $12 / month } } ] }
                    - { type: ui-card, props: { title: Team, description: For organisations. }, children: [ { type: ui-heading, props: { level: 3, text: $40 / month } } ] }
                    - { type: ui-card, props: { title: Enterprise, description: Talk to us. }, children: [ { type: ui-heading, props: { level: 3, text: Custom } } ] }
                - { type: if, props: { when: "{{ api.carousel.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.carousel }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            - { type: ui-toaster, props: { bind: toast } }

