                        - { type: ui-illustration, props: { name: no-people, size: 100%, animate: "{{ illAnimate }}", primary: "{{ illColours == 'ocean' ? '#0284c7' : illColours == 'berry' ? '#be185d' : illColours == 'forest' ? '#15803d' : null }}", secondary: "{{ illColours == 'ocean' ? '#f97316' : illColours == 'berry' ? '#f59e0b' : illColours == 'forest' ? '#a3e635' : null }}" } }
                        - { type: text, props: { tag: code, value: no-people }, style: { font-size: 12, color: $color.muted } }
                    - type: element
                      style: { display: flex, flex-direction: column, align-items: center, gap: 6, padding: 12, border: 1px solid $color.border, border-radius: $radius.md }
                      children:
                        - { type: ui-illustration, props: { name: deleted, size: 100%, animate: "{{ illAnimate }}", primary: "{{ illColours == 'ocean' ? '#0284c7' : illColours == 'berry' ? '#be185d' : illColours == 'forest' ? '#15803d' : null }}", secondary: "{{ illColours == 'ocean' ? '#f97316' : illColours == 'berry' ? '#f59e0b' : illColours == 'forest' ? '#a3e635' : null }}" } }
                        - { type: text, props: { tag: code, value: deleted }, style: { font-size: 12, color: $color.muted } }
                    - type: element
                      style: { display: flex, flex-direction: column, align-items: center, gap: 6, padding: 12, border: 1px solid $color.border, border-radius: $radius.md }
                      children:
                        - { type: ui-illustration, props: { name: empty-calendar, size: 100%, animate: "{{ illAnimate }}", primary: "{{ illColours == 'ocean' ? '#0284c7' : illColours == 'berry' ? '#be185d' : illColours == 'forest' ? '#15803d' : null }}", secondary: "{{ illColours == 'ocean' ? '#f97316' : illColours == 'berry' ? '#f59e0b' : illColours == 'forest' ? '#a3e635' : null }}" } }
                        - { type: text, props: { tag: code, value: empty-calendar }, style: { font-size: 12, color: $color.muted } }
                    - type: element
                      style: { display: flex, flex-direction: column, align-items: center, gap: 6, padding: 12, border: 1px solid $color.border, border-radius: $radius.md }
                      children:
                        - { type: ui-illustration, props: { name: welcome, size: 100%, animate: "{{ illAnimate }}", primary: "{{ illColours == 'ocean' ? '#0284c7' : illColours == 'berry' ? '#be185d' : illColours == 'forest' ? '#15803d' : null }}", secondary: "{{ illColours == 'ocean' ? '#f97316' : illColours == 'berry' ? '#f59e0b' : illColours == 'forest' ? '#a3e635' : null }}" } }
                        - { type: text, props: { tag: code, value: welcome }, style: { font-size: 12, color: $color.muted } }
                - { type: ui-label, props: { text: "In ui-empty, for an empty state" } }
                - type: ui-empty
                  props: { illustration: out-of-stock, title: Out of stock, description: "This item is sold out for now. We'll email you as soon as it's back." }
                  children: [ { type: ui-button, props: { label: Notify me, variant: outline } } ]
                - type: ui-text
                  props: { variant: muted, text: "Whole error pages (404, 500, 403, maintenance, offline, an expired session) and a page of empty states are among the blocks." }
                - { type: if, props: { when: "{{ api.illustration.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.illustration }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- progress
            - type: element
              props: { tag: section }
              attrs: { id: progress, aria-labelledby: progress-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.progress }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: ui-progress
                      props: { value: "{{ progress }}" }
                    - type: stack
                      props: { direction: row, gap: 8, align: center }
                      children:
                        - type: ui-button
                          props: { label: "−10", variant: outline, size: sm }
                          on: { click: { action: set_state, key: progress, value: "{{ progress <= 10 ? 0 : progress - 10 }}" } }
                        - type: ui-button
                          props: { label: "+10", variant: outline, size: sm }
                          on: { click: { action: set_state, key: progress, value: "{{ progress >= 90 ? 100 : progress + 10 }}" } }
                        - { type: ui-text, props: { variant: muted, text: "{{ progress }}%" } }
                    - type: stack
                      props: { direction: row, gap: 16, align: center, wrap: true }
                      children:
                        - { type: ui-progress-ring, props: { value: "{{ progress }}", label: Progress } }
                        - { type: ui-progress-ring, props: { value: "{{ progress }}", size: 72, tone: "{{ progress >= 100 ? 'success' : progress < 30 ? 'danger' : 'primary' }}", label: Progress } }
                        - { type: ui-progress-ring, props: { value: "{{ progress }}", size: 28, text: "", label: Progress } }
                    - type: stack
                      props: { direction: row, gap: 12, align: center }
                      children:
                        - { type: ui-skeleton, props: { width: 48, height: 48, round: true } }
                        - type: stack
                          props: { gap: 8 }
                          style: { flex: 1 }
                          children:
                            - { type: ui-skeleton, props: { width: 60%, height: 14 } }
                            - { type: ui-skeleton, props: { width: 40%, height: 14 } }

                - { type: if, props: { when: "{{ api.progress.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.progress }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- spinner
            - type: element
              props: { tag: section }
              attrs: { id: spinner, aria-labelledby: spinner-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.spinner }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 16, align: center }
                      children:
                        - { type: ui-spinner }
                        - { type: ui-spinner, props: { size: 24 } }
                        - { type: ui-spinner, props: { size: 32 }, style: { color: $color.muted } }
                        - type: ui-button
                          props: { disabled: true }
                          children:
                            - { type: ui-spinner, props: { label: Saving } }
                            - { type: text, props: { value: Saving… } }
                    - type: element
                      style: { display: grid, gap: 16, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))" }
                      children:
                        - type: ui-empty
                          props: { icon: "📁", title: No projects yet, description: "You haven't created any projects. Start by creating your first one." }
                          children:
                            - type: stack
                              props: { direction: row, gap: 8 }
                              children:
                                - { type: ui-button, props: { label: Create project } }
                                - { type: ui-button, props: { label: Import, variant: outline } }
                        - type: ui-scroll-area
                          props: { height: 220, label: Tags }
                          style: { border: 1px solid $color.border }
                          children:
                            - type: list
                              props:
                                items: [v1.2.0-beta.50, v1.2.0-beta.49, v1.2.0-beta.48, v1.2.0-beta.47, v1.2.0-beta.46, v1.2.0-beta.45, v1.2.0-beta.44, v1.2.0-beta.43, v1.2.0-beta.42, v1.2.0-beta.41, v1.2.0-beta.40, v1.2.0-beta.39]
                                as: tag
                              style: { padding: 4px 16px }
                              children:
                                - { type: element, props: { tag: div }, style: { padding: 8px 0, font-size: 14px, border-bottom: 1px solid $color.border }, children: [ { type: text, props: { value: "{{ tag }}" } } ] }

                - { type: if, props: { when: "{{ api.spinner.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.spinner }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- banner
            - type: element
              props: { tag: section }
              attrs: { id: banner, aria-labelledby: banner-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.banner }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - { type: ui-banner, props: { title: New., text: Reports can be scheduled now., bind: bnShut }, style: { border-radius: 8 } }
                - { type: ui-banner, props: { text: "Your trial ends soon.", tone: warning, variant: solid, align: start }, style: { border-radius: 8 } }
                - { type: if, props: { when: "{{ api.banner.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.banner }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- tour
            - type: element
              props: { tag: section }
              attrs: { id: tour, aria-labelledby: tour-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.tour }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { direction: row, gap: 12, wrap: true }
                  children:
                    - { type: ui-button, props: { label: Start the tour }, attrs: { id: tour-a }, on: { click: { action: set_state, key: trStep, value: 0 } } }
                    - { type: ui-button, props: { label: A second part, variant: outline }, attrs: { id: tour-b } }
                - { type: ui-tour, props: { bind: trStep, steps: [ { target: "#tour-a", title: It starts here, text: Press Next to go on. }, { target: "#tour-b", title: And goes on, text: The arrow keys work too. } ] } }
                - { type: if, props: { when: "{{ api.tour.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.tour }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- dialog
            - type: element
              props: { tag: section }
              attrs: { id: dialog, aria-labelledby: dialog-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.dialog }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 8, wrap: true }
                      children:
                        - type: ui-dialog
                          props: { trigger: Edit profile, title: Edit profile, description: "Make changes to your profile here. Click save when you're done.", id: edit-profile }
                          children:
                            - type: stack
                              props: { gap: 8 }
                              children:
                                - { type: ui-label, props: { text: Name, for: profile-name } }
                                - { type: ui-input, props: { bind: profile }, attrs: { id: profile-name } }
                            - type: ui-dialog-footer
                              children:
                                - { type: ui-dialog-close, props: { label: Cancel, variant: outline } }
                                - type: ui-dialog-close
                                  props: { label: Save changes }
                                  on:
                                    click:
                                      - { action: set_state, key: toast, value: { title: Profile saved } }
                        - type: ui-alert-dialog
                          props:
                            trigger: "Delete {{ projects }} projects"
                            triggerVariant: destructive
                            title: Are you absolutely sure?
                            description: This permanently deletes your projects. It cannot be undone.
                            id: confirm-delete
                          children:
                            - type: ui-dialog-footer
                              children:
                                - { type: ui-dialog-close, props: { label: Cancel, variant: outline } }
                                - type: ui-dialog-close
                                  props: { label: "Yes, delete", variant: destructive }
                                  on:
                                    click:
                                      - { action: set_state, key: projects, value: 0 }
                                      - { action: set_state, key: toast, value: { title: Projects deleted, description: Nothing is left to delete., variant: destructive } }
                        - type: ui-sheet
                          props: { trigger: Open sheet, title: Settings, description: A panel along the right edge., id: settings-sheet }
                          children:
                            - { type: ui-switch, props: { bind: notifications, label: Email notifications } }
                            - { type: ui-switch, props: { bind: airplane, label: Airplane mode } }
                            - type: ui-dialog-footer
                              children:
                                - { type: ui-dialog-close, props: { label: Done } }
                        - type: ui-drawer
                          props: { trigger: Open drawer, title: Move goal, description: Set your daily activity goal. Drag the bar down to close., width: 480 }
                          children:
                            - { type: ui-slider, props: { bind: goal, min: 200, max: 600, step: 10 }, attrs: { aria-label: Daily goal } }
                            - { type: ui-text, props: { text: "{{ goal }} calories a day" }, style: { font-size: 28, font-weight: 700, text-align: center } }
                            - type: ui-dialog-footer
                              children:
                                - { type: ui-dialog-close, props: { label: Cancel, variant: outline } }
                                - { type: ui-dialog-close, props: { label: Submit } }

                - { type: if, props: { when: "{{ api.dialog.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.dialog }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- popover
            - type: element
              props: { tag: section }
              attrs: { id: popover, aria-labelledby: popover-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.popover }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 12, wrap: true, align: center }
                      children:
                        - type: ui-popover
                          props: { trigger: Dimensions, id: dimensions }
                          children:
                            - type: stack
                              props: { gap: 8 }
                              children:
                                - { type: ui-text, props: { variant: small, text: Dimensions } }
                                - { type: ui-text, props: { variant: muted, text: Set the dimensions for the layer. } }
                                - { type: ui-input, props: { value: 100% }, attrs: { aria-label: Width } }
                        - type: ui-dropdown-menu
                          props: { trigger: My account, id: account-menu }
                          children:
                            - { type: ui-menu-label, props: { text: My account } }
                            - type: ui-menu-item
                              props: { label: Profile, shortcut: "⇧⌘P" }
                              on: { click: { action: call, name: menu, args: { item: profile } } }
                            - { type: ui-menu-item, props: { label: Billing, shortcut: "⌘B" } }
                            - { type: ui-menu-item, props: { label: Docs, href: "#docs" } }
                            - { type: ui-menu-separator }
                            - { type: ui-menu-item, props: { label: Log out, variant: destructive } }
                        - type: ui-tooltip
                          props: { text: Add to library }
                          children:
                            - { type: ui-button, props: { label: Hover me, variant: outline } }
                        - type: ui-tooltip
                          props: { text: Shown below, side: bottom }
                          children:
                            - { type: ui-button, props: { label: And me, variant: ghost } }
                        - type: ui-hover-card
                          props: { trigger: "@irender", href: "#hover" }
                          children:
                            - type: stack
                              props: { direction: row, gap: 12 }
                              children:
                                - { type: ui-avatar, props: { fallback: iR } }
                                - type: stack
                                  props: { gap: 4 }
                                  children:
                                    - { type: ui-text, props: { variant: small, text: "@irender" } }
                                    - { type: ui-text, props: { variant: muted, text: "UI from configuration, rendered in Rust." } }

                - { type: if, props: { when: "{{ api.popover.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.popover }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- context-menu
            - type: element
              props: { tag: section }
              attrs: { id: context-menu, aria-labelledby: context-menu-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.context_menu }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 8 }
                  children:
                    - type: ui-text
                      props: { variant: muted, text: "Right-click the area (or Shift+F10 on something focused in it). Up and Down move, Enter chooses, Escape closes." }
                    - type: element
                      style: { display: grid, grid-template-columns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16 }
                      children:
                        - type: ui-context-menu
                          children:
                            - type: element
                              attrs: { tabindex: 0 }
                              style: { display: grid, place-items: center, height: 150, border: 1px dashed $color.border, border-radius: 8, color: $color.muted, font-size: 14 }
                              children: [ { type: text, props: { value: Right-click here } } ]
                            - { type: ui-menu-item, props: { label: Back, shortcut: "⌘[" }, on: { click: { action: set_state, key: lastAction, value: Back } } }
                            - { type: ui-menu-item, props: { label: Forward, shortcut: "⌘]", disabled: true } }
                            - { type: ui-menu-item, props: { label: Reload, shortcut: "⌘R" }, on: { click: { action: set_state, key: lastAction, value: Reload } } }
                            - { type: ui-menu-separator }
                            - { type: ui-menu-label, props: { text: People } }
                            - { type: ui-menu-item, props: { label: Pedro Duarte }, on: { click: { action: set_state, key: lastAction, value: Pedro } } }
                            - { type: ui-menu-item, props: { label: Colm Tuite }, on: { click: { action: set_state, key: lastAction, value: Colm } } }
                        # Each file says what it is with `data-context`; `clicked` gets it.
                        - type: ui-context-menu
                          props: { bind: clicked, label: File actions }
                          children:
                            - type: list
                              props:
                                as: file
                                items: [Report.pdf, Budget.xlsx, Notes.md, Logo.svg]
                              style: { display: flex, flex-direction: column, gap: 4, margin: 0, padding: 8, border: 1px solid $color.border, border-radius: 8 }
                              children:
                                - type: element
                                  attrs: { tabindex: 0, data-context: "{{ file }}" }
                                  style: { padding: 6px 10px, border-radius: 6, font-size: 14, ":hover": { background: $color.subtle }, ":focus-visible": { outline: 2px solid $color.ring } }
                                  children: [ { type: text, props: { value: "{{ file }}" } } ]
                            - { type: ui-menu-label, props: { text: "{{ clicked || 'Files' }}" } }
                            - { type: ui-menu-item, props: { label: "Open {{ clicked }}", disabled: "{{ !clicked }}" }, on: { click: { action: set_state, key: lastAction, value: "Open {{ clicked }}" } } }
                            - { type: ui-menu-item, props: { label: Rename…, disabled: "{{ !clicked }}" }, on: { click: { action: set_state, key: lastAction, value: "Rename {{ clicked }}" } } }
                            - { type: ui-menu-separator }
                            - { type: ui-menu-item, props: { label: Delete, variant: destructive, disabled: "{{ !clicked }}" }, on: { click: { action: set_state, key: lastAction, value: "Delete {{ clicked }}" } } }
                    - { type: ui-text, props: { variant: muted, text: "Last action: {{ lastAction }}" } }

                - { type: if, props: { when: "{{ api.context_menu.length > 0 }}" }, children: [ { type: ui-heading, props: { level: 4, text: API reference }, style: { margin-top: 8 } } ] }
                - type: list
                  props: { items: "{{ api.context_menu }}", as: c }
                  style: { display: flex, flex-direction: column, gap: 16, margin-top: 8 }
                  children: *api

            # ---------------------------------------------------------------- command
            - type: element
              props: { tag: section }
              attrs: { id: command, aria-labelledby: command-title }
              style: { display: flex, flex-direction: column, gap: 20, scroll-margin-top: "calc(var(--site-nav, 0px) + 16px)" }
              children:
                - type: list
                  props: { items: "{{ doc.command }}", as: s }
                  style: { display: contents }
                  children: *head
                - { type: ui-heading, props: { level: 4, text: Examples }, style: { margin-top: 8 } }
                - type: stack
                  props: { gap: 16 }
                  children:
                    - type: stack
                      props: { direction: row, gap: 24, wrap: true, align: start }
                      children:
                        - type: ui-command
                          props: { id: command, loading: "{{ cmdLoading }}", loadingText: Searching… }
                          style: { max-width: 420 }
                          children:
                            - type: ui-command-group
                              props: { heading: Suggestions }
                              children:
                                - type: ui-command-item
                                  props: { label: Calendar, icon: "📅" }
                                  on: { click: { action: set_state, key: toast, value: { title: Calendar, description: Opened the calendar. } } }
                                - type: ui-command-item
                                  props: { label: Search emoji, icon: "😀", keywords: [smiley, face] }
                                  on: { click: { action: set_state, key: toast, value: { title: Emoji, description: Pick one. } } }
                                - { type: ui-command-item, props: { label: Calculator, icon: "🧮", disabled: true } }
                            - { type: ui-command-separator }
                            - type: ui-command-group
                              props: { heading: Settings }
                              children:
                                - type: ui-command-item
                                  props: { label: Profile, icon: "👤", shortcut: "⌘P" }
                                  on: { click: { action: set_state, key: toast, value: { title: Profile } } }
                                - { type: ui-command-item, props: { label: Billing, icon: "💳", shortcut: "⌘B", href: "#billing" } }
                                - type: ui-command-item
                                  props: { label: Settings, icon: "⚙️", shortcut: "⌘S", keywords: preferences }
                                  on: { click: { action: set_state, key: toast, value: { title: Settings } } }
                                - { type: ui-command-item, props: { label: Change theme…, icon: "🎨", page: theme } }
                            - type: ui-command-page
                              props: { id: theme, title: Theme }
                              children:
                                - type: ui-command-item
                                  props: { label: Light, icon: "☀️" }
                                  on: { click: { action: set_state, key: toast, value: { title: Light theme } } }
