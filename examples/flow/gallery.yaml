# Diagrams from irender-flow-kit, in irender-ui-kit cards.
#
#   cargo run -p irender-cli -- render examples/flow/gallery.yaml --data examples/flow/gallery.data.json \
#     --ui-kit --flow-kit -o flow.html
#
# The first flow is React Flow JSON exactly as React Flow saves it, drawn with the
# kit's default node and edge. The workflow and the ER diagram define their own
# node types, which are ordinary iRender trees with ports placed inside them.
version: 1
state:
  # The workflow: nodes and edges in state, so drags write back and the list of
  # nodes rebuilds in the browser.
  wfNodes:
    - { id: trigger, type: trigger, data: { label: POST /orders, detail: HTTP trigger } }
    - { id: validate, type: step, data: { label: Validate order, detail: setVariable } }
    - { id: in_stock, type: if, data: { label: In stock?, detail: "items.all(i => i.available)" } }
    - id: route
      type: switch
      data: { label: Shipping, detail: order.shipping, cases: [{ handle: express, label: Express }, { handle: standard, label: Standard }, { handle: pickup, label: Pickup }] }
    - { id: backorder, type: step, data: { label: Create backorder, detail: serviceCall } }
    - { id: courier, type: step, data: { label: Book courier, detail: httpRequest } }
    - { id: post, type: step, data: { label: Book post, detail: httpRequest } }
    - { id: store, type: step, data: { label: Notify store, detail: serviceCall } }
    - { id: join, type: merge, data: { label: Merge, inputs: [0, 1, 2] } }
    - { id: reply, type: step, data: { label: Reply 201, detail: respond } }
  wfEdges:
    - { id: e1, source: trigger, target: validate }
    - { id: e2, source: validate, target: in_stock }
    - { id: e3, source: in_stock, sourceHandle: "true", target: route }
    - { id: e4, source: in_stock, sourceHandle: "false", target: backorder, type: retry, label: no stock }
    - { id: e5, source: route, sourceHandle: express, target: courier }
    - { id: e6, source: route, sourceHandle: standard, target: post }
    - { id: e7, source: route, sourceHandle: pickup, target: store }
    - { id: e8, source: courier, target: join, targetHandle: input-0 }
    - { id: e9, source: post, target: join, targetHandle: input-1 }
    - { id: e10, source: store, target: join, targetHandle: input-2 }
    - { id: e11, source: join, target: reply, animated: true }
  step: null
  dir: LR
  doomed: null
  # Containers: a loop with steps inside it
  sfNodes:
    - { id: fetch, type: step, position: { x: 0, y: 90 }, data: { label: Fetch orders } }
    - { id: each, type: loop, position: { x: 240, y: 0 }, width: 470, height: 230, data: { label: For each order } }
    - { id: check, type: step, parentId: each, position: { x: 40, y: 90 }, data: { label: Check stock } }
    - { id: reserve, type: step, parentId: each, position: { x: 260, y: 90 }, data: { label: Reserve items } }
    - { id: summary, type: step, position: { x: 800, y: 90 }, data: { label: Send summary } }
  sfEdges:
    - { id: fetch-each, source: fetch, target: each }
    - { id: each-check, source: each, sourceHandle: start, target: check }
    - { id: check-reserve, source: check, target: reserve }
    - { id: each-summary, source: each, sourceHandle: done, target: summary }
  sfQuery: ""
  sfMatches: []
  sfHistory: null
  # The ER diagram
  table: null
  keysOnly: false
  erDir: LR
  goTo: null
root:
  type: stack
  props: { gap: 40 }
  style:
    max-width: 1120px
    margin: 0 auto
    padding: 40px 24px 80px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 8 }
      children:
        - type: stack
          props: { direction: row, justify: space-between, align: center, gap: 16, wrap: true }
          children:
            - { type: ui-heading, props: { level: 1, text: irender-flow-kit } }
            - { type: ui-theme-toggle }
        - type: ui-text
          props:
            variant: lead
            text: "Node-and-edge diagrams from React Flow's JSON. Every node type is an ordinary iRender tree, so nodes can hold any component."

    # ------------------------------------------------------------ plain JSON
    - type: ui-card
      props:
        title: React Flow JSON, as saved
        description: "No templates: the kit's default node shows data.label. Edge types pick the path (default, step, smoothstep, straight); labels, markers and animated edges come from the edge."
      children:
        - type: ui-flow
          props:
            nodes: "{{ basic.nodes }}"
            edges: "{{ basic.edges }}"
            title: A plain flow
            height: 360
            draggable: true

    # -------------------------------------------------------------- workflow
    - type: ui-card
      props:
        title: A workflow you can edit, with node types of its own
        description: "Laid out automatically. The switch has a port per case and the merge a port per input, from the node's data. Drag from a port to connect, or onto empty canvas to add a step there. Click or Shift-drag to select, Delete to remove (it asks first), and drag or click a palette item to add one."
      children:
        # The palette: drag an item onto the flow, or click it.
        - type: stack
          props: { direction: row, gap: 8, align: center, wrap: true }
          style: { margin-bottom: 12 }
          children:
            - { type: ui-text, props: { variant: muted, text: "Add:" } }
            - type: ui-flow-item
              props: { flow: wf, node: { type: step, data: { label: New step, detail: setVariable } } }
              children: [{ type: ui-badge, props: { text: Step, variant: outline } }]
            - type: ui-flow-item
              props: { flow: wf, node: { type: if, data: { label: New condition, detail: "x > 0" } } }
              children: [{ type: ui-badge, props: { text: If, variant: outline } }]
            - type: ui-flow-item
              props: { flow: wf, node: { type: merge, data: { label: Merge, inputs: [0, 1] } } }
              children: [{ type: ui-badge, props: { text: Merge, variant: outline } }]
        - type: ui-flow
          attrs: { id: wf }
          props:
            nodes: "{{ wfNodes }}"
            edges: "{{ wfEdges }}"
            title: Order workflow
            layout: layered
            direction: "{{ dir }}"
            edgePath: smoothstep
            rankGap: 64
            editable: true
            bind: step
            bindNodes: wfNodes
            bindEdges: wfEdges
            # A trigger may only lead to a step; other nodes connect freely.
            connect: { pairs: [{ source: trigger, target: step }, { source: step }, { source: if }, { source: switch }, { source: merge }] }
            newNode: { type: step, data: { label: New step, detail: setVariable } }
            confirmDelete: confirm-delete
            bindDelete: doomed
            height: 520
            minimap: true
          children:
            - type: ui-flow-node
              props: { type: trigger }
              style: { text-align: left, border-color: $color.primary, min-width: 170 }
              children:
                - { type: ui-badge, props: { text: Trigger, variant: default } }
                - { type: text, props: { tag: div, value: "{{ node.data.label }}" }, style: { font-weight: 600, margin-top: 6 } }
                - { type: text, props: { tag: div, value: "{{ node.data.detail }}" }, style: { color: $color.muted, font-size: 11 } }
                - { type: ui-flow-port, props: { type: source } }

            - type: ui-flow-node
              props: { type: step }
              style: { text-align: left, min-width: 170 }
              children:
                - { type: text, props: { tag: div, value: "{{ node.data.label }}" }, style: { font-weight: 600 } }
                - { type: text, props: { tag: div, value: "{{ node.data.detail }}" }, style: { color: $color.muted, font-size: 11, font-family: "ui-monospace, monospace" } }
                - { type: ui-flow-port, props: { type: target } }
                - { type: ui-flow-port, props: { type: source } }

            # Two named outputs, in fixed places whatever the direction.
            - type: ui-flow-node
              props: { type: if }
              style: { text-align: left, min-width: 170, border-style: dashed }
              children:
                - { type: ui-badge, props: { text: If, variant: secondary } }
                - { type: text, props: { tag: div, value: "{{ node.data.label }}" }, style: { font-weight: 600, margin-top: 6 } }
                - { type: text, props: { tag: div, value: "{{ node.data.detail }}" }, style: { color: $color.muted, font-size: 11, font-family: "ui-monospace, monospace" } }
                - { type: ui-flow-port, props: { type: target } }
                - { type: ui-flow-port, props: { id: "true", side: "{{ dir == 'TB' ? 'bottom' : 'right' }}" }, style: { background: "#16a34a" } }
                - { type: ui-flow-port, props: { id: "false", side: "{{ dir == 'TB' ? 'right' : 'bottom' }}" }, style: { background: "#dc2626" } }

            # A port per case: each row is positioned, so its port sits on the row.
            - type: ui-flow-node
              props: { type: switch, variant: plain }
              style:
                min-width: 190
                border: 1px solid $color.border
                border-radius: 8
                background: $color.surface
                font-size: 12
              children:
                - type: element
                  style: { padding: "8px 12px", border-bottom: 1px solid $color.border }
                  children:
                    - { type: ui-badge, props: { text: Switch, variant: secondary } }
                    - { type: text, props: { tag: div, value: "{{ node.data.label }}" }, style: { font-weight: 600, margin-top: 6 } }
                - type: list
                  props: { items: "{{ node.data.cases }}", as: c }
                  children:
                    - type: element
                      style: { position: relative, padding: "4px 12px", text-align: right, color: $color.muted }
                      children:
                        - { type: text, props: { value: "{{ c.label }}" } }
                        - { type: ui-flow-port, props: { id: "{{ c.handle }}", side: right } }
                - { type: ui-flow-port, props: { type: target } }

            # As many inputs as the node's data says.
            - type: ui-flow-node
              props: { type: merge }
              style: { min-width: 110, min-height: 64, display: flex, align-items: center, justify-content: center, font-weight: 600 }
              children:
                - { type: text, props: { value: "{{ node.data.label }}" } }
                - type: list
                  props: { items: "{{ node.data.inputs }}", as: i }
                  children:
                    - { type: ui-flow-port, props: { id: "input-{{ i }}", type: target } }
                - { type: ui-flow-port, props: { type: source } }

            - type: ui-flow-edge
              props: { marker: arrowclosed }
            - type: ui-flow-edge
              props: { type: retry, path: step, marker: arrowclosed }
              style: { stroke: "#dc2626", stroke-dasharray: "4 3" }
              parts: { label: { style: { color: "#dc2626", font-weight: 600 } } }

            - type: ui-flow-panel
              props: { position: top-left }
              children:
                - { type: ui-toggle-group, props: { bind: dir, options: [LR, TB], size: sm, variant: outline } }
            - type: ui-flow-panel
              props: { position: top-right }
              children:
                - type: if
                  props: { when: "{{ step }}" }
                  children:
                    - type: ui-card
                      props: { title: "{{ step }}", description: Selected step }
                      style: { width: 220 }
                      children:
                        - { type: ui-button, props: { label: Deselect, size: sm, variant: outline }, on: { click: { action: set_state, key: step, value: null } } }

        # Opened by the flow before it deletes; its buttons answer it.
        - type: ui-alert-dialog
          props:
            id: confirm-delete
            title: Delete from the workflow?
            description: "{{ doomed ? doomed.nodes.length + ' step(s) and ' + doomed.edges.length + ' connection(s) will be removed.' : '' }}"
          children:
            - type: ui-dialog-footer
              children:
                - { type: ui-dialog-close, props: { label: Cancel, variant: outline }, on: { click: { action: call, name: flow.cancel, args: { flow: wf } } } }
                - { type: ui-dialog-close, props: { label: Delete, variant: destructive }, on: { click: { action: call, name: flow.delete, args: { flow: wf } } } }

    # ------------------------------------------------------------ containers
    - type: ui-card
      props:
        title: Containers, undo and search
        description: "The loop is a container: drag a step into it or out of it, and resize it from its corner. Its start port only reaches steps inside it, and other edges stay within one container. ⌘C / ⌘V copy and paste (the loop with what's inside), ⌘Z undoes."
      children:
        - type: stack
          props: { direction: row, gap: 8, align: center, wrap: true }
          style: { margin-bottom: 12 }
          children:
            - { type: ui-input, props: { bind: sfQuery, placeholder: Find a step… }, style: { width: 200 } }
            - { type: ui-text, props: { variant: muted, text: "{{ sfQuery ? sfMatches.length + ' found' : '' }}" } }
            - { type: ui-button, props: { label: Previous, size: sm, variant: outline, disabled: "{{ sfMatches.length < 2 }}" }, on: { click: { action: call, name: flow.prev, args: { flow: sub } } } }
            - { type: ui-button, props: { label: Next, size: sm, variant: outline, disabled: "{{ sfMatches.length < 2 }}" }, on: { click: { action: call, name: flow.next, args: { flow: sub } } } }
            - { type: element, style: { flex: 1 } }
            - { type: ui-button, props: { label: Undo, size: sm, variant: outline, disabled: "{{ !sfHistory || sfHistory.undo == 0 }}" }, on: { click: { action: call, name: flow.undo, args: { flow: sub } } } }
            - { type: ui-button, props: { label: Redo, size: sm, variant: outline, disabled: "{{ !sfHistory || sfHistory.redo == 0 }}" }, on: { click: { action: call, name: flow.redo, args: { flow: sub } } } }
        - type: ui-flow
          attrs: { id: sub }
          props:
            nodes: "{{ sfNodes }}"
            edges: "{{ sfEdges }}"
            title: Subflow
            editable: true
            bindNodes: sfNodes
            bindEdges: sfEdges
            bindHistory: sfHistory
            search: "{{ sfQuery }}"
            bindMatches: sfMatches
            connect: { sameParent: true }
            newEdge: { type: smoothstep }
            newNode: { type: step, data: { label: New step } }
            edgePath: smoothstep
            height: 420
          children:
            - type: ui-flow-node
              props: { type: step }
              style: { min-width: 140 }
              children:
                - { type: text, props: { value: "{{ node.data.label }}" } }
                - { type: ui-flow-port, props: { type: target } }
                - { type: ui-flow-port, props: { type: source } }
            - type: ui-flow-node
              props: { type: loop, variant: plain, container: true, resizable: true, minWidth: 260, minHeight: 140 }
              style:
                border: 1.5px dashed $color.border
                border-radius: 12
                background: "color-mix(in srgb, $color.subtle 60%, transparent)"
                font-size: 12
              children:
                - type: element
                  style: { padding: "8px 12px", font-weight: 600, color: $color.muted }
                  children: [{ type: text, props: { value: "↻ {{ node.data.label }}" } }]
                - { type: ui-flow-port, props: { type: target } }
                # Inside, top left, facing in: it starts the loop's body.
                - type: element
                  style: { position: absolute, left: 12, top: 44, width: 0, height: 0 }
                  children:
                    - { type: ui-flow-port, props: { id: start, scope: children, side: right, offset: 0 }, style: { background: $color.primary } }
                - { type: ui-flow-port, props: { id: done } }
            - type: ui-flow-edge
              props: { marker: arrowclosed }

    # ------------------------------------------------------------ ER diagram
    - type: ui-card
      props:
        title: An ER diagram from server data
        description: "Tables are server data; the keys-only switch is state, read inside each node. Floating edges meet the boxes' borders. Click a table to highlight its neighbours."
      children:
        - type: ui-flow
          props:
            nodes: "{{ er.tables }}"
            edges: "{{ er.relations }}"
            title: Orders schema
            layout: layered
            direction: "{{ erDir }}"
            rankGap: 100
            highlight: neighbors
            bind: table
            center: "{{ goTo }}"
            draggable: true
            background: lines
            minimap: true
            height: 560
          children:
            - type: ui-flow-node
              props: { variant: plain }
              style:
                width: 230
                border: 1px solid $color.border
                border-radius: 8
                background: $color.surface
                font-size: 12
                overflow: hidden
                box-shadow: 0 1px 2px rgb(0 0 0 / 0.06)
              children:
                - type: element
                  style: { padding: "8px 12px", font-weight: 600, background: $color.subtle, border-bottom: 1px solid $color.border }
                  children: [{ type: text, props: { value: "{{ node.data.label }}" } }]
                - type: list
                  props: { items: "{{ node.data.columns }}", as: col }
                  children:
                    - type: if
                      props: { when: "{{ !keysOnly || col.pk || col.fk }}" }
                      children:
                        - type: element
                          style: { display: flex, justify-content: space-between, gap: 12, padding: "4px 12px", font-family: "ui-monospace, monospace", font-size: 11 }
                          children:
                            - { type: text, props: { value: "{{ col.pk ? '🔑 ' : col.fk ? '↗ ' : '' }}{{ col.name }}" } }
                            - { type: text, props: { value: "{{ col.type }}" }, style: { color: $color.muted } }
            - type: ui-flow-edge
              props: { floating: true, marker: arrowclosed, path: bezier }
            - type: ui-flow-panel
              props: { position: top-left }
              children:
                - type: stack
                  props: { direction: row, gap: 12, align: center }
                  style: { background: $color.surface, padding: "6px 10px", border: 1px solid $color.border, border-radius: 8 }
                  children:
                    - { type: ui-switch, props: { bind: keysOnly, label: Keys only } }
                    - { type: ui-toggle-group, props: { bind: erDir, options: [LR, TB], size: sm, variant: outline } }
                    - { type: ui-select, props: { bind: goTo, placeholder: Go to table…, options: "{{ er.names }}" }, style: { width: 160 } }
