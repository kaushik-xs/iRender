# A coloured pill for `order.status`. Included by order-row.
type: text
props: { value: "{{ order.status }}" }
style:
  display: inline-block
  padding: 2px 10px
  border-radius: 999px
  font-size: 12px
  text-transform: capitalize
  background: "{{ order.status == 'paid' ? '#dcfce7' : order.status == 'pending' ? '#fef9c3' : '#fee2e2' }}"
  color: "{{ order.status == 'paid' ? '#166534' : order.status == 'pending' ? '#854d0e' : '#991b1b' }}"
