# A coloured pill for an order status. Takes one parameter:
#   - { type: include, props: { name: status-badge, with: { status: "{{ order.status }}" } } }
type: text
props: { value: "{{ status }}" }
style:
  display: inline-block
  padding: 2px 10px
  border-radius: 999px
  font-size: 12px
  text-transform: capitalize
  background: "{{ status == 'paid' ? '#dcfce7' : status == 'pending' ? '#fef9c3' : '#fee2e2' }}"
  color: "{{ status == 'paid' ? '#166534' : status == 'pending' ? '#854d0e' : '#991b1b' }}"
