# One KPI tile. Included inside a list with `as: stat`.
type: stack
props: { gap: $space.xs }
style:
  padding: $space.md
  border: 1px solid $color.border
  border-radius: $radius.lg
children:
  - type: text
    props: { value: "{{ stat.label }}" }
    style: { color: $color.muted, font-size: $font.size.sm }
  - type: text
    props: { value: "{{ stat.value }}" }
    style: { font-size: 26, font-weight: 600, font-variant-numeric: tabular-nums }
  - type: text
    props: { value: "{{ stat.delta >= 0 ? '▲' : '▼' }} {{ stat.delta >= 0 ? stat.delta : -stat.delta }}% vs last week" }
    style:
      font-size: $font.size.sm
      color: "{{ stat.delta >= 0 ? 'var(--color-positive)' : 'var(--color-negative)' }}"
