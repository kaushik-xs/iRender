# One order. Included inside a list with `as: order`. Clicking toggles its line items.
type: element
props: { tag: tr }
attrs: { aria-expanded: "{{ expanded == order.id }}", tabindex: 0 }
style:
  cursor: pointer
  border-bottom: 1px solid $color.border
  ":hover": { background: "#f8fafc" }
  "& td": { padding: 10px }
on:
  click: { action: set_state, key: expanded, value: "{{ expanded == order.id ? null : order.id }}" }
children:
  - type: text
    props: { tag: td, value: "{{ expanded == order.id ? '▾' : '▸' }} #{{ order.id }}" }
    style: { font-family: "ui-monospace, monospace" }
  - { type: text, props: { tag: td, value: "{{ order.customer }}" } }
  - type: element
    props: { tag: td }
    children:
      - { type: include, props: { name: status-badge, with: { status: "{{ order.status }}" } } }
  - type: text
    props: { tag: td, value: "₹{{ order.total }}" }
    style: { text-align: right, font-variant-numeric: tabular-nums }
