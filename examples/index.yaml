# The page that links every example, itself an iRender document built with
# irender-ui-kit. `build.sh` renders it with index.data.json, next to the examples.
version: 1
state:
  goto: null
root:
  type: stack
  props: { gap: 32 }
  style:
    max-width: 1040px
    margin: 0 auto
    padding: 48px 24px 80px
    font-family: $font.body
    color: $color.text
    background: $color.surface
  children:
    - type: stack
      props: { gap: 12 }
      children:
        # The Theme button picks a palette, radius, density, text size, font and mode;
        # every example page follows the choices.
        - type: stack
          props: { direction: row, justify: space-between, align: center }
          children:
            - { type: ui-badge, props: { text: iRender, variant: outline } }
            - { type: ui-popover, props: { trigger: Theme, align: end }, style: { width: 340 }, children: [ { type: ui-theme-panel } ] }
        - { type: ui-heading, props: { level: 1, text: Examples } }
        - type: ui-text
          props: { variant: lead, text: "Every page here was rendered from a JSON or YAML document. Open one, then read its source." }
          style: { max-width: 640 }
        # Picking an example goes straight to it.
        - type: ui-combobox
          props:
            bind: goto
            label: Jump to an example
            placeholder: Jump to an example…
            options: "{{ examples }}"
            valueField: href
            labelField: title
            descriptionField: summary
          style: { max-width: 640 }
          on: { change: { action: navigate, url: "{{ goto }}" } }

    - type: list
      props: { items: "{{ examples }}", as: ex }
      style:
        display: grid
        gap: 16
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))
      children:
        - type: ui-card
          props: { tag: article, title: "{{ ex.title }}" }
          children:
            - { type: ui-text, props: { variant: muted, text: "{{ ex.summary }}" } }
            - type: list
              props: { items: "{{ ex.features }}", as: f }
              style: { display: flex, flex-wrap: wrap, gap: 4 }
              children:
                - { type: ui-badge, props: { text: "{{ f }}", variant: secondary } }
            - type: if
              props: { when: "{{ ex.needsServer }}" }
              children:
                - type: ui-text
                  props: { variant: muted, text: "Fetches an API, so open it through the local server, not as a file." }
                  style: { font-size: 12, color: "#b45309" }
            - type: ui-card-footer
              children:
                - type: ui-button
                  props: { label: Source, variant: ghost, size: sm, href: "{{ repo }}/{{ ex.source }}" }
                  attrs: { target: _blank, rel: noopener }
                - { type: ui-button, props: { label: Open, size: sm, href: "{{ ex.href }}" } }

    - type: ui-text
      props: { variant: muted, text: "Rebuild with examples/build.sh, then serve this folder over HTTP (python3 -m http.server) so the examples that fetch can." }
      style: { font-size: 12 }
