[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaushik-xs/iRender"

[workspace.dependencies]
# Without their default features, so a crate can leave them off: Cargo before 1.89
# can't turn off a default the workspace turned on. Crates that want them say so.
irender-core = { path = "crates/irender-core", version = "0.6.2", default-features = false }
irender-style = { path = "crates/irender-style", version = "0.6.2", default-features = false }
irender-html = { path = "crates/irender-html", version = "0.6.2", default-features = false }
irender-ui-kit = { path = "crates/irender-ui-kit", version = "0.6.2" }
irender-chart-kit = { path = "crates/irender-chart-kit", version = "0.6.2" }
irender-icon-kit = { path = "crates/irender-icon-kit", version = "0.6.2" }
irender-flow-kit = { path = "crates/irender-flow-kit", version = "0.6.2" }
irender-markdown-kit = { path = "crates/irender-markdown-kit", version = "0.6.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1", features = ["indexmap2"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rayon = "1"

# The browser renderer: `cargo build -p irender-wasm --target wasm32-unknown-unknown --profile wasm`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
