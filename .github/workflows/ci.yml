name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The runtime parity test runs every expression through the browser runtime
      # with node, and skips itself when node is missing.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The CLI enables `parallel`, so a workspace run tests the renderer with it…
      - name: Test workspace
        run: cargo test --workspace
      # …and this tests the renderer on its own, without it.
      - name: Test renderer without `parallel`
        run: cargo test -p irender-html

      - name: Build without default features
        run: |
          cargo check -p irender-core --no-default-features
          cargo check -p irender-style --no-default-features
          cargo check -p irender-html --no-default-features

      # The skill's references and llms-full.txt are generated from the components and
      # READMEs; this fails when a change didn't regenerate them.
      - name: LLM docs are up to date
        run: tools/llm-docs.sh --check

  # The oldest Rust the crates say they build with (`rust-version` in Cargo.toml).
  # Clippy's `incompatible_msrv` already flags newer library APIs; this catches newer
  # language features too.
  msrv:
    name: Build on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check every crate and test
        run: cargo check --workspace --all-targets --all-features --locked

  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Set explicitly so a missing Chrome fails the job instead of skipping the tests.
      - name: Drive the examples and the UI kit in headless Chrome
        run: cargo test --workspace --test browser -- --ignored
        env:
          CHROME: /usr/bin/google-chrome

  # The same tests in the other engines: tools/playwright/dump-dom.js stands in for
  # Chrome's `--dump-dom` and opens each page in Playwright's WebKit or Firefox.
  other-browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Playwright's ${{ matrix.browser }}
        run: |
          npm ci --prefix tools/playwright
          npx --prefix tools/playwright playwright-core install --with-deps ${{ matrix.browser }}
      - name: Drive the examples and the UI kit in ${{ matrix.browser }}
        run: cargo test --workspace --test browser -- --ignored
        env:
          BROWSER: ${{ matrix.browser }}
          CHROME: ${{ github.workspace }}/tools/playwright/dump-dom.js
