name: Release

# Pushing a tag like v0.1.0 tests the workspace, builds the irender CLI for macOS and
# Linux, publishes every crate to crates.io and then creates a GitHub release with one
# .tar.gz per platform and a SHA256SUMS file. Nothing is published unless every build
# passes.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Check version and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # All crates share the workspace version, so checking one checks them all.
      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "irender-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match irender-cli version $version" >&2
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      # Packages and builds every crate as crates.io would, before any crate is uploaded.
      - run: cargo package --workspace --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p irender-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="irender-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/irender" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One crate at a time in dependency order; cargo waits for each to reach the index
      # before the crates that depend on it go up. Versions already on crates.io are
      # skipped, so a failed run can be rerun. crates.io allows a burst of new crate
      # names and then one every ten minutes, so a 429 waits and tries again.
      - name: Publish the crates
        # An explicit bash adds pipefail, so a failed `cargo publish | tee` fails.
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          crates="irender-core irender-style irender-html irender-icon-kit irender-ui-kit
                  irender-chart-kit irender-flow-kit irender-markdown-kit irender-cli"
          # A crate added to the workspace must be added to the list above too.
          missing=$(comm -23 <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort) \
                             <(printf '%s\n' $crates | sort))
          if [ -n "$missing" ]; then
            echo "not in the publish list: $missing" >&2
            exit 1
          fi
          for crate in $crates; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "irender-release ($GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            for attempt in $(seq 1 20); do
              if cargo publish -p "$crate" --locked 2>&1 | tee publish.log; then
                break
              fi
              if ! grep -q '429 Too Many Requests' publish.log || [ "$attempt" = 20 ]; then
                exit 1
              fi
              echo "rate limited; retrying $crate in two minutes"
              sleep 120
            done
          done

  github-release:
    name: GitHub release
    needs: crates-io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      # On a rerun the release already exists, so replace its files instead.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "iRender $GITHUB_REF_NAME" \
              --generate-notes
          fi
